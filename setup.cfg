[mutmut]
source_paths=
    core/
only_mutate=
    core/auth.py
    core/auth_manager.py
pytest_add_cli_args=
    -c
    mutmut_pytest.ini
pytest_add_cli_args_test_selection=
    tests/auth/test_auth_manager_behavior_contracts.py
    tests/auth/test_auth_boundary_exhaustive.py
    tests/auth/test_auth_internal_fallbacks.py
    tests/auth/test_check_kite_auth_cli_behavior.py
    tests/test_kite_client_auth_guard.py
also_copy=
    config/
    scripts/
    mutmut_pytest.ini
max_stack_depth=12
timeout_constant=2.0
timeout_multiplier=8.0
use_setproctitle=false
