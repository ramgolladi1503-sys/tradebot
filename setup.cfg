[mutmut]
paths_to_mutate=
    core/auth.py
    core/auth_manager.py
pytest_add_cli_args=
    -c
    mutmut_pytest.ini
    --noconftest
pytest_add_cli_args_test_selection=
    tests/auth_mutation/test_auth_mutation_contracts.py
also_copy=
    config/
    core/paths.py
    core/runtime_paths.py
    mutmut_pytest.ini
do_not_mutate_patterns=
    logger\.\w+
max_stack_depth=12
timeout_constant=2.0
timeout_multiplier=8.0
use_setproctitle=false
debug=true
