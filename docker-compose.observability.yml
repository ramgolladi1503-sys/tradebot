name: tradebot-observability

services:
  tradebot-metrics:
    build:
      context: .
      dockerfile: Dockerfile
    image: tradebot-observability:local
    working_dir: /app
    environment:
      PYTHONPATH: /app
      EXECUTION_MODE: PAPER
      KITE_USE_API: "false"
    command:
      - python
      - scripts/run_metrics_server.py
      - --host
      - 0.0.0.0
      - --port
      - "9108"
    ports:
      - "9108:9108"
    networks:
      - tradebot-observability

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    command:
      - --config=/etc/otelcol/config.yaml
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"
      - "8889:8889"
    depends_on:
      - tempo
    networks:
      - tradebot-observability

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=24h
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - tradebot-metrics
      - otel-collector
    networks:
      - tradebot-observability

  tempo:
    image: grafana/tempo:2.6.1
    command:
      - -config.file=/etc/tempo.yaml
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "3200:3200"
    networks:
      - tradebot-observability

  loki:
    image: grafana/loki:3.2.1
    command:
      - -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/local-config.yaml:ro
    ports:
      - "3100:3100"
    networks:
      - tradebot-observability

  promtail:
    image: grafana/promtail:3.2.1
    command:
      - -config.file=/etc/promtail/config.yaml
    volumes:
      - ./observability/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - ./logs:/var/log/tradebot/logs:ro
      - ./runtime:/var/log/tradebot/runtime:ro
    depends_on:
      - loki
    networks:
      - tradebot-observability

  grafana:
    image: grafana/grafana-oss:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo
      - loki
    networks:
      - tradebot-observability

networks:
  tradebot-observability:
    driver: bridge
