schema_version: mros-review-policy-v1
status: IMPLEMENTED_NOT_CALIBRATED
authority: Research / R
runtime_authority: NONE
bootstrap:
  s002_may_be_certified_by_board: false
  normal_board_authority_begins_no_earlier_than: S003
  reason: prevent circular certification
candidate:
  immutable_head_required: true
  branch_required: true
native_validation:
  required: true
  required_fields: [repository, branch, head, validator, python_version, command, checks, passed, failed, exit_code, timestamp]
  pass_conditions:
    failed: 0
    exit_code: 0
    head_must_equal_candidate_head: true
review:
  reviewer_count: 10
  minimum_valid_independent_reviews: 8
  max_review_rounds_per_sprint: 5
  exact_head_match_required: true
  independent_from_implementation_required: true
aggregation:
  simple_majority_forbidden: true
  critical_blocks: true
  major_blocks: true
  mandatory_unknown_blocks: true
  minimum_nonblocking_reviews: 8
  preserve_dissent: true
advancement:
  require_native_validation_pass: true
  require_review_board_acceptance: true
  require_no_blocking_finding: true
  require_sprint_acceptance_criteria: true
  m9_blocked: true
  runtime_authority_must_remain: NONE
