name: Information Migration Sequence Stage 1

on:
  push:
    branches:
      - research/information-migration-sequence-v1
    paths:
      - '.github/workflows/information-migration-sequence-stage1.yml'
      - 'research/information_migration_sequence_v1/run_stage1_signal_freeze.py'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/information-migration-sequence-stage1.yml'
      - 'research/information_migration_sequence_v1/run_stage1_signal_freeze.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze-outcome-blind-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout without broad LFS hydration
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Pull only required research datasets
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include="research/local_evidence_consolidation_v1/**/repaired_joint_underlying_option_warehouse.parquet,research/local_evidence_consolidation_v1/**/constituent_index_5m.parquet" --exclude=""

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check pandas pyarrow numpy scikit-learn

      - name: Freeze development-only communities leaders and thresholds
        run: python research/information_migration_sequence_v1/run_stage1_signal_freeze.py

      - name: Upload frozen Stage 1 evidence
        uses: actions/upload-artifact@v4
        with:
          name: information-migration-sequence-v1-stage1
          path: information-migration-sequence-v1-stage1/
          if-no-files-found: error
