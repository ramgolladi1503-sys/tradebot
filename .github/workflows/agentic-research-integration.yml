name: Agentic Research Integration

on:
  pull_request:
    branches: [main]
    paths:
      - "core/ai_certification/**"
      - "scripts/run_ai_certification_*.py"
      - "scripts/build_upstox_certification_manifest.py"
      - "tests/ai_certification/**"
      - "docs/ai_certification/**"
      - "docs/agent_reviews/agentic_research_integration_v1.md"
      - ".github/workflows/agentic-research-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      DATA_ROOT: ${{ github.workspace }}/.runtime
      EXECUTION_MODE: PAPER
      KITE_USE_API: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install repository dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run complete certification suite
        run: PYTHONPATH=. pytest -q -o addopts='' tests/ai_certification
      - name: Compile certification surfaces
        run: |
          python -m compileall -q core/ai_certification
          python -m compileall -q \
            scripts/run_ai_backtest_certification.py \
            scripts/export_ai_backtest_certification_bundle.py \
            scripts/run_ai_certification_research_manager.py \
            scripts/run_ai_certification_evaluation.py \
            scripts/build_upstox_certification_manifest.py
      - name: Run deterministic agent evaluation
        run: |
          python scripts/run_ai_certification_evaluation.py \
            --planner deterministic \
            --output .runtime/ai_certification/evals/deterministic.json
      - name: Enforce read-only orchestration boundary
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          paths = [
              Path("core/ai_certification/research_manager.py"),
              Path("core/ai_certification/gemini_client.py"),
              Path("core/ai_certification/evaluation.py"),
              Path("core/ai_certification/upstox_corpus.py"),
          ]
          forbidden_imports = {"subprocess", "kiteconnect", "upstox_client"}
          forbidden_calls = {
              "place_order", "modify_order", "cancel_order", "set_risk_limit",
              "os.system", "os.popen", "subprocess.run", "subprocess.Popen",
          }
          violations = []
          for path in paths:
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      for alias in node.names:
                          if alias.name.split(".")[0] in forbidden_imports:
                              violations.append(f"{path}:import:{alias.name}")
                  elif isinstance(node, ast.ImportFrom):
                      module = (node.module or "").split(".")[0]
                      if module in forbidden_imports:
                          violations.append(f"{path}:from:{node.module}")
                  elif isinstance(node, ast.Call):
                      current = node.func
                      parts = []
                      while isinstance(current, ast.Attribute):
                          parts.append(current.attr)
                          current = current.value
                      if isinstance(current, ast.Name):
                          parts.append(current.id)
                      name = ".".join(reversed(parts))
                      if name in forbidden_calls or (parts and parts[0] in forbidden_calls):
                          violations.append(f"{path}:call:{name}")
          if violations:
              raise SystemExit("\n".join(violations))
          print("read_only_boundary=PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: agentic-deterministic-evaluation
          path: .runtime/ai_certification/evals/deterministic.json

  gemini-online-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run secure Gemini manager and critic evaluation
        shell: bash
        run: |
          mkdir -p .runtime/ai_certification/evals
          if [ -z "${GEMINI_API_KEY:-}" ]; then
            printf '%s\n' '{"measured":false,"reason":"GEMINI_API_KEY repository secret is absent","secret_persisted":false}' \
              > .runtime/ai_certification/evals/gemini.json
            exit 0
          fi
          python scripts/run_ai_certification_evaluation.py \
            --planner gemini \
            --model gemini-2.5-flash \
            --repeats 2 \
            --request-delay-seconds 2 \
            --maximum-retries 2 \
            --output .runtime/ai_certification/evals/gemini.json
      - uses: actions/upload-artifact@v4
        with:
          name: gemini-agent-evaluation
          path: .runtime/ai_certification/evals/gemini.json
