name: tradingview-public-library-benchmark-v1

on:
  workflow_dispatch:
  push:
    branches:
      - research/tradingview-public-library-benchmark-v1
    paths:
      - 'research/tradingview_public_library_benchmark_v1/**'
      - 'scripts/run_tradingview_public_library_benchmark_v1.py'
      - 'tests/test_tradingview_public_library_*_v1.py'
      - '.github/workflows/tradingview-public-library-benchmark-v1.yml'
  pull_request:
    paths:
      - 'research/tradingview_public_library_benchmark_v1/**'
      - 'scripts/run_tradingview_public_library_benchmark_v1.py'
      - 'tests/test_tradingview_public_library_*_v1.py'
      - '.github/workflows/tradingview-public-library-benchmark-v1.yml'

permissions:
  actions: read
  contents: read

env:
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          cache: pip

      - name: Install pinned research dependencies
        run: |
          python -m pip install --upgrade "pip==26.2.1"
          python -m pip install \
            "numpy==2.5.1" \
            "pandas==3.0.5" \
            "scipy==1.18.0" \
            "scikit-learn==1.9.0" \
            "pytest==9.1.1"

      - name: Compile and run causality/fidelity tests
        run: |
          PYTHONPATH=. python -m py_compile \
            research/tradingview_public_library_benchmark_v1/benchmark.py \
            research/tradingview_public_library_benchmark_v1/guarded_runtime.py \
            research/tradingview_public_library_benchmark_v1/parameter_guard.py \
            research/tradingview_public_library_benchmark_v1/normalized_benchmark.py \
            scripts/run_tradingview_public_library_benchmark_v1.py
          PYTHONPATH=. python -m pytest -q \
            tests/test_tradingview_public_library_benchmark_v1.py \
            tests/test_tradingview_public_library_benchmark_guarded_v1.py \
            tests/test_tradingview_public_library_parameter_guard_v1.py

      - name: Restore frozen 42-page TradingView inventory
        uses: actions/download-artifact@v4
        with:
          name: tradingview-public-library-inventory-v1
          path: runtime/research/tradingview_public_library_benchmark_v1
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 31207789047

      - name: Restore immutable Aeron7 normalized OHLC artifact
        uses: actions/download-artifact@v4
        with:
          name: aeron7-index-data-and-pattern-matrix
          path: runtime/research/aeron7_pattern_matrix_v1
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 29939857560

      - name: Verify frozen input authorities
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          tv = Path('runtime/research/tradingview_public_library_benchmark_v1')
          inv = json.loads((tv / 'inventory.json').read_text())
          assert inv['page_count'] == 42
          assert inv['unique_script_count'] == 828
          assert inv['semantic_sha256'] == 'ab94735c11f004d1742c38203884cbb2713a4e7cfd032d2fcc4b48b39d4651b6'
          assert inv['enumeration_errors'] == []
          assert inv['policy']['inventory_frozen_before_benchmark_outcomes'] is True
          aeron = Path('runtime/research/aeron7_pattern_matrix_v1/aeron7_nifty_banknifty_5minute_2012_2023.csv.gz')
          assert aeron.is_file()
          h = hashlib.sha256(aeron.read_bytes()).hexdigest()
          print(json.dumps({
              'inventory_scripts': inv['unique_script_count'],
              'inventory_status_counts': inv['status_counts'],
              'inventory_semantic_sha256': inv['semantic_sha256'],
              'aeron_normalized_file_sha256': h,
              'aeron_normalized_file_size': aeron.stat().st_size,
          }, indent=2, sort_keys=True))
          PY

      - name: Execute independent 2012-2023 NIFTY/BANKNIFTY certification
        run: |
          PYTHONPATH=. python scripts/run_tradingview_public_library_benchmark_v1.py \
            --inventory runtime/research/tradingview_public_library_benchmark_v1/inventory.json \
            --normalized-aeron runtime/research/aeron7_pattern_matrix_v1/aeron7_nifty_banknifty_5minute_2012_2023.csv.gz \
            --output-root runtime/research/tradingview_public_library_benchmark_v1

      - name: Enforce final benchmark authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('runtime/research/tradingview_public_library_benchmark_v1')
          final = json.loads((root / 'final_authority.json').read_text())
          mapping = json.loads((root / 'mapping.json').read_text())
          source = json.loads((root / 'source_authority.json').read_text())
          assert mapping['policy']['mapping_frozen_before_market_outcomes'] is True
          assert mapping['policy']['inventory_testability_is_hard_gate'] is True
          assert mapping['policy']['opaque_rows_promoted_to_generic_proxy'] is False
          assert mapping['policy']['composite_rows_reduced_to_single_indicator_proxy'] is False
          assert mapping['policy']['mtf_or_complex_structure_proxying_authorized'] is False
          assert mapping['policy']['script_accounting_reconciled'] is True
          assert source['rows'] == 411420
          assert source['unique_sessions'] == 2743
          assert source['rows_by_symbol'] == {'BANKNIFTY': 205710, 'NIFTY': 205710}
          assert final['exact_tradingview_script_certified'] is False
          assert final['options_edge_certified'] is False
          assert final['shadow_authorized'] is False
          assert final['paper_authorized'] is False
          assert final['live_authorized'] is False
          assert final['order_authorized'] is False
          print(json.dumps(final, indent=2, sort_keys=True))
          PY

      - name: Upload complete benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tradingview-public-library-benchmark-v1
          path: runtime/research/tradingview_public_library_benchmark_v1/
          if-no-files-found: error
          retention-days: 30
