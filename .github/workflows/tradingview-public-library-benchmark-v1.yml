name: tradingview-public-library-benchmark-v1

on:
  workflow_dispatch:
  push:
    branches:
      - research/tradingview-public-library-benchmark-v1
    paths:
      - 'research/tradingview_public_library_benchmark_v1/**'
      - 'scripts/run_tradingview_public_library_inventory_v1.py'
      - '.github/workflows/tradingview-public-library-benchmark-v1.yml'
  pull_request:
    paths:
      - 'research/tradingview_public_library_benchmark_v1/**'
      - 'scripts/run_tradingview_public_library_inventory_v1.py'
      - '.github/workflows/tradingview-public-library-benchmark-v1.yml'

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Hydrate pinned constituent-index evidence only
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull \
            --include="research/local_evidence_consolidation_v1/**/constituent_index_5m.parquet" \
            --exclude=""

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          cache: pip

      - name: Install inventory dependencies
        run: |
          python -m pip install --upgrade "pip==26.2.1"
          python -m pip install \
            "requests==2.32.5" \
            "beautifulsoup4==4.13.5" \
            "pyarrow==25.0.0"

      - name: Inventory all 42 TradingView pages and evidence schema
        run: |
          rm -rf runtime/research/tradingview_public_library_benchmark_v1
          mkdir -p runtime/research/tradingview_public_library_benchmark_v1
          PYTHONPATH=. python scripts/run_tradingview_public_library_inventory_v1.py \
            --output runtime/research/tradingview_public_library_benchmark_v1/inventory.json \
            --source-file research/local_evidence_consolidation_v1/external_local_dirs/tradebot-ml-evidence/constituent-lead-lag-data-v1/proxy_campaign_2024_2025_v2/normalized/constituent_index_5m.parquet

      - name: Enforce inventory freeze boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('runtime/research/tradingview_public_library_benchmark_v1')
          inv = json.loads((root / 'inventory.json').read_text())
          assert inv['page_count'] == 42
          assert inv['policy']['inventory_frozen_before_benchmark_outcomes'] is True
          assert inv['policy']['all_42_pages_attempted'] is True
          assert inv['policy']['unopened_tail_accessed'] is False
          assert inv['policy']['same_corpus_structural_edge_certification_authorized'] is False
          assert inv['unique_script_count'] > 0
          print(json.dumps({
              'unique_script_count': inv['unique_script_count'],
              'status_counts': inv['status_counts'],
              'enumeration_errors': inv['enumeration_errors'],
              'semantic_sha256': inv['semantic_sha256'],
          }, indent=2, sort_keys=True))
          PY

      - name: Upload frozen inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tradingview-public-library-inventory-v1
          path: runtime/research/tradingview_public_library_benchmark_v1/
          if-no-files-found: error
          retention-days: 30
