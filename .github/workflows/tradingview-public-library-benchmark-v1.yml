name: tradingview-public-library-benchmark-v1

on:
  workflow_dispatch:
  push:
    branches:
      - research/tradingview-public-library-benchmark-v1
    paths:
      - 'research/tradingview_public_library_benchmark_v1/**'
      - 'scripts/run_tradingview_public_library_inventory_v1.py'
      - 'scripts/run_tradingview_public_library_benchmark_v1.py'
      - 'tests/test_tradingview_public_library_benchmark_v1.py'
      - '.github/workflows/tradingview-public-library-benchmark-v1.yml'
  pull_request:
    paths:
      - 'research/tradingview_public_library_benchmark_v1/**'
      - 'scripts/run_tradingview_public_library_inventory_v1.py'
      - 'scripts/run_tradingview_public_library_benchmark_v1.py'
      - 'tests/test_tradingview_public_library_benchmark_v1.py'
      - '.github/workflows/tradingview-public-library-benchmark-v1.yml'

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Hydrate pinned constituent-index evidence only
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull \
            --include="research/local_evidence_consolidation_v1/**/constituent_index_5m.parquet" \
            --exclude=""

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          cache: pip

      - name: Install pinned research dependencies
        run: |
          python -m pip install --upgrade "pip==26.2.1"
          python -m pip install \
            "requests==2.32.5" \
            "beautifulsoup4==4.13.5" \
            "numpy==2.5.1" \
            "pandas==3.0.5" \
            "scipy==1.18.0" \
            "pyarrow==25.0.0" \
            "scikit-learn==1.9.0" \
            "pytest==9.1.1"

      - name: Compile and run causality tests
        run: |
          PYTHONPATH=. python -m py_compile \
            research/tradingview_public_library_benchmark_v1/inventory.py \
            research/tradingview_public_library_benchmark_v1/benchmark.py \
            scripts/run_tradingview_public_library_inventory_v1.py \
            scripts/run_tradingview_public_library_benchmark_v1.py
          PYTHONPATH=. python -m pytest -q tests/test_tradingview_public_library_benchmark_v1.py

      - name: Inventory all 42 TradingView pages and evidence schema
        run: |
          rm -rf runtime/research/tradingview_public_library_benchmark_v1
          mkdir -p runtime/research/tradingview_public_library_benchmark_v1
          PYTHONPATH=. python scripts/run_tradingview_public_library_inventory_v1.py \
            --output runtime/research/tradingview_public_library_benchmark_v1/inventory.json \
            --source-file research/local_evidence_consolidation_v1/external_local_dirs/tradebot-ml-evidence/constituent-lead-lag-data-v1/proxy_campaign_2024_2025_v2/normalized/constituent_index_5m.parquet

      - name: Enforce inventory freeze boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('runtime/research/tradingview_public_library_benchmark_v1')
          inv = json.loads((root / 'inventory.json').read_text())
          assert inv['page_count'] == 42
          assert inv['policy']['inventory_frozen_before_benchmark_outcomes'] is True
          assert inv['policy']['all_42_pages_attempted'] is True
          assert inv['policy']['unopened_tail_accessed'] is False
          assert inv['policy']['same_corpus_structural_edge_certification_authorized'] is False
          assert inv['unique_script_count'] > 0
          print(json.dumps({
              'unique_script_count': inv['unique_script_count'],
              'status_counts': inv['status_counts'],
              'enumeration_errors': inv['enumeration_errors'],
              'semantic_sha256': inv['semantic_sha256'],
          }, indent=2, sort_keys=True))
          PY

      - name: Execute independent Aeron7 price-mechanism certification
        run: |
          PYTHONPATH=. python scripts/run_tradingview_public_library_benchmark_v1.py \
            --inventory runtime/research/tradingview_public_library_benchmark_v1/inventory.json \
            --output-root runtime/research/tradingview_public_library_benchmark_v1

      - name: Enforce benchmark authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('runtime/research/tradingview_public_library_benchmark_v1')
          final = json.loads((root / 'final_authority.json').read_text())
          mapping = json.loads((root / 'mapping.json').read_text())
          assert mapping['policy']['mapping_frozen_before_market_outcomes'] is True
          assert mapping['policy']['canonical_mechanism_is_not_exact_source_reproduction'] is True
          assert final['exact_tradingview_script_certified'] is False
          assert final['options_edge_certified'] is False
          assert final['shadow_authorized'] is False
          assert final['paper_authorized'] is False
          assert final['live_authorized'] is False
          assert final['order_authorized'] is False
          print(json.dumps(final, indent=2, sort_keys=True))
          PY

      - name: Upload complete benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tradingview-public-library-benchmark-v1
          path: runtime/research/tradingview_public_library_benchmark_v1/
          if-no-files-found: error
          retention-days: 30
