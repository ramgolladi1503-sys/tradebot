name: Mean Reversion Post-Merge Regeneration

on:
  push:
    branches:
      - research/postmerge-mean-reversion-rerun-v1
    paths:
      - ".github/workflows/mean_reversion_postmerge_regeneration.yml"
      - "scripts/run_mean_reversion_postmerge_regeneration.py"
      - "tests/test_mean_reversion_ledger_timing.py"
      - "tests/test_mean_reversion_ledger_accounting.py"
      - "docs/agent_reviews/mean_reversion_postmerge_regeneration.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mean-reversion-postmerge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate-frozen-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CORPUS_REPO: ramgolladi1503-sys/tradebot-research-corpus
      CORPUS_TAG: upstox-corpus-v1
      CORPUS_ARCHIVE_SHA256: 8c5fd5cded6475347c94f073b3411d6636c34dcc256243270e23ec8daf6b35f7
      PYTHONHASHSEED: "0"
      EVIDENCE_DIR: ${{ runner.temp }}/postmerge-evidence
      EVIDENCE_BRANCH: research/postmerge-mean-reversion-rerun-v1

    steps:
      - name: Checkout evidence branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: research/postmerge-mean-reversion-rerun-v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install focused research dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install numpy pandas pyarrow pytest pyyaml

      - name: Run frozen post-merge regeneration
        env:
          GH_TOKEN: ${{ secrets.CORPUS_READ_TOKEN }}
        run: |
          set -Eeuo pipefail
          mkdir -p "${EVIDENCE_DIR}" "${RUNNER_TEMP}/corpus-assets"

          write_status() {
            STATUS_VALUE="$1" STAGE_VALUE="$2" EXIT_VALUE="$3" python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["EVIDENCE_DIR"]) / "run_status.json"
          path.write_text(json.dumps({
              "status": os.environ["STATUS_VALUE"],
              "stage": os.environ["STAGE_VALUE"],
              "exit_code": int(os.environ["EXIT_VALUE"]),
              "producer_commit": os.environ["GITHUB_SHA"],
              "corpus_archive_sha256": os.environ["CORPUS_ARCHIVE_SHA256"],
              "execution_allowed": False,
              "paper_live_allowed": False,
          }, indent=2, sort_keys=True) + "\n")
          PY
          }

          stage="CORPUS_DOWNLOAD"
          trap 'rc=$?; write_status FAILED "${stage}" "${rc}"; exit "${rc}"' ERR
          write_status PREFLIGHT CORPUS_ACCESS_PENDING 0
          test -n "${GH_TOKEN}"

          gh release download "${CORPUS_TAG}" \
            --repo "${CORPUS_REPO}" \
            --dir "${RUNNER_TEMP}/corpus-assets" \
            --pattern "upstox_candidate_replay_v1.tar.gz" \
            --pattern "upstox_candidate_replay_v1.tar.gz.sha256" \
            --pattern "parquet_sha256_manifest.txt"

          stage="CORPUS_VERIFY_OR_EXTRACT"
          assets="${RUNNER_TEMP}/corpus-assets"
          echo "${CORPUS_ARCHIVE_SHA256}  ${assets}/upstox_candidate_replay_v1.tar.gz" | sha256sum -c -
          test "$(awk '{print $1}' "${assets}/upstox_candidate_replay_v1.tar.gz.sha256")" = "${CORPUS_ARCHIVE_SHA256}"
          mkdir -p runtime
          tar -xzf "${assets}/upstox_candidate_replay_v1.tar.gz" -C runtime
          test -d runtime/upstox_candidate_replay
          test -f "${assets}/parquet_sha256_manifest.txt"

          stage="AUTHORITATIVE_REGENERATION"
          PYTHONPATH=. python scripts/run_mean_reversion_postmerge_regeneration.py \
            --project-root "${GITHUB_WORKSPACE}" \
            --corpus-root "${GITHUB_WORKSPACE}/runtime/upstox_candidate_replay" \
            --manifest "${assets}/parquet_sha256_manifest.txt" \
            --output-dir "${EVIDENCE_DIR}" \
            --producer-commit "${GITHUB_SHA}"
          trap - ERR

      - name: Publish summary
        if: always()
        run: |
          summary="${EVIDENCE_DIR}/postmerge_regeneration_summary.json"
          status="${EVIDENCE_DIR}/run_status.json"
          if test -f "${summary}"; then
            cat "${summary}" >> "${GITHUB_STEP_SUMMARY}"
          elif test -f "${status}"; then
            cat "${status}" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "Post-merge regeneration did not create a status artifact." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Commit small evidence index to research branch
        if: always()
        run: |
          set -euo pipefail
          source_dir="${EVIDENCE_DIR}"
          target_dir="docs/research/mean_reversion_postmerge_regeneration"

          git fetch origin "${EVIDENCE_BRANCH}"
          git checkout "${EVIDENCE_BRANCH}"
          git pull --ff-only origin "${EVIDENCE_BRANCH}"

          mkdir -p "${target_dir}"
          for name in \
            run_status.json \
            postmerge_regeneration_summary.json \
            phase4_semantic_hash_manifest.json \
            artifact_hash_manifest.json \
            frozen_input_authority.json; do
            if test -f "${source_dir}/${name}"; then
              cp "${source_dir}/${name}" "${target_dir}/${name}"
            fi
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${target_dir}"
          if ! git diff --cached --quiet; then
            git commit -m "research: publish mean-reversion regeneration index"
            git push origin HEAD:"${EVIDENCE_BRANCH}"
          fi

      - name: Upload read-only regeneration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mean-reversion-postmerge-regeneration-${{ github.sha }}
          path: ${{ runner.temp }}/postmerge-evidence
          if-no-files-found: warn
          retention-days: 30
