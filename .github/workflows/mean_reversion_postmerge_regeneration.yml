name: Mean Reversion Post-Merge Regeneration

on:
  push:
    branches:
      - research/postmerge-mean-reversion-rerun-v1
    paths:
      - ".github/workflows/mean_reversion_postmerge_regeneration.yml"
      - "docs/agent_reviews/mean_reversion_postmerge_regeneration.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mean-reversion-postmerge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate-frozen-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      STRATEGY_ID: MEAN_REVERSION_EXTENSION
      CORPUS_REPO: ramgolladi1503-sys/tradebot-research-corpus
      CORPUS_TAG: upstox-corpus-v1
      CORPUS_ARCHIVE_SHA256: 8c5fd5cded6475347c94f073b3411d6636c34dcc256243270e23ec8daf6b35f7
      PYTHONHASHSEED: "0"

    steps:
      - name: Checkout merged repair baseline
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install focused research dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install numpy pandas pyarrow pytest pyyaml

      - name: Download immutable private corpus
        env:
          GH_TOKEN: ${{ secrets.CORPUS_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN}"
          mkdir -p "${RUNNER_TEMP}/corpus-assets"
          gh release download "${CORPUS_TAG}" \
            --repo "${CORPUS_REPO}" \
            --dir "${RUNNER_TEMP}/corpus-assets" \
            --pattern "upstox_candidate_replay_v1.tar.gz" \
            --pattern "upstox_candidate_replay_v1.tar.gz.sha256" \
            --pattern "parquet_sha256_manifest.txt"

      - name: Verify and extract frozen corpus
        run: |
          set -euo pipefail
          ASSETS="${RUNNER_TEMP}/corpus-assets"
          echo "${CORPUS_ARCHIVE_SHA256}  ${ASSETS}/upstox_candidate_replay_v1.tar.gz" | sha256sum -c -
          test "$(awk '{print $1}' "${ASSETS}/upstox_candidate_replay_v1.tar.gz.sha256")" = "${CORPUS_ARCHIVE_SHA256}"
          mkdir -p runtime
          tar -xzf "${ASSETS}/upstox_candidate_replay_v1.tar.gz" -C runtime
          test -d runtime/upstox_candidate_replay

      - name: Verify every parquet byte and build frozen input authority
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          from pathlib import Path

          import pandas as pd

          root = Path("runtime/upstox_candidate_replay")
          manifest = Path(os.environ["RUNNER_TEMP"]) / "corpus-assets" / "parquet_sha256_manifest.txt"
          marker = "/runtime/upstox_candidate_replay/"
          expected: dict[str, str] = {}
          for raw in manifest.read_text(encoding="utf-8").splitlines():
              if not raw.strip():
                  continue
              digest, original = raw.split(maxsplit=1)
              if marker not in original:
                  raise SystemExit(f"manifest path lacks authority marker: {original}")
              relative = original.split(marker, 1)[1].strip()
              if relative in expected:
                  raise SystemExit(f"duplicate manifest path: {relative}")
              expected[relative] = digest.lower()

          actual_files = sorted(path for path in root.rglob("*.parquet") if path.is_file())
          actual_rel = {path.relative_to(root).as_posix() for path in actual_files}
          if actual_rel != set(expected):
              raise SystemExit(
                  f"corpus inventory mismatch missing={sorted(set(expected)-actual_rel)[:20]} "
                  f"extra={sorted(actual_rel-set(expected))[:20]}"
              )

          for index, relative in enumerate(sorted(expected), start=1):
              digest = hashlib.sha256((root / relative).read_bytes()).hexdigest()
              if digest != expected[relative]:
                  raise SystemExit(f"parquet SHA mismatch: {relative}")
              if index % 250 == 0:
                  print(f"verified {index}/{len(expected)} parquet files")

          underlying = sorted(root.glob("*/underlying/*.parquet"))
          if not underlying:
              raise SystemExit("frozen corpus contains no underlying parquet files")

          dates: set[str] = set()
          symbols: set[str] = set()
          row_counts: list[int] = []
          total_rows = 0
          for path in underlying:
              date_key = path.parent.parent.name
              symbol = path.stem.split("_")[0]
              frame = pd.read_parquet(path, columns=["timestamp", "open", "high", "low", "close"])
              if frame.empty:
                  raise SystemExit(f"empty underlying parquet: {path}")
              timestamps = pd.to_datetime(frame["timestamp"], errors="raise")
              if timestamps.isna().any() or not timestamps.is_monotonic_increasing:
                  raise SystemExit(f"invalid timestamp order: {path}")
              dates.add(date_key)
              symbols.add(symbol)
              row_counts.append(len(frame))
              total_rows += len(frame)

          ordered_dates = sorted(dates)
          uniform_rows = row_counts[0] if len(set(row_counts)) == 1 else None
          base = Path("runtime/strategy_validation/MEAN_REVERSION_EXTENSION")
          base.mkdir(parents=True, exist_ok=True)
          audit = {
              "classification": "UPSTOX_CANDLE_FILES_VALID",
              "producer_commit": os.environ["GITHUB_SHA"],
              "corpus_repo": os.environ["CORPUS_REPO"],
              "corpus_tag": os.environ["CORPUS_TAG"],
              "corpus_archive_sha256": os.environ["CORPUS_ARCHIVE_SHA256"],
              "manifest_verified": True,
              "parquet_files_verified": len(expected),
              "underlying_symbol_days": len(underlying),
              "underlying_rows": total_rows,
              "symbols": sorted(symbols),
              "first_date": ordered_dates[0],
              "last_date": ordered_dates[-1],
          }
          catalog = {
              "source": "IMMUTABLE_PRIVATE_RELEASE",
              "producer_commit": os.environ["GITHUB_SHA"],
              "corpus_archive_sha256": os.environ["CORPUS_ARCHIVE_SHA256"],
              "date_range_found": ordered_dates,
              "trading_days_count": len(ordered_dates),
              "symbols_found": sorted(symbols),
              "rows_per_day": uniform_rows,
              "underlying_symbol_days": len(underlying),
              "underlying_rows": total_rows,
          }
          (base / "upstox_candle_file_audit.json").write_text(
              json.dumps(audit, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          (base / "historical_data_catalog.json").write_text(
              json.dumps(catalog, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          print(json.dumps(audit, indent=2, sort_keys=True))
          PY
          mkdir -p "${RUNNER_TEMP}/frozen-prerequisites"
          cp runtime/strategy_validation/${STRATEGY_ID}/upstox_candle_file_audit.json "${RUNNER_TEMP}/frozen-prerequisites/"
          cp runtime/strategy_validation/${STRATEGY_ID}/historical_data_catalog.json "${RUNNER_TEMP}/frozen-prerequisites/"

      - name: Run focused repair regression tests
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m pytest -q \
            tests/test_phase4_audit_fail_closed.py \
            tests/test_walk_forward_integrity.py \
            tests/test_mean_reversion_ledger_timing.py \
            tests/test_mean_reversion_ledger_accounting.py

      - name: Regenerate Phase 4 evidence twice
        run: |
          set -euo pipefail
          run_phase4() {
            label="$1"
            base="runtime/strategy_validation/${STRATEGY_ID}"
            rm -rf "${base}"
            mkdir -p "${base}"
            cp "${RUNNER_TEMP}/frozen-prerequisites/"*.json "${base}/"

            PYTHONPATH=. python scripts/generate_mean_reversion_trade_ledger.py
            PYTHONPATH=. python scripts/audit_mean_reversion_trade_ledger.py --strategy "${STRATEGY_ID}"
            PYTHONPATH=. python scripts/audit_phase4_truth.py --strategy "${STRATEGY_ID}"
            PYTHONPATH=. python scripts/audit_phase4_7_integrity.py --strategy "${STRATEGY_ID}"
            PYTHONPATH=. python scripts/audit_phase4_8_selection_quality.py --strategy "${STRATEGY_ID}"
            PYTHONPATH=. python scripts/audit_phase4_10_accounting.py --strategy "${STRATEGY_ID}"
            PYTHONPATH=. python scripts/audit_phase4_v2_structural.py --strategy "${STRATEGY_ID}"
            PYTHONPATH=. python scripts/validate_mean_reversion_vertical_slice.py

            target="${RUNNER_TEMP}/postmerge-evidence/${label}/phase4"
            mkdir -p "${target}"
            cp -R "${base}/." "${target}/"
          }
          run_phase4 run-a
          run_phase4 run-b

      - name: Verify Phase 4 two-run semantic determinism
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          from pathlib import Path
          from typing import Any

          root = Path(os.environ["RUNNER_TEMP"]) / "postmerge-evidence"

          def canonical(path: Path) -> bytes:
              if path.suffix == ".json":
                  return json.dumps(
                      json.loads(path.read_text(encoding="utf-8")),
                      sort_keys=True,
                      separators=(",", ":"),
                  ).encode()
              if path.suffix == ".jsonl":
                  rows: list[Any] = []
                  for line in path.read_text(encoding="utf-8").splitlines():
                      if line.strip():
                          rows.append(json.loads(line))
                  return "\n".join(
                      json.dumps(row, sort_keys=True, separators=(",", ":"))
                      for row in rows
                  ).encode()
              return path.read_bytes()

          manifests: dict[str, dict[str, str]] = {}
          for label in ("run-a", "run-b"):
              folder = root / label / "phase4"
              items: dict[str, str] = {}
              for path in sorted(folder.rglob("*")):
                  if path.is_file():
                      items[path.relative_to(folder).as_posix()] = hashlib.sha256(canonical(path)).hexdigest()
              manifests[label] = items

          if manifests["run-a"] != manifests["run-b"]:
              differing = sorted(
                  key for key in set(manifests["run-a"]) | set(manifests["run-b"])
                  if manifests["run-a"].get(key) != manifests["run-b"].get(key)
              )
              raise SystemExit(f"Phase 4 semantic determinism failed: {differing[:30]}")

          output = root / "phase4_semantic_hash_manifest.json"
          output.write_text(
              json.dumps(
                  {
                      "producer_commit": os.environ["GITHUB_SHA"],
                      "corpus_archive_sha256": os.environ["CORPUS_ARCHIVE_SHA256"],
                      "two_run_semantic_determinism": True,
                      "files": manifests["run-a"],
                  },
                  indent=2,
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Run full-grid parameter discovery
        run: |
          set -euo pipefail
          base="runtime/strategy_validation/${STRATEGY_ID}"
          rm -rf "${base}"
          mkdir -p "${base}"
          cp "${RUNNER_TEMP}/frozen-prerequisites/"*.json "${base}/"
          PYTHONPATH=. python scripts/run_mean_reversion_parameter_discovery.py \
            --strategy "${STRATEGY_ID}"
          test -f "${base}/phase_4_11b_v2_full_grid_report.json"
          target="${RUNNER_TEMP}/postmerge-evidence/parameter-discovery"
          mkdir -p "${target}"
          cp "${base}/phase_4_11b_v2_full_grid_report.json" "${target}/"
          cp -R "${base}/." "${target}/final-runtime-state/"

      - name: Run shared certified WFA twice on frozen NIFTY data
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path
          from typing import Any

          import numpy as np
          import pandas as pd

          from scripts.run_walk_forward_elite import run_walk_forward

          files = sorted(Path("runtime/upstox_candidate_replay").glob("*/underlying/NIFTY_*.parquet"))
          if not files:
              raise SystemExit("no frozen NIFTY underlying files found")
          frames = []
          for path in files:
              frame = pd.read_parquet(path)
              required = ["timestamp", "open", "high", "low", "close", "volume"]
              missing = [column for column in required if column not in frame.columns]
              if missing:
                  raise SystemExit(f"{path} missing columns {missing}")
              frames.append(frame[required].copy())
          data = pd.concat(frames, ignore_index=True)
          data["timestamp"] = pd.to_datetime(data["timestamp"], errors="raise")
          data = data.sort_values("timestamp").drop_duplicates("timestamp", keep="first")
          data = data.set_index("timestamp")
          if not data.index.is_monotonic_increasing:
              raise SystemExit("combined NIFTY data is not monotonic")

          def normalize(value: Any) -> Any:
              if isinstance(value, dict):
                  return {str(key): normalize(item) for key, item in value.items()}
              if isinstance(value, (list, tuple)):
                  return [normalize(item) for item in value]
              if isinstance(value, (pd.Timestamp,)):
                  return value.isoformat()
              if isinstance(value, np.generic):
                  return value.item()
              return value

          root = Path(os.environ["RUNNER_TEMP"]) / "postmerge-evidence"
          for label in ("run-a", "run-b"):
              report = normalize(run_walk_forward(data.copy(), workers=1))
              folder = root / label / "shared-wfa"
              folder.mkdir(parents=True, exist_ok=True)
              (folder / "certified_wfa_report.json").write_text(
                  json.dumps(report, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
          first = (root / "run-a" / "shared-wfa" / "certified_wfa_report.json").read_bytes()
          second = (root / "run-b" / "shared-wfa" / "certified_wfa_report.json").read_bytes()
          if first != second:
              raise SystemExit("shared WFA two-run determinism failed")
          PY

      - name: Build final post-merge regeneration summary
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "postmerge-evidence"
          phase4 = root / "run-a" / "phase4"
          discovery = json.loads(
              (root / "parameter-discovery" / "phase_4_11b_v2_full_grid_report.json").read_text()
          )
          wfa = json.loads(
              (root / "run-a" / "shared-wfa" / "certified_wfa_report.json").read_text()
          )

          reports = {
              "phase_4_report": json.loads((phase4 / "phase_4_report.json").read_text()),
              "phase_5_wfa_report": json.loads((phase4 / "phase_5_wfa_report.json").read_text()),
              "ledger_audit": json.loads((phase4 / "phase_4_trade_ledger_audit.json").read_text()),
              "truth_audit": json.loads((phase4 / "phase_4_5_truth_audit.json").read_text()),
              "integrity_audit": json.loads((phase4 / "phase_4_7_integrity_audit.json").read_text()),
              "selection_audit": json.loads((phase4 / "phase_4_8_selection_quality_audit.json").read_text()),
              "accounting_audit": json.loads((phase4 / "phase_4_10_accounting_audit.json").read_text()),
              "structural_audit": json.loads((phase4 / "phase_4_v2_structural_audit.json").read_text()),
          }
          summary = {
              "producer_commit": os.environ["GITHUB_SHA"],
              "corpus_repo": os.environ["CORPUS_REPO"],
              "corpus_tag": os.environ["CORPUS_TAG"],
              "corpus_archive_sha256": os.environ["CORPUS_ARCHIVE_SHA256"],
              "phase4_two_run_semantic_determinism": True,
              "shared_wfa_two_run_determinism": True,
              "phase4_verdict": reports["phase_4_report"].get("verdict"),
              "phase4_passed": reports["phase_4_report"].get("passed"),
              "phase4_blockers": reports["phase_4_report"].get("blockers", []),
              "audit_classifications": {
                  key: value.get("classification") for key, value in reports.items()
                  if key.endswith("audit")
              },
              "parameter_discovery_conclusion": discovery.get("conclusion"),
              "parameter_grid_size": discovery.get("executed_grid_size"),
              "train_pass_count": discovery.get("train_pass_count"),
              "validation_pass_count": discovery.get("validation_pass_count"),
              "region_stable_count": discovery.get("region_stable_count"),
              "shared_wfa_status": wfa.get("status"),
              "shared_wfa_promoted": wfa.get("promoted"),
              "shared_wfa_blockers": wfa.get("blockers", []),
              "execution_allowed": False,
              "paper_live_allowed": False,
              "historical_outputs_superseded": True,
              "result_contract": "REGENERATED_RESEARCH_EVIDENCE_ONLY",
          }
          summary_path = root / "postmerge_regeneration_summary.json"
          summary_path.write_text(json.dumps(summary, indent=2, sort_keys=True) + "\n")

          hashes = {}
          for path in sorted(root.rglob("*")):
              if path.is_file() and path.name != "artifact_hash_manifest.json":
                  hashes[path.relative_to(root).as_posix()] = hashlib.sha256(path.read_bytes()).hexdigest()
          (root / "artifact_hash_manifest.json").write_text(
              json.dumps({"producer_commit": os.environ["GITHUB_SHA"], "files": hashes}, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Publish summary
        if: always()
        run: |
          summary="${RUNNER_TEMP}/postmerge-evidence/postmerge_regeneration_summary.json"
          if test -f "${summary}"; then
            cat "${summary}" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "Post-merge regeneration did not reach final summary generation." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload read-only regeneration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mean-reversion-postmerge-regeneration-${{ github.sha }}
          path: ${{ runner.temp }}/postmerge-evidence
          if-no-files-found: warn
          retention-days: 30
