name: Prepare Mean Reversion Rerun V3

on:
  push:
    branches:
      - research/postmerge-mean-reversion-rerun-v3
    paths:
      - ".github/workflows/prepare_mean_reversion_rerun_v3.yml"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/postmerge-mean-reversion-rerun-v3
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install focused dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install numpy pandas pyarrow pytest

      - name: Apply guarded preparation
        run: |
          set -euo pipefail
          python tools/prepare_mean_reversion_rerun_v3.py

      - name: Validate post-merge orchestration
        run: |
          set -euo pipefail
          python -m py_compile scripts/run_mean_reversion_postmerge_regeneration.py
          PYTHONPATH=. python -m pytest -q \
            tests/test_mean_reversion_ledger_timing.py \
            tests/test_mean_reversion_ledger_accounting.py \
            tests/test_research_candle_contract.py \
            tests/test_mean_reversion_corpus_directory_accounting.py

      - name: Commit prepared rerun files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/run_mean_reversion_postmerge_regeneration.py \
            docs/agent_reviews/mean_reversion_postmerge_regeneration.md \
            tools/prepare_mean_reversion_rerun_v3.py
          git commit -m "research: prepare merged mean-reversion rerun v3"
          git push origin HEAD:research/postmerge-mean-reversion-rerun-v3
