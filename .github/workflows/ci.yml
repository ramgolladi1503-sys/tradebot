name: ci

on:
  push:
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr709_quality_repair:
    if: github.event_name == 'pull_request' && github.head_ref == 'research/constituent-lead-lag-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: research/constituent-lead-lag-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused dependencies
        run: python -m pip install --upgrade pip pytest pandas numpy pyarrow pyyaml

      - name: Apply quality-proof repairs
        run: python scripts/_apply_pr709_quality_gate_repairs.py

      - name: Compile repaired modules and tests
        run: |
          python -m compileall -q \
            research/constituent_lead_lag \
            tests/research/test_certification_repair.py \
            tests/research/test_reconstructed_weight_proxy.py \
            tests/research/test_unweighted_constituent_breadth.py

      - name: Run complete PR709 focused suite
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            tests/research/test_constituent_data_pipeline.py \
            tests/research/test_reconstructed_weight_proxy.py \
            tests/research/test_constituent_lead_lag.py \
            tests/research/test_unweighted_constituent_breadth.py \
            tests/research/test_certification_repair.py \
            tests/research/test_reconstructed_proxy_oracle.py

      - name: Run scoped Minerva and Cerberus gates
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import subprocess
          from tools.code_excellence.minerva_gate import run_minerva_gate
          from tools.code_excellence.cerberus_gate import run_cerberus_gate

          merge_base = subprocess.check_output(
              ["git", "merge-base", "HEAD", "origin/main"], text=True
          ).strip()
          paths = subprocess.check_output(
              ["git", "diff", "--name-only", f"{merge_base}..HEAD"], text=True
          ).splitlines()
          minerva = run_minerva_gate(
              repo_root=".", config_path=".gsd-forensics.yaml", changed_paths=paths
          )
          cerberus = run_cerberus_gate(
              repo_root=".", config_path=".gsd-forensics.yaml", changed_paths=paths
          )
          if minerva.exit_code:
              raise SystemExit(
                  "Minerva blocked: "
                  + ", ".join(f"{x.path}:{x.reason}" for x in minerva.blocked_findings)
              )
          if cerberus.exit_code:
              raise SystemExit(
                  "Cerberus blocked: "
                  + ", ".join(f"{x.path}:{x.line_number}:{x.reason}" for x in cerberus.blocked_findings)
              )
          print(f"Minerva PASS findings={len(minerva.findings)}")
          print(f"Cerberus PASS findings={len(cerberus.findings)}")
          PY

      - name: Validate mandatory agent review evidence
        run: python scripts/validate_agent_review_evidence.py --base-ref origin/main

      - name: Commit quality repairs and restore CI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show b93224eaf2f3a7e721109b7c4e626ee37b1b8f82:.github/workflows/ci.yml > .github/workflows/ci.yml
          git rm scripts/_apply_pr709_quality_gate_repairs.py
          git add \
            .github/workflows/ci.yml \
            research/constituent_lead_lag/model.py \
            research/constituent_lead_lag/unweighted.py \
            tests/research/test_certification_repair.py \
            tests/research/test_reconstructed_weight_proxy.py \
            tests/research/test_unweighted_constituent_breadth.py
          git commit -m "strengthen PR709 certification proof gates"
          git push origin HEAD:research/constituent-lead-lag-v1

  unit_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      DATA_ROOT: ${{ github.workspace }}/.runtime
      EXECUTION_MODE: PAPER
      KITE_USE_API: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run fast deterministic tests
        run: >-
          PYTHONPATH=. pytest -q -o addopts=''
          -m "not integration and not feed_smoke and not feed_soak and not certification"
          --durations=25

  health_gate:
    runs-on: ubuntu-latest
    needs: unit_tests
    timeout-minutes: 10
    env:
      PYTHONPATH: .
      DATA_ROOT: ${{ github.workspace }}/.runtime
      EXECUTION_MODE: PAPER
      KITE_USE_API: "false"
      PYTHONHASHSEED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run health gate
        id: run_health_gate
        continue-on-error: true
        run: PYTHONPATH=. python -m core.health_gate --desk DEFAULT --strict
        timeout-minutes: 3

      - name: Upload health gate artifacts on failure
        if: steps.run_health_gate.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: health-gate-failure-artifacts
          if-no-files-found: warn
          path: |
            .runtime/logs/health_gate_report.json
            .runtime/logs/health_gate_report.md
            .runtime/logs/events.jsonl
            .runtime/logs/recon.json

      - name: Fail job if health gate failed
        if: steps.run_health_gate.outcome == 'failure'
        run: exit 1
