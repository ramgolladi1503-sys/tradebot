name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      DATA_ROOT: ${{ github.workspace }}/.runtime
      EXECUTION_MODE: PAPER
      KITE_USE_API: "false"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -r requirements.txt

      - name: Run fast deterministic tests
        shell: bash
        run: |
          set -o pipefail
          if ! PYTHONPATH=. pytest -q -o addopts='' \
            -m "not integration and not feed_smoke and not feed_soak and not certification" \
            --tb=short --durations=25 > /tmp/pytest-fast.log 2>&1; then
            tail -n 220 /tmp/pytest-fast.log
            exit 1
          fi
          tail -n 80 /tmp/pytest-fast.log

  health_gate:
    runs-on: ubuntu-latest
    needs: unit_tests
    timeout-minutes: 10
    env:
      PYTHONPATH: .
      DATA_ROOT: ${{ github.workspace }}/.runtime
      EXECUTION_MODE: PAPER
      KITE_USE_API: "false"
      PYTHONHASHSEED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run health gate
        id: run_health_gate
        continue-on-error: true
        run: PYTHONPATH=. python -m core.health_gate --desk DEFAULT --strict
        timeout-minutes: 3

      - name: Upload health gate artifacts on failure
        if: steps.run_health_gate.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: health-gate-failure-artifacts
          if-no-files-found: warn
          path: |
            .runtime/logs/health_gate_report.json
            .runtime/logs/health_gate_report.md
            .runtime/logs/events.jsonl
            .runtime/logs/recon.json

      - name: Fail job if health gate failed
        if: steps.run_health_gate.outcome == 'failure'
        run: exit 1
