name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      DATA_ROOT: ${{ github.workspace }}/.runtime
      EXECUTION_MODE: PAPER
      KITE_USE_API: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run fast deterministic tests
        run: >-
          PYTHONPATH=. pytest -q -o addopts=''
          -m "not integration and not feed_smoke and not feed_soak and not certification"
          --durations=25

  health_gate:
    runs-on: ubuntu-latest
    needs: unit_tests
    timeout-minutes: 10
    env:
      PYTHONPATH: .
      DATA_ROOT: ${{ github.workspace }}/.runtime
      EXECUTION_MODE: PAPER
      KITE_USE_API: "false"
      PYTHONHASHSEED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run health gate
        id: run_health_gate
        continue-on-error: true
        run: PYTHONPATH=. python -m core.health_gate --desk DEFAULT --strict
        timeout-minutes: 3

      - name: Upload health gate artifacts on failure
        if: steps.run_health_gate.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: health-gate-failure-artifacts
          if-no-files-found: warn
          path: |
            .runtime/logs/health_gate_report.json
            .runtime/logs/health_gate_report.md
            .runtime/logs/events.jsonl
            .runtime/logs/recon.json

      - name: Fail job if health gate failed
        if: steps.run_health_gate.outcome == 'failure'
        run: exit 1

  psilor_authenticated_smoke:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 795 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'data/psilor-v1-upstox-fetch-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
      PSILOR_SMOKE_ROOT: ${{ runner.temp }}/psilor-smoke
      PSILOR_SMOKE_RUN_ID: ci-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install smoke dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pytz python-dateutil pyarrow requests

      - name: Require repository Upstox secret
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${UPSTOX_ACCESS_TOKEN:-}" ]; then
            echo 'SMOKE_VERDICT=BLOCKED_AUTHENTICATION'
            echo 'UPSTOX_ACCESS_TOKEN repository secret is unavailable to this same-repository PR run.'
            exit 1
          fi
          echo 'AUTH_SECRET_AVAILABLE=YES'

      - name: Run exact five-file authenticated smoke
        run: PYTHONPATH=. python scripts/smoke_test_psilor_v1.py

      - name: Verify exact admission verdict
        shell: bash
        run: |
          set -euo pipefail
          report="${PSILOR_SMOKE_ROOT}/${PSILOR_SMOKE_RUN_ID}/validation_report.json"
          python - "$report" <<'PY'
          import json
          import sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert report['smoke_verdict'] == 'PASS_BOUNDED_AUTHENTICATED_FETCH_SMOKE'
          assert report['real_future_contracts'] == 1
          assert report['real_ce_contracts'] == 2
          assert report['real_pe_contracts'] == 2
          assert report['real_candle_files'] == 5
          assert len(report['exact_common_sessions']) == 2
          assert report['smoke_hash_reconciliation'] == 'PASS'
          assert report['no_unexpected_files'] is True
          assert report['created_by_current_run'] is True
          assert report['formal_extraction_approved'] is True
          print('SMOKE_VERDICT=PASS_BOUNDED_AUTHENTICATED_FETCH_SMOKE')
          PY

      - name: Upload sanitized smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psilor-authenticated-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/psilor-smoke
          if-no-files-found: ignore
          retention-days: 14
