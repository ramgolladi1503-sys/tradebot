name: ci

on:
  push:
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr709_repair:
    if: github.event_name == 'pull_request' && github.head_ref == 'research/constituent-lead-lag-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: research/constituent-lead-lag-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused repair dependencies
        run: python -m pip install --upgrade pip pytest pandas numpy pyarrow

      - name: Apply allow-listed repair payload
        run: python scripts/_apply_pr709_repair_payload.py

      - name: Compile repaired modules
        run: |
          python -m compileall -q \
            research/constituent_lead_lag \
            scripts/audit_proxy_campaign_bars.py \
            scripts/audit_reconstructed_proxy_evidence.py \
            scripts/calculate_proxy_membership_coverage.py \
            scripts/run_reconstructed_weight_proxy_research.py

      - name: Run complete PR709 focused suite
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            tests/research/test_constituent_data_pipeline.py \
            tests/research/test_reconstructed_weight_proxy.py \
            tests/research/test_constituent_lead_lag.py \
            tests/research/test_unweighted_constituent_breadth.py \
            tests/research/test_certification_repair.py \
            tests/research/test_reconstructed_proxy_oracle.py

      - name: Commit repair and restore workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show 5eca0fe088ac4eba0663dd2d9964d77f36f544f9:.github/workflows/ci.yml > .github/workflows/ci.yml
          git rm -r scripts/.pr709_payload
          git rm scripts/_apply_pr709_repair_payload.py
          git rm .github/workflows/pr709-one-shot-repair.yml
          git add \
            .github/workflows/ci.yml \
            research/constituent_lead_lag \
            scripts/audit_proxy_campaign_bars.py \
            scripts/audit_reconstructed_proxy_evidence.py \
            scripts/calculate_proxy_membership_coverage.py \
            scripts/run_reconstructed_weight_proxy_research.py \
            tests/research/test_certification_repair.py \
            tests/research/test_reconstructed_proxy_oracle.py
          git commit -m "repair PR709 certification contracts"
          git push origin HEAD:research/constituent-lead-lag-v1

  unit_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      DATA_ROOT: ${{ github.workspace }}/.runtime
      EXECUTION_MODE: PAPER
      KITE_USE_API: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run fast deterministic tests
        run: >-
          PYTHONPATH=. pytest -q -o addopts=''
          -m "not integration and not feed_smoke and not feed_soak and not certification"
          --durations=25

  health_gate:
    runs-on: ubuntu-latest
    needs: unit_tests
    timeout-minutes: 10
    env:
      PYTHONPATH: .
      DATA_ROOT: ${{ github.workspace }}/.runtime
      EXECUTION_MODE: PAPER
      KITE_USE_API: "false"
      PYTHONHASHSEED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run health gate
        id: run_health_gate
        continue-on-error: true
        run: PYTHONPATH=. python -m core.health_gate --desk DEFAULT --strict
        timeout-minutes: 3

      - name: Upload health gate artifacts on failure
        if: steps.run_health_gate.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: health-gate-failure-artifacts
          if-no-files-found: warn
          path: |
            .runtime/logs/health_gate_report.json
            .runtime/logs/health_gate_report.md
            .runtime/logs/events.jsonl
            .runtime/logs/recon.json

      - name: Fail job if health gate failed
        if: steps.run_health_gate.outcome == 'failure'
        run: exit 1
