name: history-first-pattern-miner-v1

on:
  workflow_dispatch:
  push:
    branches:
      - research/history-first-pattern-miner-v1
    paths:
      - 'research/history_first_pattern_miner_v1/**'
      - 'scripts/run_history_first_pattern_miner_v1.py'
      - 'tests/test_history_first_pattern_miner_v1.py'
      - '.github/workflows/history-first-pattern-miner-v1.yml'
  pull_request:
    paths:
      - 'research/history_first_pattern_miner_v1/**'
      - 'scripts/run_history_first_pattern_miner_v1.py'
      - 'tests/test_history_first_pattern_miner_v1.py'
      - '.github/workflows/history-first-pattern-miner-v1.yml'

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  mine-history-first-patterns:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout without broad LFS hydration
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Hydrate pinned constituent/index evidence only
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull \
            --include="research/local_evidence_consolidation_v1/**/constituent_index_5m.parquet" \
            --exclude=""

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          cache: pip

      - name: Install pinned research dependencies
        run: |
          python -m pip install --upgrade "pip==26.2.1"
          python -m pip install \
            "numpy==2.5.1" \
            "pandas==3.0.5" \
            "scipy==1.18.0" \
            "pyarrow==25.0.0" \
            "scikit-learn==1.9.0" \
            "pytest==9.1.1"

      - name: Run causality and discovery-authority tests
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_history_first_pattern_miner_v1.py \
            tests/test_autonomous_structural_edge_exhaustion_v1.py

      - name: Execute outcome-blind historical pattern mining
        run: |
          rm -rf runtime/research/history_first_pattern_miner_v1
          PYTHONPATH=. python scripts/run_history_first_pattern_miner_v1.py \
            --source-file research/local_evidence_consolidation_v1/external_local_dirs/tradebot-ml-evidence/constituent-lead-lag-data-v1/proxy_campaign_2024_2025_v2/normalized/constituent_index_5m.parquet \
            --output-root runtime/research/history_first_pattern_miner_v1

      - name: Verify outcome-blind boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('runtime/research/history_first_pattern_miner_v1')
          final = json.loads((root / 'final_discovery_authority.json').read_text())
          day = json.loads((root / 'day_archetypes.json').read_text())
          prefix = json.loads((root / 'prefix_divergence.json').read_text())
          discr = json.loads((root / 'branch_discriminators.json').read_text())

          assert final['policy']['future_market_returns_opened'] is False
          assert final['policy']['validation_market_outcomes_opened'] is False
          assert final['policy']['unopened_sessions_touched'] is False
          assert final['policy']['strategy_rules_created'] is False
          assert day['outcomes_opened'] is False
          assert day['unopened_sessions_used'] is False
          assert prefix['outcomes_opened'] is False
          assert prefix['unopened_sessions_used'] is False
          assert discr['outcomes_opened'] is False
          assert discr['validation_sessions_used'] is False
          assert discr['unopened_sessions_used'] is False
          print(json.dumps({
              'day_archetype_verdict': day['principal_verdict'],
              'recurrent_day_archetypes': day['recurrent_archetypes'],
              'prefix_branch_count': prefix['branch_count'],
              'stable_discriminator_branch_count': discr['record_count'],
              'semantic_sha256': final['semantic_sha256'],
          }, indent=2, sort_keys=True))
          PY

      - name: Upload history-first discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history-first-pattern-miner-v1
          path: runtime/research/history_first_pattern_miner_v1/
          if-no-files-found: error
          retention-days: 30
