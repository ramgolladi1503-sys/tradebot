name: TradeBot MCP

on:
  pull_request:
    paths:
      - ".agents/**"
      - ".github/workflows/tradebot-mcp.yml"
      - "docs/antigravity/**"
      - "requirements-mcp.txt"
      - "scripts/install_antigravity_mcp.sh"
      - "tests/mcp/**"
      - "tools/tradebot_mcp/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcp-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-mcp.txt

      - name: Install isolated MCP dependencies
        run: python -m pip install -r requirements-mcp.txt

      - name: Run core and server tests
        run: |
          pytest -q tests/mcp/test_core.py
          pytest -q -m integration tests/mcp/test_servers.py

      - name: Validate installer syntax
        run: bash -n scripts/install_antigravity_mcp.sh

      - name: Generate workspace MCP configuration for separate target
        env:
          TRADEBOT_MCP_VENV: ${{ runner.temp }}/tradebot-mcp-venv
          TRADEBOT_TARGET_ROOT: ${{ runner.temp }}/tradebot-target
          TRADEBOT_MCP_CONFIG_ROOT: ${{ runner.temp }}/tradebot-target
          TRADEBOT_EVIDENCE_ROOTS: ${{ runner.temp }}/tradebot-target/research:${{ github.workspace }}/runtime
          TRADEBOT_DATA_ROOTS: ${{ github.workspace }}/runtime
        run: |
          mkdir -p runtime
          mkdir -p "$TRADEBOT_TARGET_ROOT/research"
          git -C "$TRADEBOT_TARGET_ROOT" init
          bash scripts/install_antigravity_mcp.sh
          test -s "$TRADEBOT_TARGET_ROOT/.agents/mcp_config.json"
          python -m json.tool "$TRADEBOT_TARGET_ROOT/.agents/mcp_config.json" >/dev/null
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          config_path = Path(os.environ["TRADEBOT_TARGET_ROOT"]) / ".agents" / "mcp_config.json"
          payload = json.loads(config_path.read_text(encoding="utf-8"))
          expected_root = str(Path(os.environ["TRADEBOT_TARGET_ROOT"]).resolve())
          expected_cwd = str(Path(os.environ["GITHUB_WORKSPACE"]).resolve())
          assert set(payload["mcpServers"]) == {
              "tradebot-evidence",
              "tradebot-data-audit",
              "tradebot-gates",
              "tradebot-git-audit",
          }
          for server in payload["mcpServers"].values():
              assert server["env"]["TRADEBOT_ROOT"] == expected_root
              assert server["cwd"] == expected_cwd
              assert server["command"].endswith("/bin/python")
          PY
