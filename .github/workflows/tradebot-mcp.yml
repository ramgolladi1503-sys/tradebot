name: TradeBot MCP

on:
  pull_request:
    paths:
      - ".agents/**"
      - ".github/workflows/tradebot-mcp.yml"
      - "docs/antigravity/**"
      - "requirements-mcp.txt"
      - "scripts/install_antigravity_mcp.sh"
      - "tests/mcp/**"
      - "tools/tradebot_mcp/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcp-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-mcp.txt

      - name: Install isolated MCP dependencies
        run: python -m pip install -r requirements-mcp.txt

      - name: Run core and server tests
        run: |
          pytest -q tests/mcp/test_core.py
          pytest -q -m integration tests/mcp/test_servers.py

      - name: Validate installer syntax
        run: bash -n scripts/install_antigravity_mcp.sh

      - name: Generate workspace MCP configuration
        env:
          TRADEBOT_MCP_VENV: ${{ runner.temp }}/tradebot-mcp-venv
          TRADEBOT_EVIDENCE_ROOT: ${{ github.workspace }}/runtime
          TRADEBOT_DATA_ROOTS: ${{ github.workspace }}/runtime
        run: |
          mkdir -p runtime
          bash scripts/install_antigravity_mcp.sh
          test -s .agents/mcp_config.json
          python -m json.tool .agents/mcp_config.json >/dev/null
