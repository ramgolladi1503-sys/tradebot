name: High-Occurrence Structural Edge V1

on:
  workflow_dispatch:
  push:
    branches:
      - research/high-occurrence-structural-edge-v1
    paths:
      - 'scripts/run_high_occurrence_structural_edge_v1.py'
      - 'tests/research/test_high_occurrence_structural_edge_v1.py'
      - 'research/high_occurrence_structural_edge_v1/**'
      - '.github/workflows/high-occurrence-structural-edge-v1.yml'
  pull_request:
    paths:
      - 'scripts/run_high_occurrence_structural_edge_v1.py'
      - 'tests/research/test_high_occurrence_structural_edge_v1.py'
      - 'research/high_occurrence_structural_edge_v1/**'
      - '.github/workflows/high-occurrence-structural-edge-v1.yml'

permissions:
  contents: write

jobs:
  discover-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Materialize required evidence
        run: |
          git lfs install
          git lfs pull \
            --include='research/local_evidence_consolidation_v1/worktrees/reverse-causal-option-expansion-v1/runtime_research/reverse_causal_option_expansion_v1/*' \
            --exclude=''

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy pyarrow pytest

      - name: Run focused tests
        run: python -m pytest -q tests/research/test_high_occurrence_structural_edge_v1.py

      - name: Run chronological WFA campaign
        run: python -m scripts.run_high_occurrence_structural_edge_v1 --repo-root "$GITHUB_WORKSPACE"

      - name: Preserve evidence
        if: always() && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f runtime/research/high_occurrence_structural_edge_v1/* || true
          git add -f research/high_occurrence_structural_edge_v1/RESULT.md || true
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "research: preserve high-occurrence campaign evidence [skip ci]"
          git push origin HEAD:research/high-occurrence-structural-edge-v1

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: high-occurrence-structural-edge-v1
          path: |
            runtime/research/high_occurrence_structural_edge_v1/**
            research/high_occurrence_structural_edge_v1/RESULT.md
          if-no-files-found: error
          retention-days: 30
