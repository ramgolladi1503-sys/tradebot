name: Information Migration Sequence V1

on:
  push:
    branches:
      - research/information-migration-sequence-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-and-causality-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout without broad LFS hydration
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Pull required LFS objects only
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include="research/local_evidence_consolidation_v1/**/repaired_joint_underlying_option_warehouse.parquet,research/local_evidence_consolidation_v1/**/constituent_index_5m.parquet" --exclude=""

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas pyarrow numpy

      - name: Audit schema and causal research fields
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path
          import pandas as pd
          import pyarrow.parquet as pq

          root = Path('research/local_evidence_consolidation_v1')
          joint = sorted(root.rglob('repaired_joint_underlying_option_warehouse.parquet'))
          constituents = sorted(root.rglob('constituent_index_5m.parquet'))
          if not joint:
              raise SystemExit('missing repaired joint warehouse')
          if not constituents:
              raise SystemExit('missing constituent panel')

          joint_path = joint[0]
          constituent_path = next((p for p in constituents if 'proxy_campaign_2024_2025_v2' in str(p)), constituents[0])

          joint_pf = pq.ParquetFile(joint_path)
          constituent_pf = pq.ParquetFile(constituent_path)
          joint_cols = joint_pf.schema.names
          constituent_cols = constituent_pf.schema.names

          probe_terms = {
              'time': ['time', 'timestamp', 'session', 'date'],
              'underlying': ['nifty', 'spot', 'index', 'underlying', 'future'],
              'option': ['option', 'premium', 'strike', 'expiry', 'ce', 'pe', 'ltp', 'open', 'high', 'low', 'close'],
              'structure': ['breadth', 'dispersion', 'sector', 'leader', 'weight', 'coverage', 'return'],
          }
          matches = {
              group: [c for c in joint_cols if any(term in c.lower() for term in terms)]
              for group, terms in probe_terms.items()
          }

          sample = pd.read_parquet(joint_path, columns=joint_cols[: min(20, len(joint_cols))]).head(5)
          report = {
              'schema_version': 1,
              'research_only': True,
              'allowed_for_live_execution': False,
              'joint_path': str(joint_path),
              'joint_rows': joint_pf.metadata.num_rows,
              'joint_columns': joint_cols,
              'joint_field_matches': matches,
              'constituent_path': str(constituent_path),
              'constituent_rows': constituent_pf.metadata.num_rows,
              'constituent_columns': constituent_cols,
              'sample_records': sample.astype(str).to_dict(orient='records'),
              'next_stage_contract': {
                  'mechanism': 'ordered constituent_to_sector_to_index_to_option information migration',
                  'no_old_candidate_inheritance': True,
                  'entry_must_be_after_signal': True,
                  'holdout_must_remain_sealed': True,
                  'no_threshold_tuning_on_holdout': True,
              },
              'principal_verdict': 'SCHEMA_READY_FOR_INFORMATION_MIGRATION_CAMPAIGN',
          }
          out = Path('information-migration-sequence-v1-schema-audit.json')
          out.write_text(json.dumps(report, indent=2, sort_keys=True) + '\n')
          print(out.read_text())
          PY

      - name: Upload schema audit
        uses: actions/upload-artifact@v4
        with:
          name: information-migration-sequence-v1-schema-audit
          path: information-migration-sequence-v1-schema-audit.json
          if-no-files-found: error

