name: Export Canonical Source Temporary

on:
  push:
    branches:
      - research/all-strategy-option-pf-v1
    paths:
      - .github/workflows/export-canonical-source-temporary.yml
  pull_request:
    branches:
      - research/ce-pe-option-certification-v1
    paths:
      - .github/workflows/export-canonical-source-temporary.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build canonical source bundle
        run: |
          set -euo pipefail
          rm -rf export
          mkdir -p export
          paths=(
            core/movement_contract.py
            core/candidate_outcome_contract.py
            core/movement_regime.py
            core/strategy_parameter_profiles.py
            strategies/movement
            strategies/simple_orb.py
            strategies/strategy_registry.py
            research/option_e2e_recertification_v4/current_certification_source_universe_v1/contract.py
            research/option_e2e_recertification_v4/kite_underlying_directional_edge_campaign_v1/canonical_adapter.py
            research/option_e2e_recertification_v4/kite_underlying_directional_edge_campaign_v1/canonical_intent_campaign.py
            research/option_e2e_recertification_v4/kite_underlying_directional_edge_campaign_v1/underlying_corpus.py
            research/option_e2e_recertification_v4/expired_option_replay_v1/archive_source.py
            research/option_e2e_recertification_v4/expired_option_replay_v1/engine.py
            scripts/run_canonical_option_intent_campaign_v1.py
            scripts/run_expired_option_contract_replay_v1.py
            scripts/run_canonical_all_strategy_expired_option_pf_campaign_v1.py
            tests/research/option_e2e/test_canonical_underlying_adapter.py
            tests/research/option_e2e/test_canonical_option_intent_campaign_v1.py
            tests/research/option_e2e/test_expired_option_replay_v1.py
            tests/research/option_e2e/test_expired_option_replay_authority_v1.py
          )
          for path in "${paths[@]}"; do
            if [[ -e "$path" ]]; then
              mkdir -p "export/$(dirname "$path")"
              cp -R "$path" "export/$path"
            fi
          done
          printf '%s\n' "$(git rev-parse HEAD)" > export/HEAD.txt
          tar -czf canonical-source.tar.gz -C export .
          sha256sum canonical-source.tar.gz > canonical-source.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-source-${{ github.sha }}
          path: |
            canonical-source.tar.gz
            canonical-source.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
