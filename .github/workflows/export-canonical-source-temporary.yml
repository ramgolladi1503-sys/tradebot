name: Export Canonical Source Temporary

on:
  push:
    branches:
      - research/all-strategy-option-pf-v1
    paths:
      - .github/workflows/export-canonical-source-temporary.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/all-strategy-option-pf-v1
      - name: Build canonical source bundle
        run: |
          set -euo pipefail
          rm -rf export
          mkdir -p export
          paths=(
            core/movement_contract.py
            core/candidate_outcome_contract.py
            core/movement_regime.py
            core/strategy_parameter_profiles.py
            strategies/movement
            strategies/simple_orb.py
            strategies/strategy_registry.py
            scripts/backtest_all_strategies_available_data.py
            tests/test_compression_trend_movement_strategies.py
            tests/test_event_late_day_movement_strategies.py
            tests/test_vwap_trap_movement_strategies.py
          )
          for path in "${paths[@]}"; do
            if [[ -e "$path" ]]; then
              mkdir -p "export/$(dirname "$path")"
              cp -R "$path" "export/$path"
            fi
          done
          printf '%s\n' "$(git rev-parse HEAD)" > export/HEAD.txt
          tar -czf canonical-source.tar.gz -C export .
          sha256sum canonical-source.tar.gz > canonical-source.tar.gz.sha256
          base64 -w 0 canonical-source.tar.gz | fold -w 76 > canonical-source.tar.gz.b64.txt
          wc -l canonical-source.tar.gz.b64.txt > total_lines.txt
          sha256sum canonical-source.tar.gz.b64.txt > wrapped_base64.sha256
      - name: Commit temporary source export
        run: |
          set -euo pipefail
          export_dir="research/option_e2e_recertification_v4/kite_underlying_directional_edge_campaign_v1/temporary_source_export"
          rm -rf "$export_dir"
          mkdir -p "$export_dir"
          cp canonical-source.tar.gz.sha256 "$export_dir/"
          cp canonical-source.tar.gz.b64.txt "$export_dir/"
          cp total_lines.txt "$export_dir/"
          cp wrapped_base64.sha256 "$export_dir/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$export_dir"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(research): wrap canonical source export"
          git push origin HEAD:research/all-strategy-option-pf-v1
