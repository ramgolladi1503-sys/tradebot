name: Temporary AI Reliability Completion V1

on:
  push:
    branches:
      - post-pr763/ai-reliability-live-evidence-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: .
      TRADEBOT_READ_ONLY: "true"
      EXECUTION_MODE: "SIM"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: post-pr763/ai-reliability-live-evidence-v1
          fetch-depth: 0
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Fetch exact PR760 source
        run: |
          git fetch origin \
            refs/heads/feature/ai-pipeline-reliability-agent-v1:refs/remotes/origin/feature/ai-pipeline-reliability-agent-v1

      - name: Import allowlisted sidecar files
        run: python tools/_temporary_import_ai_reliability_v1.py

      - name: Reject out-of-scope changes
        run: |
          python - <<'PY'
          import subprocess
          allowed_prefixes = (
              'core/ai_reliability_agent/',
              'scripts/run_ai_reliability',
              'tests/test_ai_reliability',
              'tests/fixtures/ai_reliability_real_artifact/',
              'docs/agent_reviews/ai_reliability',
              'docs/architecture/ai_reliability',
              'docs/test-reports/ai_reliability',
              '.github/workflows/_temporary_ai_reliability_completion_v1.yml',
              'tools/_temporary_import_ai_reliability_v1.py',
          )
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', '6c9ad33a40d29c8f712d475c3f77db6a61f49949'],
              text=True,
          ).splitlines()
          bad = [path for path in changed if not any(path.startswith(prefix) for prefix in allowed_prefixes)]
          if bad:
              raise SystemExit(f'OUT_OF_SCOPE_PATHS:{bad}')
          print(f'allowlisted changed paths: {len(changed)}')
          PY

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pandas numpy pyarrow scikit-learn python-dotenv openai requests

      - name: Compile reliability sidecar
        run: |
          python -m compileall -q core/ai_reliability_agent
          python -m py_compile \
            scripts/run_ai_reliability_agent.py \
            scripts/run_ai_reliability_historical_replay.py \
            scripts/run_ai_reliability_historical_candle_replay.py \
            scripts/run_ai_reliability_pr763_session.py

      - name: Run focused reliability tests
        run: pytest -q -o addopts='' tests/test_ai_reliability*.py

      - name: Validate diff
        run: git diff --check

      - name: Commit completed sidecar without temporary machinery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/_temporary_ai_reliability_completion_v1.yml \
            tools/_temporary_import_ai_reliability_v1.py
          git add -A -- \
            core/ai_reliability_agent \
            scripts/run_ai_reliability_agent.py \
            scripts/run_ai_reliability_historical_replay.py \
            scripts/run_ai_reliability_historical_candle_replay.py \
            scripts/run_ai_reliability_pr763_session.py \
            tests/test_ai_reliability_agent.py \
            tests/test_ai_reliability_analytics.py \
            tests/test_ai_reliability_evidence.py \
            tests/test_ai_reliability_historical_candle_replay.py \
            tests/test_ai_reliability_historical_replay.py \
            tests/test_ai_reliability_integration.py \
            tests/test_ai_reliability_pr763_session.py \
            tests/fixtures/ai_reliability_real_artifact \
            docs/agent_reviews/ai_reliability_agent_v1.md \
            docs/agent_reviews/ai_reliability_pr763_live_evidence_v1.md \
            docs/architecture/ai_reliability_agent_v1.md \
            docs/test-reports/ai_reliability_agent_v1_certification.json \
            docs/test-reports/ai_reliability_agent_v1_certification.md \
            .github/workflows/_temporary_ai_reliability_completion_v1.yml \
            tools/_temporary_import_ai_reliability_v1.py
          python - <<'PY'
          import subprocess
          allowed_prefixes = (
              'core/ai_reliability_agent/',
              'scripts/run_ai_reliability',
              'tests/test_ai_reliability',
              'tests/fixtures/ai_reliability_real_artifact/',
              'docs/agent_reviews/ai_reliability',
              'docs/architecture/ai_reliability',
              'docs/test-reports/ai_reliability',
              '.github/workflows/_temporary_ai_reliability_completion_v1.yml',
              'tools/_temporary_import_ai_reliability_v1.py',
          )
          staged = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          bad = [path for path in staged if not any(path.startswith(prefix) for prefix in allowed_prefixes)]
          if bad:
              raise SystemExit(f'STAGED_OUT_OF_SCOPE:{bad}')
          print(f'staged allowlisted paths: {len(staged)}')
          PY
          git commit -m "feat: complete read-only PR763 reliability evidence chain"
          git push origin HEAD:post-pr763/ai-reliability-live-evidence-v1

# trigger: workflow exists in parent commit
