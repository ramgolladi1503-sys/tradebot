name: Temporary Isolate Restart Test Threading

on:
  push:
    branches:
      - post-pr763/meg-shadow-system-certification-v2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: post-pr763/meg-shadow-system-certification-v2
          fetch-depth: 0
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply exact restart test isolation patch
        run: python tools/_temporary_isolate_restart_test_threading.py

      - name: Commit patch and remove temporary machinery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/_temporary_isolate_restart_test_threading.yml \
            tools/_temporary_isolate_restart_test_threading.py \
            tools/_trigger_isolate_restart_test_threading.txt
          git add tests/test_kite_depth_restart.py
          git diff --cached --check
          git commit -m "test: isolate restart thread sentinel from persistence worker"
          git push origin HEAD:post-pr763/meg-shadow-system-certification-v2
