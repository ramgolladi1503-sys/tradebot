name: Reversal Trap Description-Derived V2

on:
  pull_request:
    paths:
      - "scripts/reversal_trap_description_v2_parts/**"
      - "tests/research/test_reversal_trap_description_derived_v2.py"
      - "docs/research/reversal_trap_description_derived_strategy_v1.md"
      - ".github/workflows/reversal-trap-structural-edge-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused dependencies
        run: python -m pip install numpy pandas numba pytest
      - name: Decode immutable research runner
        run: |
          cat scripts/reversal_trap_description_v2_parts/part*.b64 | base64 --decode | gzip --decompress > /tmp/run_reversal_trap_description_derived_v2.py
          echo "313cb8e0010e8e5343d1d69abc18964b64e305f8803c7b2969fe3d107e865cbc  /tmp/run_reversal_trap_description_derived_v2.py" | sha256sum --check
          python -m py_compile /tmp/run_reversal_trap_description_derived_v2.py
      - name: Focused causal tests
        env:
          REVERSAL_V2_SCRIPT: /tmp/run_reversal_trap_description_derived_v2.py
        run: pytest -q tests/research/test_reversal_trap_description_derived_v2.py
      - name: Download pinned public NIFTY minute corpus
        run: |
          curl --fail --location --retry 3 --output /tmp/nifty50_candlestick_data.csv \
            https://raw.githubusercontent.com/sandeepkapri/Nifty50-Minute-Data/81800ba10cf47e9c7806b6a40e300ef389187846/nifty50_candlestick_data.csv
          echo "9b347479bb242e8cea8f85011a4d53e8938c1bfea1697fa25d8ef25d8888784d  /tmp/nifty50_candlestick_data.csv" | sha256sum --check
      - name: Run description-derived study
        run: |
          python /tmp/run_reversal_trap_description_derived_v2.py \
            --data /tmp/nifty50_candlestick_data.csv \
            --output-dir evidence/reversal_trap_description_derived_v2
          cp /tmp/run_reversal_trap_description_derived_v2.py evidence/reversal_trap_description_derived_v2/runner_snapshot.py
      - name: Show verdict
        run: cat evidence/reversal_trap_description_derived_v2/report.md
      - uses: actions/upload-artifact@v4
        with:
          name: reversal-trap-description-derived-v2-evidence
          path: evidence/reversal_trap_description_derived_v2/
