name: Reversal Trap Structural Edge V1

on:
  pull_request:
    paths:
      - "scripts/run_reversal_trap_structural_edge_v1.py"
      - "tests/research/test_reversal_trap_structural_edge_v1.py"
      - ".github/workflows/reversal-trap-structural-edge-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused dependencies
        run: python -m pip install numpy pandas pyarrow pytest
      - name: Compile
        run: python -m py_compile scripts/run_reversal_trap_structural_edge_v1.py
      - name: Focused tests
        run: PYTHONPATH=. pytest -q tests/research/test_reversal_trap_structural_edge_v1.py
      - name: Run falsification study on repository candle corpus
        run: PYTHONPATH=. python scripts/run_reversal_trap_structural_edge_v1.py --output-dir evidence/reversal_trap_structural_edge_v1
      - name: Show verdict
        run: cat evidence/reversal_trap_structural_edge_v1/report.md
      - uses: actions/upload-artifact@v4
        with:
          name: reversal-trap-structural-edge-v1-evidence
          path: evidence/reversal_trap_structural_edge_v1/
