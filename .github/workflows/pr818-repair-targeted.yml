name: PR818 Repair Targeted Diagnostics

on:
  push:
    branches:
      - repair/pr818-green-integration-v1

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      DATA_ROOT: ${{ github.workspace }}/.runtime
      KITE_USE_API: "false"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install 'pandas<3.0'
      - name: Diagnostic canonical fixture migration
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/conftest.py')
          s = p.read_text()
          old = '''    import json
    from core.feed.artifact_provenance import stamp_feed_runtime_provenance
    from core.feed.artifact_loader import FEED_RUNTIME_CANONICAL_WRITER, FEED_RUNTIME_SCHEMA_VERSION
    from core.runtime_truth_integrity import truth_hash_from_mapping
    feed_path = runtime_root / "logs" / "feed_runtime_latest.json"
    feed_path.parent.mkdir(parents=True, exist_ok=True)
    feed_payload = stamp_feed_runtime_provenance(
        {
            "feed_ok": True,
            "writer": FEED_RUNTIME_CANONICAL_WRITER,
            "schema_version": FEED_RUNTIME_SCHEMA_VERSION,
        }
    )
    feed_payload["snapshot_hash"] = truth_hash_from_mapping(feed_payload)
    feed_path.write_text(json.dumps(feed_payload), encoding="utf-8")
'''
          new = '''    from tests.fixtures.canonical_feed_factory import make_valid_canonical_feed_pair
    make_valid_canonical_feed_pair(runtime_root / "logs", feed_ok=True)
'''
          if old not in s:
              raise SystemExit('expected legacy canonical fixture block not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Run known failing modules
        run: >-
          pytest -q -o addopts=''
          tests/strategy_truth/test_legacy_quarantine.py
          tests/test_blocker_lifecycle.py
          tests/test_feed_runtime_states.py
          tests/test_jit_quote_revalidation.py
          tests/test_kite_auth_consistency.py
          tests/test_kite_depth_ws_stability.py
          tests/test_kite_read_only_observation_runtime.py
          tests/test_live_quote_truth_contract_phase2.py
          tests/test_main_startup_audit.py
          tests/test_market_data_index_quote_cache.py
          tests/test_orchestrator_depth_ws_startup.py
          tests/test_orchestrator_pilot_feed_ok.py
          tests/test_phase2_fallback_contract_firewall.py
          tests/test_phase2_live_fallback_disabled.py
          tests/test_phase2_strict_live_data_contract.py
          tests/test_pr763_callback_persistence_cutover_certification.py
          tests/test_readiness_state_machine.py
          tests/test_review_queue_live_entry.py
