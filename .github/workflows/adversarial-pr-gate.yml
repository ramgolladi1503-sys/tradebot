name: Adversarial PR Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  candidate-adversarial-execution:
    if: github.event_name == 'pull_request'
    name: adversarial-pr-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      EXECUTION_MODE: PAPER
      KITE_USE_API: "false"
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact head and fetch exact base
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git fetch --no-tags --prune origin "$BASE_SHA"
          git update-ref refs/remotes/origin/adversarial-base "$BASE_SHA"
          test "$(git rev-parse refs/remotes/origin/adversarial-base)" = "$BASE_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bounded gate dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest hypothesis numpy

      - name: Execute adversarial gate against exact candidate
        env:
          ADVERSARIAL_BASE_REF: refs/remotes/origin/adversarial-base
          ADVERSARIAL_CANDIDATE_REF: ${{ github.event.pull_request.head.sha }}
          ADVERSARIAL_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: python scripts/run_adversarial_pr_gate.py --base-ref "$ADVERSARIAL_BASE_REF" --candidate-ref "$ADVERSARIAL_CANDIDATE_REF" --branch "$ADVERSARIAL_BRANCH" --run-tests

  trusted-adversarial-policy:
    if: github.event_name == 'pull_request_target'
    name: adversarial-pr-trusted-policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted protected main policy only
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch exact base and candidate without executing candidate
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin "$BASE_SHA"
          git update-ref refs/remotes/origin/adversarial-base "$BASE_SHA"
          test "$(git rev-parse refs/remotes/origin/adversarial-base)" = "$BASE_SHA"
          git fetch --no-tags --prune origin +refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr-${PR_NUMBER}-head
          test "$(git rev-parse refs/remotes/origin/pr-${PR_NUMBER}-head)" = "$HEAD_SHA"

      - name: Run trusted-base adversarial policy inspection
        env:
          ADVERSARIAL_BASE_REF: refs/remotes/origin/adversarial-base
          ADVERSARIAL_CANDIDATE_REF: refs/remotes/origin/pr-${{ github.event.pull_request.number }}-head
          ADVERSARIAL_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: python scripts/run_adversarial_pr_gate.py --base-ref "$ADVERSARIAL_BASE_REF" --candidate-ref "$ADVERSARIAL_CANDIDATE_REF" --branch "$ADVERSARIAL_BRANCH"
