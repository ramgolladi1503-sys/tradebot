name: Adversarial PR Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions: {}

jobs:
  candidate-adversarial-execution:
    if: github.event_name == 'pull_request'
    name: adversarial-pr-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PYTHONPATH: .
      DATA_ROOT: ${{ github.workspace }}/.runtime
      EXECUTION_MODE: PAPER
      KITE_USE_API: "false"
      PYTHONHASHSEED: "0"
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact head and fetch exact base
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git fetch --no-tags --prune origin "$BASE_SHA"
          git update-ref refs/remotes/origin/adversarial-base "$BASE_SHA"
          test "$(git rev-parse refs/remotes/origin/adversarial-base)" = "$BASE_SHA"

      - name: Set up trusted Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Static adversarial inspection before dependency installation
        env:
          ADVERSARIAL_BASE_REF: refs/remotes/origin/adversarial-base
          ADVERSARIAL_CANDIDATE_REF: ${{ github.event.pull_request.head.sha }}
          ADVERSARIAL_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: python scripts/run_adversarial_pr_gate.py --base-ref "$ADVERSARIAL_BASE_REF" --candidate-ref "$ADVERSARIAL_CANDIDATE_REF" --branch "$ADVERSARIAL_BRANCH"

      - name: Install trusted-base test dependencies
        run: |
          set -euo pipefail
          git show refs/remotes/origin/adversarial-base:requirements.txt > /tmp/adversarial-base-requirements.txt
          python -m pip install --upgrade pip
          pip install -r /tmp/adversarial-base-requirements.txt
          pip install 'pandas<3.0' hypothesis

      - name: Execute changed tests under adversarial gate
        env:
          ADVERSARIAL_BASE_REF: refs/remotes/origin/adversarial-base
          ADVERSARIAL_CANDIDATE_REF: ${{ github.event.pull_request.head.sha }}
          ADVERSARIAL_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: python scripts/run_adversarial_pr_gate.py --base-ref "$ADVERSARIAL_BASE_REF" --candidate-ref "$ADVERSARIAL_CANDIDATE_REF" --branch "$ADVERSARIAL_BRANCH" --run-tests

  trusted-adversarial-policy:
    if: github.event_name == 'pull_request_target'
    name: adversarial-pr-trusted-policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      statuses: write
    steps:
      - name: Checkout trusted protected main policy only
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch exact base and candidate without executing candidate
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin "$BASE_SHA"
          git update-ref refs/remotes/origin/adversarial-base "$BASE_SHA"
          test "$(git rev-parse refs/remotes/origin/adversarial-base)" = "$BASE_SHA"
          git fetch --no-tags --prune origin +refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr-${PR_NUMBER}-head
          test "$(git rev-parse refs/remotes/origin/pr-${PR_NUMBER}-head)" = "$HEAD_SHA"

      - name: Verify adversarial status is mandatory and base-fresh on main
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.request

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get_json(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          summaries = get_json(f"https://api.github.com/repos/{repo}/rulesets?per_page=100")
          active = []
          for summary in summaries:
              if summary.get("enforcement") != "active" or summary.get("target") != "branch":
                  continue
              detail = get_json(f"https://api.github.com/repos/{repo}/rulesets/{summary['id']}")
              active.append(detail)

          required_context = "adversarial-pr-trusted-head"
          matched = False
          diagnostics = []
          for ruleset in active:
              conditions = ruleset.get("conditions", {}).get("ref_name", {})
              includes = set(conditions.get("include", []))
              if "~DEFAULT_BRANCH" not in includes and "refs/heads/main" not in includes:
                  continue
              for rule in ruleset.get("rules", []):
                  if rule.get("type") != "required_status_checks":
                      continue
                  params = rule.get("parameters", {})
                  contexts = {
                      item.get("context")
                      for item in params.get("required_status_checks", [])
                      if isinstance(item, dict)
                  }
                  strict = params.get("strict_required_status_checks_policy") is True
                  diagnostics.append(
                      {
                          "ruleset": ruleset.get("name"),
                          "strict": strict,
                          "contexts": sorted(c for c in contexts if c),
                      }
                  )
                  if strict and required_context in contexts:
                      matched = True

          print(json.dumps({"rulesets": diagnostics}, sort_keys=True))
          if not matched:
              print(
                  "ADVERSARIAL_RULESET_ENFORCEMENT_MISSING: require adversarial-pr-trusted-head and strict_required_status_checks_policy=true",
                  file=sys.stderr,
              )
              sys.exit(1)
          print("ADVERSARIAL_RULESET_ENFORCEMENT_VERIFIED")
          PY

      - name: Require OWNER exact-SHA approval for gate recertification branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          case "$HEAD_REF" in
            governance/adversarial-gate-recertification-*) ;;
            *) exit 0 ;;
          esac
          EXPECTED="/authorize-adversarial-gate-recertification $HEAD_SHA"
          export EXPECTED
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.request

          repo = os.environ["REPOSITORY"]
          pr = os.environ["PR_NUMBER"]
          token = os.environ["GH_TOKEN"]
          expected = os.environ["EXPECTED"]
          page = 1
          while True:
              url = f"https://api.github.com/repos/{repo}/issues/{pr}/comments?per_page=100&page={page}"
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req) as response:
                  comments = json.load(response)
              for comment in comments:
                  if (
                      comment.get("author_association") == "OWNER"
                      and comment.get("body", "").strip() == expected
                  ):
                      print("OWNER_EXACT_SHA_RECERTIFICATION_AUTHORIZED")
                      sys.exit(0)
              if len(comments) < 100:
                  break
              page += 1
          print("OWNER_EXACT_SHA_RECERTIFICATION_AUTHORIZATION_MISSING", file=sys.stderr)
          sys.exit(1)
          PY

      - name: Protect all workflow and custom-action changes
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          drift="$(git diff --name-only refs/remotes/origin/adversarial-base refs/remotes/origin/pr-${{ github.event.pull_request.number }}-head -- .github/workflows .github/actions)"
          if [[ -z "$drift" ]]; then
            exit 0
          fi
          case "$HEAD_REF" in
            governance/adversarial-gate-recertification-*) ;;
            *)
              echo 'WORKFLOW_OR_ACTION_CHANGE_REQUIRES_OWNER_RECERTIFICATION' >&2
              printf '%s\n' "$drift" >&2
              exit 1
              ;;
          esac

      - name: Evaluate trusted-base adversarial policy
        id: trusted_policy
        continue-on-error: true
        env:
          ADVERSARIAL_BASE_REF: refs/remotes/origin/adversarial-base
          ADVERSARIAL_CANDIDATE_REF: refs/remotes/origin/pr-${{ github.event.pull_request.number }}-head
          ADVERSARIAL_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set +e
          python scripts/run_adversarial_pr_gate.py \
            --base-ref "$ADVERSARIAL_BASE_REF" \
            --candidate-ref "$ADVERSARIAL_CANDIDATE_REF" \
            --branch "$ADVERSARIAL_BRANCH"
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Publish trusted verdict on exact PR head
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          POLICY_OUTCOME: ${{ steps.trusted_policy.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [[ "$POLICY_OUTCOME" == "success" && "$JOB_STATUS" != "failure" ]]; then
            state=success
            description='Protected-main adversarial policy passed exact PR head'
          else
            state=failure
            description='Protected-main adversarial policy failed exact PR head'
          fi
          payload="$(STATE="$state" DESCRIPTION="$description" python -c 'import json,os; print(json.dumps({"state":os.environ["STATE"],"context":"adversarial-pr-trusted-head","description":os.environ["DESCRIPTION"]}))')"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$HEAD_SHA" \
            -d "$payload"

      - name: Fail trusted policy job when policy failed
        if: steps.trusted_policy.outcome != 'success'
        run: exit 1
