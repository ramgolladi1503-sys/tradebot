name: Feed Smoke

on:
  pull_request:
    paths:
      - "core/feed/**"
      - "core/kite_depth_ws.py"
      - "core/tick_store.py"
      - "core/trade_store.py"
      - "core/storage/**"
      - "scripts/run_feed_reconnect_resource_soak.py"
      - "tests/test_feed_reconnect_resource_soak.py"
      - "tests/conftest.py"
      - "pytest.ini"
      - ".github/workflows/feed-smoke.yml"
      - ".github/workflows/feed-resource-soak.yml"
  push:
    branches:
      - main
    paths:
      - "core/feed/**"
      - "core/kite_depth_ws.py"
      - "core/tick_store.py"
      - "core/trade_store.py"
      - "core/storage/**"
      - "scripts/run_feed_reconnect_resource_soak.py"
      - "tests/test_feed_reconnect_resource_soak.py"
      - "tests/conftest.py"
      - "pytest.ini"
      - ".github/workflows/feed-smoke.yml"
      - ".github/workflows/feed-resource-soak.yml"

concurrency:
  group: feed-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  feed_smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      DATA_ROOT: ${{ github.workspace }}/.runtime
      EXECUTION_MODE: PAPER
      KITE_USE_API: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run short feed lifecycle smoke suite
        run: >-
          PYTHONPATH=. pytest -q -o addopts=''
          tests/test_feed_reconnect_resource_soak.py
          -m "feed_smoke and not feed_soak and not certification"
          --durations=20
