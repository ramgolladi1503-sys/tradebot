name: Observe Liquidity Exhaustion Depth Readiness V2

# Revision 4: refresh after completed readiness evidence.
on:
  push:
    branches:
      - ops/observe-liquidity-exhaustion-depth-readiness-v2
    paths:
      - ".github/workflows/observe_liquidity_exhaustion_depth_readiness_v2.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/observe-liquidity-exhaustion-depth-readiness-v2
          fetch-depth: 1

      - name: Query latest readiness run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/liquidity_exhaustion_depth_readiness_v2.yml/runs?branch=research%2Fliquidity-exhaustion-depth-readiness-v2&event=push&per_page=10" \
            > /tmp/runs.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/runs.json').read_text())
          runs = payload.get('workflow_runs', [])
          result = {'status': 'NOT_FOUND'}
          if runs:
              run = runs[0]
              result = {
                  'workflow_name': run.get('name'),
                  'workflow_run_id': run.get('id'),
                  'run_number': run.get('run_number'),
                  'status': run.get('status'),
                  'conclusion': run.get('conclusion'),
                  'head_sha': run.get('head_sha'),
                  'created_at': run.get('created_at'),
                  'updated_at': run.get('updated_at'),
                  'html_url': run.get('html_url'),
              }
          target = Path('docs/ops/liquidity_exhaustion_depth_readiness_v2_status.json')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Commit observer result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ops/liquidity_exhaustion_depth_readiness_v2_status.json
          git commit -m "ops: publish depth-readiness workflow status"
          git push origin HEAD:ops/observe-liquidity-exhaustion-depth-readiness-v2
