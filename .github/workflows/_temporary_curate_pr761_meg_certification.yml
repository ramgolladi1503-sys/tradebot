name: Temporary Curate PR761 for MEG Certification

on:
  push:
    branches:
      - post-pr763/meg-shadow-system-certification-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      TRADEBOT_READ_ONLY: "true"
      EXECUTION_MODE: "SIM"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: post-pr763/meg-shadow-system-certification-v1
          fetch-depth: 0
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Fetch exact PR761 source
        run: |
          git fetch origin \
            refs/heads/agent/enterprise-qa-foundation-v1:refs/remotes/origin/agent/enterprise-qa-foundation-v1

      - name: Apply curated extraction
        run: python tools/_temporary_curate_pr761_for_meg_certification.py

      - name: Verify curated working-tree scope
        run: |
          python - <<'PY'
          import subprocess
          expected = {
              'core/auth_manager.py',
              'docs/qa/ENTERPRISE_QA_MASTER_PLAN.md',
              'docs/qa/MODULE_RISK_REGISTER.md',
              'scripts/audit_test_integrity.py',
              'tests/test_test_integrity_audit.py',
              'tests/auth/test_auth_manager_behavior_contracts.py',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if changed != expected:
              raise SystemExit(f'CURATED_SCOPE_MISMATCH:changed={sorted(changed)} expected={sorted(expected)}')
          print('curated scope verified')
          PY

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            pytest pandas numpy pyarrow scikit-learn \
            python-dotenv requests openai kiteconnect holidays

      - name: Compile curated and certification paths
        run: |
          python -m py_compile \
            core/auth_manager.py \
            scripts/audit_test_integrity.py \
            scripts/run_meg_shadow_offline_certification.py \
            scripts/assemble_meg_shadow_system_certificate.py
          python -m compileall -q core/qa_certification core/ai_reliability_agent

      - name: Run focused curated tests
        run: |
          pytest -q -o addopts='' \
            tests/auth/test_auth_manager_behavior_contracts.py \
            tests/test_test_integrity_audit.py \
            tests/qa/test_meg_shadow_system_certification.py \
            tests/test_ai_reliability_pr763_session.py \
            tests/test_runtime_authority_cutover_v1.py

      - name: Run test-integrity audit
        run: python scripts/audit_test_integrity.py --repo .

      - name: Validate diff
        run: git diff --check

      - name: Commit only curated production files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/_temporary_curate_pr761_meg_certification.yml \
            tools/_temporary_curate_pr761_for_meg_certification.py
          git add -- \
            core/auth_manager.py \
            docs/qa/ENTERPRISE_QA_MASTER_PLAN.md \
            docs/qa/MODULE_RISK_REGISTER.md \
            scripts/audit_test_integrity.py \
            tests/test_test_integrity_audit.py \
            tests/auth/test_auth_manager_behavior_contracts.py \
            .github/workflows/_temporary_curate_pr761_meg_certification.yml \
            tools/_temporary_curate_pr761_for_meg_certification.py
          python - <<'PY'
          import subprocess
          allowed = {
              'core/auth_manager.py',
              'docs/qa/ENTERPRISE_QA_MASTER_PLAN.md',
              'docs/qa/MODULE_RISK_REGISTER.md',
              'scripts/audit_test_integrity.py',
              'tests/test_test_integrity_audit.py',
              'tests/auth/test_auth_manager_behavior_contracts.py',
              '.github/workflows/_temporary_curate_pr761_meg_certification.yml',
              'tools/_temporary_curate_pr761_for_meg_certification.py',
          }
          staged = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          if not staged or not staged.issubset(allowed):
              raise SystemExit(f'STAGED_CURATED_SCOPE_INVALID:{sorted(staged)}')
          print(f'staged curated paths={len(staged)}')
          PY
          git commit -m "qa: curate auth and test-integrity foundation for MEG shadow"
          git push origin HEAD:post-pr763/meg-shadow-system-certification-v1
