name: PR657 Autofix

on:
  push:
    branches:
      - fix/canonical-strategy-input-truth

permissions:
  contents: write

concurrency:
  group: pr657-autofix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    if: github.event.head_commit.message != 'test: align freshness fixtures with frozen cutoff'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      DATA_ROOT: ${{ github.workspace }}/.runtime
      EXECUTION_MODE: PAPER
      KITE_USE_API: "false"
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/canonical-strategy-input-truth
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Align legacy fixtures with the frozen cutoff
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          quote_path = Path('tests/test_market_data_index_quote_cache.py')
          quote_text = quote_path.read_text(encoding='utf-8')
          targets = (
              'test_index_depth_missing_synthesizes_quote',
              'test_index_depth_missing_live_keeps_quote_false',
              'test_index_depth_missing_live_offhours_allows_synthetic_and_offhours_chain',
          )
          for target in targets:
              start = quote_text.index(f'def {target}(')
              end = quote_text.find('\ndef ', start + 1)
              if end == -1:
                  end = len(quote_text)
              block = quote_text[start:end]
              pattern = re.compile(
                  r'    fixed_epoch = 1710000000\.0\n'
                  r'    fixed_now = (md\.now_ist\(\)\.replace\([^\n]+\))\n'
              )
              updated, count = pattern.subn(
                  r'    fixed_now = \1\n    fixed_epoch = fixed_now.timestamp()\n',
                  block,
                  count=1,
              )
              if count != 1:
                  raise RuntimeError(f'expected one frozen-clock fixture in {target}, found {count}')
              quote_text = quote_text[:start] + updated + quote_text[end:]
          quote_path.write_text(quote_text, encoding='utf-8')

          sanity_path = Path('tests/test_time_sanity_staleness.py')
          sanity = sanity_path.read_text(encoding='utf-8')
          replacements = (
              ('from datetime import timedelta', 'from datetime import datetime, timedelta'),
              (
                  '    fixed_now = now_ist().replace(hour=10, minute=0, second=0, microsecond=0, tzinfo=ZoneInfo("Asia/Kolkata"))',
                  '    fixed_now = datetime.fromtimestamp(now_epoch, tz=ZoneInfo("Asia/Kolkata"))',
              ),
              (
                  '    monkeypatch.setattr(market_data.ohlc_buffer, "get_bars", lambda symbol: [{"close": 25000.0}] * 40)',
                  '    monkeypatch.setattr(\n'
                  '        market_data.ohlc_buffer,\n'
                  '        "get_completed_bars",\n'
                  '        lambda symbol, *, as_of, interval_seconds=60: [{"ts": last_ts, "close": 25000.0}] * 40,\n'
                  '    )',
              ),
              (
                  '    reference_now = now_ist()',
                  '    reference_now = datetime.fromtimestamp(170.0, tz=ZoneInfo("Asia/Kolkata"))',
              ),
          )
          for old, new in replacements:
              expected = 2 if old == '    reference_now = now_ist()' else 1
              count = sanity.count(old)
              if count != expected:
                  raise RuntimeError(f'expected {expected} occurrences of {old!r}, found {count}')
              sanity = sanity.replace(old, new)
          sanity_path.write_text(sanity, encoding='utf-8')

          review_path = Path('docs/agent_reviews/canonical_strategy_input_truth_repair.md')
          review = review_path.read_text(encoding='utf-8')
          review = review.replace(
              'tests/test_market_data_warm_seed.py, docs/agent_reviews',
              'tests/test_market_data_warm_seed.py, tests/test_market_data_index_quote_cache.py, tests/test_time_sanity_staleness.py, docs/agent_reviews',
          )
          review = review.replace(
              '- tests/test_market_data_warm_seed.py\n- docs/agent_reviews',
              '- tests/test_market_data_warm_seed.py\n- tests/test_market_data_index_quote_cache.py\n- tests/test_time_sanity_staleness.py\n- docs/agent_reviews',
          )
          review = review.replace(
              '- source: tests/core/test_canonical_strategy_input_truth.py and tests/test_market_data_warm_seed.py',
              '- source: tests/core/test_canonical_strategy_input_truth.py, tests/test_market_data_warm_seed.py, tests/test_market_data_index_quote_cache.py, and tests/test_time_sanity_staleness.py',
          )
          review += (
              '\n\n## CI Compatibility Closure\n'
              'The post-merge fast suite exposed four legacy fixtures that supplied contradictory physical clocks: '
              '`now_ist()` represented the current date while `now_utc_epoch()` represented an unrelated historical epoch. '
              'The fixtures now derive quote epochs from the frozen IST cutoff. The time-sanity fixture also mocks '
              '`get_completed_bars()` rather than the retired raw `get_bars()` strategy-input path. Production code was not changed.\n'
          )
          review_path.write_text(review, encoding='utf-8')

          handoff_path = Path('docs/agent_handoffs/canonical-strategy-input-truth-repair-codex.md')
          handoff = handoff_path.read_text(encoding='utf-8')
          handoff = handoff.replace(
              'tests/test_market_data_warm_seed.py, docs/agent_reviews',
              'tests/test_market_data_warm_seed.py, tests/test_market_data_index_quote_cache.py, tests/test_time_sanity_staleness.py, docs/agent_reviews',
          )
          handoff += (
              '\n\n## CI Compatibility Closure\n'
              'Four legacy freshness fixtures were aligned to the single frozen cutoff and the canonical '
              '`get_completed_bars()` API. This was test-only compatibility work; no production semantics changed.\n'
          )
          handoff_path.write_text(handoff, encoding='utf-8')
          PY

      - name: Remove temporary diagnostic workflows
        run: |
          rm -f .github/workflows/pr657-diagnostics.yml
          rm -f .github/workflows/pr657-autofix.yml

      - name: Run the four failed tests and related canonical suites
        run: |
          PYTHONPATH=. pytest -q -o addopts='' \
            tests/test_market_data_index_quote_cache.py::test_index_depth_missing_synthesizes_quote \
            tests/test_market_data_index_quote_cache.py::test_index_depth_missing_live_keeps_quote_false \
            tests/test_market_data_index_quote_cache.py::test_index_depth_missing_live_offhours_allows_synthetic_and_offhours_chain \
            tests/test_time_sanity_staleness.py::test_fresh_timestamps_do_not_block \
            tests/core/test_canonical_strategy_input_truth.py \
            tests/test_market_data_warm_seed.py

      - name: Commit and push guarded fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tests/test_market_data_index_quote_cache.py \
            tests/test_time_sanity_staleness.py \
            docs/agent_reviews/canonical_strategy_input_truth_repair.md \
            docs/agent_handoffs/canonical-strategy-input-truth-repair-codex.md \
            .github/workflows/pr657-diagnostics.yml \
            .github/workflows/pr657-autofix.yml
          git diff --cached --check
          git commit -m "test: align freshness fixtures with frozen cutoff"
          git push origin HEAD:fix/canonical-strategy-input-truth
