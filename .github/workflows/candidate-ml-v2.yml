name: Candidate ML V2

on:
  pull_request:
    paths:
      - "core/analytics/candidate_ml_v2/**"
      - "scripts/run_candidate_ml_v2.py"
      - "tests/test_candidate_ml_v2.py"
      - "docs/architecture/candidate_ml_v2.md"
      - "docs/agent_reviews/candidate_ml_v2.md"
      - ".github/workflows/candidate-ml-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate_ml_v2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy pandas scikit-learn joblib pyarrow
      - name: Compile
        run: |
          python -m py_compile \
            core/analytics/candidate_ml_v2/*.py \
            scripts/run_candidate_ml_v2.py \
            tests/test_candidate_ml_v2.py
      - name: Focused behavioral tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_candidate_ml_v2.py
      - name: Safety scan
        run: |
          if grep -RInE "place_order|modify_order|cancel_order|exit_order|kiteconnect|upstox" \
            core/analytics/candidate_ml_v2 scripts/run_candidate_ml_v2.py; then
            echo "Forbidden broker/order capability found"
            exit 1
          fi
