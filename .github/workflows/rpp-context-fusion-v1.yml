name: RPP Context Fusion V1

on:
  workflow_dispatch:
  push:
    branches:
      - research/rpp-context-fusion-v1-20260906
    paths:
      - "research/rpp_context_fusion_v1/**"
      - "research/reversal_probability_profile_v2/**"
      - "scripts/run_rpp_context_fusion_v1.py"
      - "tests/test_rpp_context_fusion_v1.py"
      - ".github/workflows/rpp-context-fusion-v1.yml"
  pull_request:
    branches:
      - research/reversal-probability-profile-v1-20260906
    paths:
      - "research/rpp_context_fusion_v1/**"
      - "scripts/run_rpp_context_fusion_v1.py"
      - "tests/test_rpp_context_fusion_v1.py"
      - ".github/workflows/rpp-context-fusion-v1.yml"

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  execute-rpp-context-fusion:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout without broad LFS hydration
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Pull only governed NIFTY constituent/index corpus
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull \
            --include="research/local_evidence_consolidation_v1/external_local_dirs/tradebot-ml-evidence/constituent-lead-lag-data-v1/proxy_campaign_2024_2025_v2/normalized/constituent_index_5m.parquet" \
            --exclude=""
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path("research/local_evidence_consolidation_v1/external_local_dirs/tradebot-ml-evidence/constituent-lead-lag-data-v1/proxy_campaign_2024_2025_v2/normalized/constituent_index_5m.parquet")
          if not p.exists():
              raise SystemExit("RPP_FUSION_DATA_MISSING")
          if p.read_bytes()[:4] != b"PAR1":
              raise SystemExit("RPP_FUSION_DATA_NOT_MATERIALIZED_PARQUET")
          if p.stat().st_size != 47788672:
              raise SystemExit(f"RPP_FUSION_SIZE_MISMATCH:{p.stat().st_size}")
          h = hashlib.sha256(p.read_bytes()).hexdigest()
          expected = "ae9645a83cb555899145e04ebe5a961fd130df25cba88a8fc8fd43b986bbfad0"
          print("RPP_FUSION_INPUT_SHA256=", h)
          if h != expected:
              raise SystemExit(f"RPP_FUSION_DATA_SHA_MISMATCH:{h}")
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
          cache: pip

      - name: Install pinned research dependencies
        run: |
          python -m pip install --upgrade "pip==26.2.1"
          python -m pip install \
            "numpy==2.5.1" \
            "pandas==3.0.5" \
            "pyarrow==25.0.0" \
            "pytest==9.1.1"

      - name: Run focused fusion tests
        run: |
          python -m pytest -q tests/test_rpp_context_fusion_v1.py tests/test_reversal_probability_profile_v2.py

      - name: Execute frozen physical fusion experiment
        run: |
          python scripts/run_rpp_context_fusion_v1.py \
            --input research/local_evidence_consolidation_v1/external_local_dirs/tradebot-ml-evidence/constituent-lead-lag-data-v1/proxy_campaign_2024_2025_v2/normalized/constituent_index_5m.parquet \
            --output-dir runtime/research/rpp_context_fusion_v1 \
            --cost-bps 5

      - name: Assert truth boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("runtime/research/rpp_context_fusion_v1/report.json")
          d = json.loads(p.read_text())
          required = {
              "parameter_search_performed": False,
              "event_subtype_selected_after_outcomes": False,
              "relative_density_is_calibrated_probability": False,
              "context_uses_future_bars": False,
              "official_constituent_weights_claimed": False,
              "holdout_evaluated": False,
              "option_pnl_claimed": False,
              "live_or_broker_authority": False,
              "sealed_tail_rpp_feature_rows_processed": 0,
              "sealed_tail_context_rows_processed": 0,
              "sealed_tail_outcomes_processed": 0,
          }
          for k, v in required.items():
              if d.get(k) != v:
                  raise SystemExit(f"RPP_FUSION_TRUTH_BOUNDARY_FAIL:{k}:{d.get(k)!r}")
          print("RPP_CONTEXT_FUSION_TRUTH_BOUNDARY=PASS")
          print("RPP_CONTEXT_FUSION_VERDICT=", d.get("verdict"))
          print("RPP_CONTEXT_FUSION_BLOCKERS=", d.get("blockers"))
          PY

      - name: Upload physical research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpp-context-fusion-v1-physical
          path: runtime/research/rpp_context_fusion_v1/
          if-no-files-found: warn
