name: QA Apply Validated Ranking Repairs

on:
  push:
    branches:
      - qa/whole-tradebot-certification-v1
    paths:
      - scripts/.apply_validated_ranking_repairs_once

permissions:
  contents: write

concurrency:
  group: qa-apply-validated-ranking-repairs
  cancel-in-progress: false

jobs:
  apply_validated_bundle:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      DATA_ROOT: ${{ github.workspace }}/.runtime
      EXECUTION_MODE: PAPER
      TRADING_MODE: PAPER
      KITE_USE_API: "false"
      VALIDATED_SOURCE_SHA: af06e04e889d88a6d56beb0063232ac9990f740e
      VALIDATED_PATCH_SHA256: e01ba460c6f7d74e4f1679d35897f56ae4829970f7f543e069a9661ad3419397
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@v4
        with:
          ref: qa/whole-tradebot-certification-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Reject source drift since validated bundle
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$VALIDATED_SOURCE_SHA" HEAD
          git diff --name-only "$VALIDATED_SOURCE_SHA" HEAD | sort -u > /tmp/pre_apply_changes.txt
          cat > /tmp/expected_pre_apply_changes.txt <<'EOF'
          .github/workflows/qa-apply-validated-ranking-repairs.yml
          scripts/.apply_validated_ranking_repairs_once
          EOF
          diff -u /tmp/expected_pre_apply_changes.txt /tmp/pre_apply_changes.txt

      - name: Build exact validated repair files
        run: |
          python scripts/build_remaining_whole_tradebot_repairs.py
          python scripts/build_dashboard_runtime_guard_repair.py
          python scripts/build_ranking_tiebreak_repair.py

      - name: Verify artifact file and patch hashes
        shell: bash
        run: |
          set -euo pipefail
          files=(
            core/analytics/schema.py
            core/candidate_journal.py
            core/evidence_replay_report.py
            core/expectancy/edge_ranking.py
            core/expectancy/setup_fingerprint.py
            core/intelligence/extractors/hardened_base.py
            core/opportunity_engine.py
            core/reject_shadow.py
            core/trade_identity.py
            dashboard/streamlit_app_runtime.py
            dashboard/ui/components.py
            dashboard/ui/table_model.py
            tests/qa/test_whole_tradebot_cross_module_truth.py
          )
          cat > /tmp/expected_files.txt <<'EOF'
          core/analytics/schema.py
          core/candidate_journal.py
          core/evidence_replay_report.py
          core/expectancy/edge_ranking.py
          core/expectancy/setup_fingerprint.py
          core/intelligence/extractors/hardened_base.py
          core/opportunity_engine.py
          core/reject_shadow.py
          core/trade_identity.py
          dashboard/streamlit_app_runtime.py
          dashboard/ui/components.py
          dashboard/ui/table_model.py
          tests/qa/test_whole_tradebot_cross_module_truth.py
          EOF
          git diff --check
          git diff --name-only -- "${files[@]}" | sort -u > /tmp/actual_files.txt
          diff -u /tmp/expected_files.txt /tmp/actual_files.txt
          cat > /tmp/expected_sha256s.txt <<'EOF'
          ed4a06ff4c1f6bdc9b7318a12f7c1729ea751b9aae7e9207110023c07150e72f  core/analytics/schema.py
          153f9e4e6aab9ddb19d7df4bf3e21ab0acb0b01578b8f048754599b797076ce3  core/candidate_journal.py
          73bfbb88b21f13553b728ffb7c1052abeb6151e09a06ee43de28bcb11acd8b62  core/evidence_replay_report.py
          66b0015b002ac37527dc89ee8cc6dc60d363a78461240cac8ab7b85b08686584  core/expectancy/edge_ranking.py
          39d1e700ec2b20f37af2a68877e32718d20b77afe18672f1f3eb613765a99f9c  core/expectancy/setup_fingerprint.py
          635f782c60e9f33e049b9d0a330660812db131488da8b7377a0f63ab3542ffb6  core/intelligence/extractors/hardened_base.py
          b3715d31c764677209e63aa4818e05abb4af06900552f800eb0a4502f66dfd18  core/opportunity_engine.py
          22336629d9f971ca0f51ce5a699c62aaf1af07fecd19ab9ba99b4a4eb74c7be3  core/reject_shadow.py
          96382e2d6ba40ab8e839a6c567f5f737febdeab8578b2789030f89cfaaee81c3  core/trade_identity.py
          0d614e9ab8bea1871f482e4d8d3f152c4ba652f7b5e15905db0063ed09579490  dashboard/streamlit_app_runtime.py
          8e0495333dd838d571060ae555d82d1adf6168863445ddb05c26d4df5e8b820f  dashboard/ui/components.py
          e09524d43263b3d66a4c66d4a095f474aed98c2d4be02a2fe4f40d0931ace217  dashboard/ui/table_model.py
          891998851bd614ad5a463568176c8f51a1072291f70a3376557ec25f6a5c4fdb  tests/qa/test_whole_tradebot_cross_module_truth.py
          EOF
          sha256sum -c /tmp/expected_sha256s.txt
          git diff -- "${files[@]}" > /tmp/validated.patch
          echo "$VALIDATED_PATCH_SHA256  /tmp/validated.patch" | sha256sum -c -

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies and scanner
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit

      - name: Re-run focused behavior and safety proofs
        run: >-
          PYTHONPATH=. pytest -q -o addopts=''
          tests/qa/test_whole_tradebot_cross_module_truth.py
          tests/qa/test_ranking_tiebreak_determinism.py
          tests/qa/test_remaining_whole_tradebot_security.py
          tests/qa/test_dashboard_operator_truth.py
          tests/test_dashboard_canonical_ranked_source.py
          tests/test_evidence_replay_report.py
          --durations=30

      - name: Re-run repaired-module security scan
        run: >-
          bandit -r
          core/opportunity_engine.py
          core/evidence_replay_report.py
          core/reject_shadow.py
          core/analytics/schema.py
          core/candidate_journal.py
          core/expectancy/edge_ranking.py
          core/expectancy/setup_fingerprint.py
          core/intelligence/extractors/hardened_base.py
          core/trade_identity.py
          dashboard/streamlit_app_runtime.py
          dashboard/ui/components.py
          dashboard/ui/table_model.py
          -ll

      - name: Commit exact validated repairs
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/.apply_validated_ranking_repairs_once
          rm -f scripts/build_remaining_whole_tradebot_repairs.py
          rm -f scripts/build_dashboard_runtime_guard_repair.py
          rm -f scripts/build_ranking_tiebreak_repair.py
          rm -f scripts/apply_whole_tradebot_qa_repairs_v1.py

          git add \
            core/opportunity_engine.py \
            core/evidence_replay_report.py \
            core/reject_shadow.py \
            core/analytics/schema.py \
            core/candidate_journal.py \
            core/expectancy/edge_ranking.py \
            core/expectancy/setup_fingerprint.py \
            core/intelligence/extractors/hardened_base.py \
            core/trade_identity.py \
            dashboard/streamlit_app_runtime.py \
            dashboard/ui/components.py \
            dashboard/ui/table_model.py \
            tests/qa/test_whole_tradebot_cross_module_truth.py \
            scripts/.apply_validated_ranking_repairs_once \
            scripts/build_remaining_whole_tradebot_repairs.py \
            scripts/build_dashboard_runtime_guard_repair.py \
            scripts/build_ranking_tiebreak_repair.py \
            scripts/apply_whole_tradebot_qa_repairs_v1.py

          git diff --cached --check
          git config user.name "tradebot-qa-bot"
          git config user.email "tradebot-qa-bot@users.noreply.github.com"
          git commit -m "fix: harden ranking fallback and dashboard truth"
          git push origin HEAD:qa/whole-tradebot-certification-v1
