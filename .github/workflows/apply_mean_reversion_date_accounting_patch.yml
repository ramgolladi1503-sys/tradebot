name: Apply Mean Reversion Date Accounting Patch

on:
  push:
    branches:
      - fix/mean-reversion-corpus-file-classification-v1
    paths:
      - ".github/workflows/apply_mean_reversion_date_accounting_patch.yml"

permissions:
  contents: write

jobs:
  patch-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mean-reversion-corpus-file-classification-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install focused dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install numpy pandas pyarrow pytest

      - name: Apply guarded patch
        run: |
          set -euo pipefail
          python tools/apply_mean_reversion_date_accounting_patch.py

      - name: Run focused production regressions
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m pytest -q \
            tests/test_research_candle_contract.py \
            tests/test_mean_reversion_corpus_directory_accounting.py \
            tests/test_mean_reversion_ledger_integrity.py \
            tests/test_phase4_audit_fail_closed.py \
            tests/test_vertical_slice_metrics.py
          python -m py_compile \
            core/research_backtest_integrity.py \
            scripts/generate_mean_reversion_trade_ledger.py

      - name: Commit production repair
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep quote-only dates out of candle capacity"
          git push origin HEAD:fix/mean-reversion-corpus-file-classification-v1
