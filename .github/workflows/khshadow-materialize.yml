name: Materialize Keltner Hilega Shadow Source

on:
  push:
    branches:
      - research/keltner-hm-live-shadow-v1
    paths:
      - '.khshadow_payload/**'
      - '.github/workflows/khshadow-materialize.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/keltner-hm-live-shadow-v1
          fetch-depth: 0
      - name: Verify and materialize source bundle
        shell: bash
        run: |
          set -euo pipefail
          test -d .khshadow_payload
          cat .khshadow_payload/part*.b64 | base64 --decode > /tmp/khshadow_payload.tar.gz
          echo '35d03c2e3762cb05e377de8c882bcf32254ed7df087ab8f788dd21d03fec9dbc  /tmp/khshadow_payload.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/khshadow_payload.tar.gz -C .
          rm -rf .khshadow_payload
          rm -f .github/workflows/khshadow-materialize.yml
      - name: Commit clean materialized implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(shadow): materialize offline-certified Keltner Hilega observer'
          git push origin HEAD:research/keltner-hm-live-shadow-v1
