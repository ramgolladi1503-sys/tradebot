name: PR657 Diagnostics

on:
  push:
    branches:
      - fix/canonical-strategy-input-truth

permissions:
  contents: read

concurrency:
  group: pr657-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      DATA_ROOT: ${{ github.workspace }}/.runtime
      EXECUTION_MODE: PAPER
      KITE_USE_API: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run fast suite with JUnit diagnostics
        id: pytest
        continue-on-error: true
        run: >-
          PYTHONPATH=. pytest -q -o addopts=''
          -m "not integration and not feed_smoke and not feed_soak and not certification"
          --tb=short --maxfail=4
          --junitxml=.runtime/pr657-junit.xml

      - name: Upload JUnit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr657-junit-${{ github.run_id }}
          if-no-files-found: error
          path: .runtime/pr657-junit.xml

      - name: Fail if pytest failed
        if: steps.pytest.outcome == 'failure'
        run: exit 1
