name: Temporary Final Certify Runtime Authority

on:
  push:
    branches:
      - post-pr763/runtime-authority-cutover-v1

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: .
      TRADEBOT_READ_ONLY: "true"
      EXECUTION_MODE: "SIM"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: post-pr763/runtime-authority-cutover-v1
          fetch-depth: 0
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Record tested head and restore exact frozen Git objects
        run: |
          git rev-parse HEAD > /tmp/runtime-authority-tested-head.txt
          git update-index --cacheinfo \
            100644,aeba49ecddeea4976c87a294e15335bb018a5b89,runtime/strategy_validation/resolved_option_ticks_20260702.parquet
          git checkout 1241418cafbefba8fd3d1142e5ae578d9b97cd70 -- \
            runtime/strategy_validation/regime_timeline.jsonl
          git rm \
            .github/workflows/_temporary_final_certify_authority.yml \
            tools/_trigger_final_certify_authority.txt

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pandas numpy python-dotenv requests kiteconnect holidays pyarrow streamlit

      - name: Compile authority paths
        id: compile
        continue-on-error: true
        run: |
          set -o pipefail
          python -m py_compile \
            core/canonical_execution_decision.py \
            core/runtime_authority_contract.py \
            core/ranking_authority.py \
            core/runtime_authority_cutover.py \
            core/live_fallback_execution_contract.py \
            core/opportunity_engine.py \
            core/execution_router.py \
            core/runtime_snapshot_producer.py \
            dashboard/ui/table_model.py \
            2>&1 | tee /tmp/runtime-authority-compile.log

      - name: Run focused authority proof
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          pytest -q -o addopts='' \
            tests/test_canonical_execution_decision.py \
            tests/test_runtime_authority_contract.py \
            tests/test_ranking_authority.py \
            tests/test_runtime_authority_cutover_v1.py \
            tests/test_manual_approval_enforcement.py \
            tests/test_opportunity_engine.py \
            2>&1 | tee /tmp/runtime-authority-tests.log

      - name: Reassert exact frozen runtime objects after tests
        run: |
          git update-index --cacheinfo \
            100644,aeba49ecddeea4976c87a294e15335bb018a5b89,runtime/strategy_validation/resolved_option_ticks_20260702.parquet
          git checkout 1241418cafbefba8fd3d1142e5ae578d9b97cd70 -- \
            runtime/strategy_validation/regime_timeline.jsonl

      - name: Verify protected scope from prospective commit tree
        id: scope
        continue-on-error: true
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee /tmp/runtime-authority-scope.log
          import subprocess
          base = '1241418cafbefba8fd3d1142e5ae578d9b97cd70'
          changed = subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only', base], text=True
          ).splitlines()
          protected = (
              'core/market_data.py', 'core/kite_depth_ws.py', 'core/feed/',
              'core/feed_runtime.py', 'core/feed_health_truth.py',
              'core/feed_hold_gate.py', 'core/recovery_state_machine.py',
              'core/kite_ws_subprocess.py', 'core/market_event_graph',
              'core/tick_store.py', 'core/depth_store.py',
              'core/persistence_durability.py', 'strategies/', 'runtime/',
          )
          bad = [path for path in changed if any(path == prefix or path.startswith(prefix) for prefix in protected)]
          if bad:
              raise SystemExit(f'PROTECTED_PR763_OR_RUNTIME_PATH_CHANGED:{bad}')
          print(f'changed_paths={len(changed)} protected_paths_unchanged=true')
          PY

      - name: Validate prospective diff
        id: diff
        continue-on-error: true
        run: git diff --cached --check 1241418cafbefba8fd3d1142e5ae578d9b97cd70 2>&1 | tee /tmp/runtime-authority-diff.log

      - name: Write certificate and commit explicit index
        if: always()
        run: |
          mkdir -p docs/test-reports
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          outcomes = {
              'compile': '${{ steps.compile.outcome }}',
              'tests': '${{ steps.tests.outcome }}',
              'scope': '${{ steps.scope.outcome }}',
              'diff': '${{ steps.diff.outcome }}',
          }
          passed = all(value == 'success' for value in outcomes.values())
          payload = {
              'schema_version': 4,
              'verdict': 'PASS_RUNTIME_AUTHORITY_CUTOVER_FOCUSED_CERTIFICATION' if passed else 'FAILED_RUNTIME_AUTHORITY_CUTOVER_FOCUSED_CERTIFICATION',
              'passed': passed,
              'tested_head_sha': Path('/tmp/runtime-authority-tested-head.txt').read_text().strip(),
              'pr763_base_sha': '1241418cafbefba8fd3d1142e5ae578d9b97cd70',
              'outcomes': outcomes,
              'read_only': True,
              'order_authority': False,
              'broker_write_authority': False,
              'logs': {},
          }
          for name in ('compile', 'tests', 'scope', 'diff'):
              path = Path(f'/tmp/runtime-authority-{name}.log')
              payload['logs'][name] = path.read_text(errors='replace')[-40000:] if path.exists() else ''
          semantic = {key: payload[key] for key in (
              'schema_version', 'verdict', 'passed', 'tested_head_sha',
              'pr763_base_sha', 'outcomes', 'read_only',
              'order_authority', 'broker_write_authority',
          )}
          payload['semantic_sha256'] = hashlib.sha256(
              json.dumps(semantic, sort_keys=True, separators=(',', ':')).encode()
          ).hexdigest()
          Path('docs/test-reports/runtime_authority_cutover_focused_certification.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n'
          )
          Path('docs/test-reports/runtime_authority_cutover_focused_certification.md').write_text(
              '# Runtime Authority Cutover Focused Certification\n\n'
              f"- Verdict: `{payload['verdict']}`\n"
              f"- Tested head SHA: `{payload['tested_head_sha']}`\n"
              f"- Semantic SHA-256: `{payload['semantic_sha256']}`\n"
              f"- Read only: `{payload['read_only']}`\n"
              f"- Order authority: `{payload['order_authority']}`\n"
              f"- Broker-write authority: `{payload['broker_write_authority']}`\n\n"
              '## Outcomes\n\n' + '\n'.join(
                  f'- `{key}`: `{value}`' for key, value in outcomes.items()
              ) + '\n'
          )
          PY
          git add \
            docs/test-reports/runtime_authority_cutover_focused_certification.json \
            docs/test-reports/runtime_authority_cutover_focused_certification.md \
            runtime/strategy_validation/regime_timeline.jsonl
          git update-index --cacheinfo \
            100644,aeba49ecddeea4976c87a294e15335bb018a5b89,runtime/strategy_validation/resolved_option_ticks_20260702.parquet
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --check
          git commit -m "evidence: finalize runtime authority offline certification"
          git push origin HEAD:post-pr763/runtime-authority-cutover-v1
