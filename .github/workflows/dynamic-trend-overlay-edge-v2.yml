name: Dynamic Trend Overlay Edge V2

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout without broad LFS hydration
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Pull bounded research corpus
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include="research/local_evidence_consolidation_v1/external_local_dirs/tradebot-ml-evidence/constituent-lead-lag-data-v1/proxy_campaign_2024_2025_v2/normalized/constituent_index_5m.parquet,research/local_evidence_consolidation_v1/external_local_dirs/tradebot-ml-evidence/upstox-expired-options-v1/**" --exclude=""

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bounded dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow

      - name: Materialize coverage-corrected runner
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import gzip
          from pathlib import Path
          payload = ""
          target = Path('/tmp/run_dynamic_trend_overlay_edge_v2.py')
          target.write_bytes(gzip.decompress(base64.b64decode(payload)))
          print(f'runner_bytes={target.stat().st_size}')
          PY
          python -m py_compile /tmp/run_dynamic_trend_overlay_edge_v2.py

      - name: Run coverage-corrected falsification campaign
        shell: bash
        run: |
          set -o pipefail
          mkdir -p runtime/research/dynamic_trend_overlay_edge_v2
          cp /tmp/run_dynamic_trend_overlay_edge_v2.py runtime/research/dynamic_trend_overlay_edge_v2/frozen_runner.py
          sha256sum /tmp/run_dynamic_trend_overlay_edge_v2.py | tee runtime/research/dynamic_trend_overlay_edge_v2/frozen_runner.sha256
          python /tmp/run_dynamic_trend_overlay_edge_v2.py --repo-root . 2>&1 | tee runtime/research/dynamic_trend_overlay_edge_v2/workflow.log

      - name: Print result
        if: always()
        shell: bash
        run: |
          if [ -f runtime/research/dynamic_trend_overlay_edge_v2/RESULT.md ]; then cat runtime/research/dynamic_trend_overlay_edge_v2/RESULT.md; fi
          if [ -f runtime/research/dynamic_trend_overlay_edge_v2/result.json ]; then cat runtime/research/dynamic_trend_overlay_edge_v2/result.json; fi

      - name: Upload research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-trend-overlay-edge-v2
          path: runtime/research/dynamic_trend_overlay_edge_v2
          if-no-files-found: error
