name: Observed Option-State Motif Discovery V1

on:
  pull_request:
    paths:
      - 'scripts/run_observed_option_state_motif_discovery_v1.py'
      - 'tests/research/test_observed_option_state_motif_discovery_v1.py'
      - '.github/workflows/observed-option-state-motif-discovery-v1.yml'
      - 'research/observed_option_state_motif_discovery_v1/**'
      - 'research/local_evidence_consolidation_v1/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository pointers
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Materialize required LFS evidence
        run: |
          git lfs install
          git lfs pull --include="research/local_evidence_consolidation_v1/worktrees/reverse-causal-option-expansion-v1/runtime_research/reverse_causal_option_expansion_v1/event_universe_5m.parquet"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install research dependencies
        run: python -m pip install pandas pyarrow numpy pytest

      - name: Run focused tests
        run: python -m pytest -q tests/research/test_observed_option_state_motif_discovery_v1.py

      - name: Run observe-first chronological discovery
        run: python -m scripts.run_observed_option_state_motif_discovery_v1 --repo-root .

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: observed-option-state-motif-discovery-v1-evidence
          path: |
            runtime/research/observed_option_state_motif_discovery_v1/**
            research/observed_option_state_motif_discovery_v1/RESULT.md
          if-no-files-found: error
