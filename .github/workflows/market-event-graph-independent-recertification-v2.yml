name: market-event-graph-independent-recertification-v2

on:
  push:
    branches:
      - research/market-event-graph-independent-recertification-v2
    paths:
      - 'scripts/run_market_event_graph_independent_recertification_v2.py'
      - 'scripts/run_market_event_graph_independent_recertification_v2_regime_safe.py'
      - 'tests/test_market_event_graph_independent_recertification_v2.py'
      - 'tests/test_market_event_graph_independent_regime_guard_v2.py'
      - 'research/market_event_graph_independent_recertification_v2/**'
      - '.github/workflows/market-event-graph-independent-recertification-v2.yml'
  pull_request:
    paths:
      - 'scripts/run_market_event_graph_independent_recertification_v2.py'
      - 'scripts/run_market_event_graph_independent_recertification_v2_regime_safe.py'
      - 'tests/test_market_event_graph_independent_recertification_v2.py'
      - 'tests/test_market_event_graph_independent_regime_guard_v2.py'
      - 'research/market_event_graph_independent_recertification_v2/**'
      - '.github/workflows/market-event-graph-independent-recertification-v2.yml'
  workflow_dispatch:

jobs:
  focused-certification:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy pyarrow scikit-learn pytest

      - name: Run MEG V2 behavioral tests
        run: |
          PYTHONPATH=. pytest -q \
            tests/test_market_event_graph_independent_recertification_v2.py \
            tests/test_market_event_graph_independent_regime_guard_v2.py \
            tests/test_observation_first_pattern_atlas_full_certification_v1.py \
            tests/test_observation_first_pattern_atlas_full_certification_v2.py

      - name: Audit preserved legacy MEG ledgers
        run: |
          rm -rf /tmp/meg_independent_recertification_v2
          PYTHONPATH=. python scripts/run_market_event_graph_independent_recertification_v2.py \
            --ledger-audit-only \
            --output-dir /tmp/meg_independent_recertification_v2
          cat /tmp/meg_independent_recertification_v2/stage0_legacy_execution_audit.json
          cat /tmp/meg_independent_recertification_v2/final_authority.json

      - name: Verify no authorization was created
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/meg_independent_recertification_v2')
          final = json.loads((root / 'final_authority.json').read_text())
          assert final['independent_edge_certified'] is False
          assert final['options_edge_certified'] is False
          assert final['shadow_authorized'] is False
          assert final['order_authorized'] is False
          PY

      - name: Upload focused evidence
        uses: actions/upload-artifact@v4
        with:
          name: market-event-graph-independent-recertification-v2-ledger-audit
          path: /tmp/meg_independent_recertification_v2/
          if-no-files-found: error
          retention-days: 30
