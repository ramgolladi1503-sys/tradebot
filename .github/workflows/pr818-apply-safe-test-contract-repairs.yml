name: PR818 Apply Safe Test Contract Repairs

on:
  push:
    branches:
      - repair/pr818-green-integration-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      DATA_ROOT: ${{ github.workspace }}/.runtime
      KITE_USE_API: "false"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/pr818-green-integration-v1
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install 'pandas<3.0'
      - name: Apply narrow stale-contract repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('tests/test_main_startup_audit.py')
          s = p.read_text()
          needle = '    monkeypatch.setattr(main_module, "validate_kite_startup_credentials", lambda **_kwargs: None)\n'
          replacement = needle + '    monkeypatch.setattr(main_module, "_initialize_audit_chain", lambda **_kwargs: {"ok": True, "status": "OK", "path": "unit-test"})\n'
          if replacement not in s:
              if needle not in s:
                  raise SystemExit('startup audit patch anchor missing')
              s = s.replace(needle, replacement, 1)
              p.write_text(s)

          p = Path('tests/test_feed_runtime_states.py')
          s = p.read_text()
          old = '    assert payload["writer"] == "feed.runtime_store"\n'
          new = '    assert payload["writer"] == "feed_runtime.canonical"\n'
          if new not in s:
              if old not in s:
                  raise SystemExit('feed writer assertion anchor missing')
              s = s.replace(old, new, 1)
              p.write_text(s)

          p = Path('tests/test_phase2_strict_live_data_contract.py')
          s = p.read_text()
          import_anchor = 'import core._engine_phase2_adapter_base as phase2\n'
          import_repl = import_anchor + 'from core.paths import logs_dir\nfrom tests.fixtures.canonical_feed_factory import make_valid_canonical_feed_pair\n'
          if 'make_valid_canonical_feed_pair' not in s:
              if import_anchor not in s:
                  raise SystemExit('phase2 import anchor missing')
              s = s.replace(import_anchor, import_repl, 1)

          helper_anchor = '\n\ndef _base_candidate(**overrides):\n'
          helper_repl = '\n\ndef _install_current_feed():\n    make_valid_canonical_feed_pair(logs_dir(), feed_ok=True)\n\n\ndef _base_candidate(**overrides):\n'
          if 'def _install_current_feed()' not in s:
              if helper_anchor not in s:
                  raise SystemExit('phase2 helper anchor missing')
              s = s.replace(helper_anchor, helper_repl, 1)

          call_anchor = '    ranked = phase2.build_candidates_phase2(\n'
          call_repl = '    _install_current_feed()\n    ranked = phase2.build_candidates_phase2(\n'
          if s.count('_install_current_feed()') == 1:
              expected = s.count(call_anchor)
              if expected != 4:
                  raise SystemExit(f'unexpected Phase2 build call count: {expected}')
              s = s.replace(call_anchor, call_repl)
          elif s.count('_install_current_feed()') != 5:
              raise SystemExit('phase2 fixture call count unexpected')

          old_state = '    assert result["state"] == "WATCHLIST"\n'
          new_state = '    assert result["state"] == "NO_TRADE"\n    assert result["state"] != "ENTER"\n'
          if s.count(old_state) == 2:
              s = s.replace(old_state, new_state)
          elif s.count(new_state) < 2:
              raise SystemExit('Phase2 terminal-state anchors unexpected')
          p.write_text(s)
          PY
      - name: Verify repaired contracts
        run: >-
          pytest -q -o addopts=''
          tests/test_main_startup_audit.py
          tests/test_feed_runtime_states.py
          tests/test_phase2_strict_live_data_contract.py
      - name: Assert no production runtime files changed
        run: |
          git diff --name-only
          python - <<'PY'
          import subprocess
          changed = subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()
          allowed = {
              'tests/test_main_startup_audit.py',
              'tests/test_feed_runtime_states.py',
              'tests/test_phase2_strict_live_data_contract.py',
          }
          unexpected = [p for p in changed if p not in allowed]
          if unexpected:
              raise SystemExit(f'unexpected changed files: {unexpected}')
          PY
      - name: Commit verified repairs
        run: |
          if git diff --quiet; then
            echo "No repair changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_main_startup_audit.py tests/test_feed_runtime_states.py tests/test_phase2_strict_live_data_contract.py
          git commit -m "test: align stale contracts with canonical fail-closed semantics"
          git push origin HEAD:repair/pr818-green-integration-v1
