name: Dynamic Trend Overlay Edge V4

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: dynamic-trend-overlay-edge-v4-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout without broad LFS hydration
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Pull bounded research corpus
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include="research/local_evidence_consolidation_v1/external_local_dirs/tradebot-ml-evidence/constituent-lead-lag-data-v1/proxy_campaign_2024_2025_v2/normalized/constituent_index_5m.parquet,research/local_evidence_consolidation_v1/external_local_dirs/tradebot-ml-evidence/upstox-expired-options-v1/**" --exclude=""

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bounded dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow

      - name: Materialize hash-verified final runner
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          from pathlib import Path

          root = Path("research/dynamic_trend_overlay_edge_v1/v4_payload")
          payload = "".join((root / f"part{i:02d}.txt").read_text(encoding="utf-8").strip() for i in range(7))
          assert len(payload) == 15596, len(payload)
          assert hashlib.sha256(payload.encode()).hexdigest() == "3ba9a6e77a1bcaefe050c4cb998dd857481fa4d214cf72be6a298460e6f9e56e"
          raw = gzip.decompress(base64.b64decode(payload))
          assert hashlib.sha256(raw).hexdigest() == "eea3fd88d813acd14770f74a96ddefd85f8158d3d1dc4d5b251b6e0d787a0317"
          target = Path("/tmp/run_dynamic_trend_overlay_edge_v4.py")
          target.write_bytes(raw)
          print(f"runner_bytes={len(raw)}")
          PY
          python -m py_compile /tmp/run_dynamic_trend_overlay_edge_v4.py

      - name: Run final continuous-state falsification campaign
        shell: bash
        run: |
          set -o pipefail
          mkdir -p runtime/research/dynamic_trend_overlay_edge_v4
          cp /tmp/run_dynamic_trend_overlay_edge_v4.py runtime/research/dynamic_trend_overlay_edge_v4/frozen_runner.py
          sha256sum /tmp/run_dynamic_trend_overlay_edge_v4.py | tee runtime/research/dynamic_trend_overlay_edge_v4/frozen_runner.sha256
          python /tmp/run_dynamic_trend_overlay_edge_v4.py --repo-root . --output-root runtime/research/dynamic_trend_overlay_edge_v4 2>&1 | tee runtime/research/dynamic_trend_overlay_edge_v4/workflow.log

      - name: Print result
        if: always()
        shell: bash
        run: |
          if [ -f runtime/research/dynamic_trend_overlay_edge_v4/RESULT.md ]; then cat runtime/research/dynamic_trend_overlay_edge_v4/RESULT.md; fi
          if [ -f runtime/research/dynamic_trend_overlay_edge_v4/result.json ]; then cat runtime/research/dynamic_trend_overlay_edge_v4/result.json; fi

      - name: Upload research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-trend-overlay-edge-v4
          path: runtime/research/dynamic_trend_overlay_edge_v4
          if-no-files-found: error
