name: Mean Reversion Failure Probe

on:
  push:
    branches:
      - research/postmerge-mean-reversion-rerun-v1
    paths:
      - ".github/workflows/mean_reversion_failure_probe.yml"

permissions:
  actions: read
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    env:
      SOURCE_RUN_ID: "29905088620"
      SOURCE_JOB_ID: "88874497347"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/postmerge-mean-reversion-rerun-v1
          fetch-depth: 1

      - name: Download and extract masked job failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work=/tmp/mean-reversion-failure-probe
          mkdir -p "${work}" docs/research/mean_reversion_postmerge_regeneration
          gh api "/repos/${GITHUB_REPOSITORY}/actions/jobs/${SOURCE_JOB_ID}/logs" > "${work}/job_logs.bin"
          python - <<'PY'
          from __future__ import annotations

          import io
          import re
          import zipfile
          from pathlib import Path

          source = Path('/tmp/mean-reversion-failure-probe/job_logs.bin')
          payload = source.read_bytes()
          if payload.startswith(b'PK'):
              with zipfile.ZipFile(io.BytesIO(payload)) as archive:
                  text = '\n'.join(
                      archive.read(name).decode('utf-8', errors='replace')
                      for name in archive.namelist()
                      if not name.endswith('/')
                  )
          else:
              text = payload.decode('utf-8', errors='replace')

          lines = text.splitlines()
          pattern = re.compile(
              r'(traceback|error|failed|failure|exception|assertion|runtimeerror|valueerror|keyerror|typeerror|subprocess|mismatch|duplicate|invalid|missing|systemexit|rejected|non-fast-forward|push)',
              re.IGNORECASE,
          )
          matching = [line for line in lines if pattern.search(line)]
          selected = matching[-220:] + ['--- LOG TAIL ---'] + lines[-320:]
          cleaned = [re.sub(r'\x1b\[[0-9;]*m', '', line) for line in selected]
          target = Path('docs/research/mean_reversion_postmerge_regeneration/rerun_v2_prep_failure_extract.txt')
          target.write_text('\n'.join(cleaned) + '\n', encoding='utf-8')
          PY

      - name: Commit diagnostic extract
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/mean_reversion_postmerge_regeneration/rerun_v2_prep_failure_extract.txt
          git commit -m "research: publish rerun v2 preparation failure extract"
          git push origin HEAD:research/postmerge-mean-reversion-rerun-v1
