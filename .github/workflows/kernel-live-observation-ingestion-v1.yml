name: Kernel Live Observation Ingestion V1

on:
  pull_request:
    paths:
      - "scripts/research/hypothesis_factory/seal_live_observation_bundle_v1.py"
      - "scripts/research/hypothesis_factory/ingest_live_observation_evidence_v1.py"
      - "tests/research/test_live_observation_kernel_ingestion_v1.py"
      - "docs/agent_reviews/kernel_live_observation_ingestion_v1.md"
      - ".github/workflows/kernel-live-observation-ingestion-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-adversarial:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          lfs: false
      - name: Verify exact checkout
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_HEAD_SHA"
          echo "EXACT_HEAD_SHA=$actual"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused dependency
        run: python -m pip install pytest
      - name: Compile ingestion boundary
        run: |
          python -m py_compile \
            scripts/research/hypothesis_factory/seal_live_observation_bundle_v1.py \
            scripts/research/hypothesis_factory/ingest_live_observation_evidence_v1.py \
            tests/research/test_live_observation_kernel_ingestion_v1.py
      - name: Run focused and adversarial tests
        run: pytest -q -o addopts='' tests/research/test_live_observation_kernel_ingestion_v1.py
      - name: Enforce no authority escalation
        run: |
          python - <<'PY'
          from pathlib import Path
          paths = [
              Path('scripts/research/hypothesis_factory/seal_live_observation_bundle_v1.py'),
              Path('scripts/research/hypothesis_factory/ingest_live_observation_evidence_v1.py'),
          ]
          text = '\n'.join(p.read_text() for p in paths)
          forbidden = ['place_order(', 'modify_order(', 'cancel_order(', 'WebSocketApp(', 'kiteconnect.']
          hits = [token for token in forbidden if token in text]
          assert not hits, hits
          for required in [
              '"broker_write_authority": False',
              '"order_authority": False',
              '"paper_authorized": False',
              '"live_authorized": False',
              '"structural_edge_certified": False',
          ]:
              assert required in text, required
          print('KERNEL_INGESTION_EXECUTION_AUTHORITY=false')
          PY
