name: Prospective Market Evidence V1

on:
  pull_request:
    paths:
      - "core/prospective_market_evidence.py"
      - "tests/test_prospective_market_evidence.py"
      - "docs/research/prospective_market_evidence_pipeline_v1.md"
      - ".github/workflows/prospective-market-evidence-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      TRADEBOT_READ_ONLY: "true"
      EXECUTION_MODE: "SIM"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused dependencies
        run: python -m pip install pytest
      - name: Compile sidecar
        run: python -m py_compile core/prospective_market_evidence.py tests/test_prospective_market_evidence.py
      - name: Focused adversarial tests
        run: pytest -q -o addopts='' tests/test_prospective_market_evidence.py
      - name: Safety firewall scan
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('core/prospective_market_evidence.py').read_text()
          forbidden = ['place_order(', 'modify_order(', 'cancel_order(', 'execution_router', 'TradeBuilder']
          hits = [x for x in forbidden if x in text]
          if hits:
              raise SystemExit(f'PROSPECTIVE_EVIDENCE_FIREWALL_FAIL:{hits}')
          required = ['broker_write_authority', 'order_authority', 'paper_authorized', 'live_authorized']
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit(f'PROSPECTIVE_EVIDENCE_SAFETY_FIELDS_MISSING:{missing}')
          print('PROSPECTIVE_EVIDENCE_FIREWALL_PASS')
          PY
