      - name: Run corrected falsification campaign
        shell: bash
        run: |
          set -o pipefail
          mkdir -p runtime/research/dynamic_trend_overlay_edge_v3
          cp /tmp/run_dynamic_trend_overlay_edge_v3.py runtime/research/dynamic_trend_overlay_edge_v3/frozen_runner.py
