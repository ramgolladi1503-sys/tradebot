name: autonomous-structural-edge-exhaustion-v1

on:
  workflow_dispatch:
  push:
    branches:
      - research/autonomous-structural-edge-exhaustion-v1
    paths:
      - 'research/autonomous_structural_edge_exhaustion_v1/**'
      - 'scripts/run_autonomous_structural_edge_exhaustion_v*.py'
      - 'tests/test_autonomous_structural_edge_exhaustion_v*.py'
      - '.github/workflows/autonomous-structural-edge-exhaustion-v1.yml'
  pull_request:
    paths:
      - 'research/autonomous_structural_edge_exhaustion_v1/**'
      - 'scripts/run_autonomous_structural_edge_exhaustion_v*.py'
      - 'tests/test_autonomous_structural_edge_exhaustion_v*.py'
      - '.github/workflows/autonomous-structural-edge-exhaustion-v1.yml'

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  exhaust-predeclared-families:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout without broad LFS hydration
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Hydrate only pinned constituent-index evidence
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull \
            --include="research/local_evidence_consolidation_v1/**/constituent_index_5m.parquet" \
            --exclude=""

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          cache: pip

      - name: Install pinned research dependencies
        run: |
          python -m pip install --upgrade "pip==26.2.1"
          python -m pip install \
            "numpy==2.5.1" \
            "pandas==3.0.5" \
            "scipy==1.18.0" \
            "pyarrow==25.0.0" \
            "scikit-learn==1.9.0" \
            "pytest==9.1.1"

      - name: Run causality and sealed-tail tests
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_autonomous_structural_edge_exhaustion_v1.py \
            tests/test_autonomous_structural_edge_exhaustion_v2.py \
            tests/test_autonomous_structural_edge_exhaustion_v3.py \
            tests/test_autonomous_structural_edge_exhaustion_v4.py \
            tests/test_observation_first_pattern_atlas_full_certification_v1.py \
            tests/test_observation_first_pattern_atlas_full_certification_v2.py

      - name: Execute four-batch autonomous discovery and certification
        run: |
          rm -rf runtime/research/autonomous_structural_edge_exhaustion_v4
          PYTHONPATH=. python scripts/run_autonomous_structural_edge_exhaustion_v4.py \
            --source-file research/local_evidence_consolidation_v1/external_local_dirs/tradebot-ml-evidence/constituent-lead-lag-data-v1/proxy_campaign_2024_2025_v2/normalized/constituent_index_5m.parquet \
            --output-root runtime/research/autonomous_structural_edge_exhaustion_v4

      - name: Verify four-batch exhaustion and authority boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('runtime/research/autonomous_structural_edge_exhaustion_v4')
          final = json.loads((root / 'final_authority.json').read_text())
          discovery = json.loads((root / 'stage3_discovery.json').read_text())
          final_test = json.loads((root / 'stage9_final_unopened.json').read_text())
          exhaustion = json.loads((root / 'stage11_exhaustion_ledger.json').read_text())
          robustness = json.loads((root / 'stage8_robustness.json').read_text())
          screen = json.loads((root / 'stage6_structural_screen.json').read_text())

          assert final['options_edge_certified'] is False
          assert final['shadow_authorized'] is False
          assert final['paper_authorized'] is False
          assert final['live_authorized'] is False
          assert final['order_authorized'] is False
          assert final['pre_post_cas_pooled'] is False
          assert final['failed_family_reopening_authorized'] is False
          assert final['campaign_batch_count'] == 4
          assert final['campaign_family_count'] == 24
          assert final['campaign_global_q_threshold'] == 0.0125
          assert final['same_source_further_transform_search_authorized_if_no_survivor'] is False
          assert discovery['policy']['outcomes_seen_when_frozen'] is False
          assert discovery['policy']['unopened_sessions_scored'] is False
          assert discovery['family_count'] == 24
          assert discovery['batch_d_selection_basis'] == 'remaining_close_volume_constituent_information_primitives_absent_from_batches_A_B_C'
          assert exhaustion['all_predeclared_families_attempted'] is True
          assert exhaustion['failed_families_reopened'] is False
          assert exhaustion['family_count'] == 24
          assert exhaustion['batch_count'] == 4
          assert exhaustion['next_expansion_if_no_survivor'] == 'MOVE_TO_DIFFERENT_INFORMATION_SOURCE_NOT_MORE_TRANSFORMS_OF_SAME_CLOSE_VOLUME_CORPUS'
          assert screen['campaign_global_q_threshold'] == 0.0125
          if not robustness.get('survivor_hypothesis_ids'):
              assert final_test['unopened_sessions_scored'] is False
          print(json.dumps(final, indent=2, sort_keys=True))
          print(json.dumps(exhaustion, indent=2, sort_keys=True))
          PY

      - name: Upload complete four-batch discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-structural-edge-exhaustion-v4
          path: runtime/research/autonomous_structural_edge_exhaustion_v4/
          if-no-files-found: error
          retention-days: 30
