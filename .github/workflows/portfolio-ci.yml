name: Portfolio CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  portfolio-quality-gate:
    name: Documentation, architecture, runtime health, contract guard, stale feed, and portfolio quality gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required portfolio files
        run: |
          set -euo pipefail
          test -f README.md
          test -f docs/architecture/tradebot-architecture.svg
          test -f docs/one-pagers/fintech-qa-trading-systems.md
          test -f docs/test-reports/README.md
          test -f core/runtime_health_eval.py
          test -f core/contract_resolution_guard.py
          test -f core/stale_feed_simulator.py
          test -f tests/test_runtime_health_eval.py
          test -f tests/test_contract_resolution_guard.py
          test -f tests/test_stale_feed_simulator.py

      - name: Check README sections
        run: |
          set -euo pipefail
          grep -qi "Problem statement" README.md
          grep -qi "Architecture" README.md
          grep -qi "Test strategy" README.md
          grep -qi "Failure modes" README.md
          grep -qi "Roadmap" README.md

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install safe test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run real offline runtime health, contract-resolution, and stale-feed tests
        run: pytest -q tests/test_runtime_health_eval.py tests/test_contract_resolution_guard.py tests/test_stale_feed_simulator.py

      - name: Generate portfolio test report
        run: |
          mkdir -p reports
          cat > reports/portfolio-ci-report.md <<'REPORT'
          # Portfolio CI Report — Tradebot

          ## Scope

          This CI gate validates the repository as a recruiter-facing fintech QA/SDET portfolio and runs safe offline runtime-health, contract-resolution, and stale-feed tests.

          ## Checks

          - README exists.
          - Architecture SVG exists.
          - Fintech QA one-pager exists.
          - Test reports guide exists.
          - README includes problem statement, architecture, test strategy, failure modes, and roadmap.
          - Runtime health evaluator source exists.
          - Runtime health unit tests run for valid snapshots, stale feed, low contract coverage, memory-only source, feed disconnection, DB failure, and missing contract fields.
          - Contract-resolution guard tests run for unresolved contracts, missing tokens, exact matches, safe fallbacks, expiry-distance violations, strike-distance violations, and unknown resolution paths.
          - Stale-feed simulator tests run for fresh ticks, stale ticks, future ticks, missing LTP, and mixed-symbol feed blocking.

          ## Current honest limitation

          This workflow intentionally avoids full broker/runtime tests. It tests pure offline readiness, contract safety, and feed-freshness logic first, without Kite secrets, market sessions, TensorFlow, or Streamlit startup risk.
          REPORT

      - name: Upload portfolio report
        uses: actions/upload-artifact@v4
        with:
          name: tradebot-portfolio-ci-report
          path: reports/portfolio-ci-report.md
