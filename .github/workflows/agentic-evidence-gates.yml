name: Agentic Evidence Gates

on:
  workflow_dispatch:
  push:
    branches:
      - feature/agentic-gemini-edge-evidence
    paths:
      - "agentic_research/**"
      - ".github/workflows/agentic-evidence-gates.yml"

permissions:
  contents: read

jobs:
  sidecar-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install sidecar dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r agentic_research/requirements.txt
      - name: Run isolated sidecar tests
        run: PYTHONPATH=. pytest -q agentic_research/tests
      - name: Compile sidecar
        run: python -m compileall -q agentic_research
      - name: Run deterministic regression oracle
        run: |
          python -m agentic_research.evals \
            --planner deterministic \
            --output agentic_research/eval_results/deterministic_ci.json
      - uses: actions/upload-artifact@v4
        with:
          name: agentic-sidecar-regression
          path: agentic_research/eval_results/deterministic_ci.json

  historical-edge-campaign:
    needs: sidecar-regression
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install sidecar dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r agentic_research/requirements.txt
      - name: Fetch pinned Aeron7 NIFTY futures data only
        shell: bash
        run: |
          set -euo pipefail
          DATA_ROOT="$RUNNER_TEMP/aeron7"
          mkdir -p "$DATA_ROOT"
          cd "$DATA_ROOT"
          git init -q
          git remote add origin https://github.com/aeron7/nifty-banknifty-intraday-data.git
          git config core.sparseCheckout true
          cat > .git/info/sparse-checkout <<'EOF'
          /2012/**/NIFTY_F1.txt
          /2013/**/NIFTY_F1.txt
          /2014/**/NIFTY_F1.txt
          EOF
          git fetch -q --depth 1 --filter=blob:none origin 906fc2378b82e50de78f62844a3ecb3f9306a85d
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "906fc2378b82e50de78f62844a3ecb3f9306a85d"
          find . -name NIFTY_F1.txt -type f | wc -l
      - name: Convert pinned source to canonical OHLCV
        run: |
          python scripts/convert_aeron7_intraday.py \
            --source-root "$RUNNER_TEMP/aeron7" \
            --output-dir "$RUNNER_TEMP/aeron7-canonical" \
            --symbols NIFTY_F1
          test -s "$RUNNER_TEMP/aeron7-canonical/NIFTY_F1_intraday.csv"
      - name: Run causal TREND_PULLBACK historical campaign
        run: |
          python -m agentic_research.historical \
            --input "$RUNNER_TEMP/aeron7-canonical/NIFTY_F1_intraday.csv" \
            --output-dir agentic_research/edge_results/aeron7_trend_pullback \
            --source-repository aeron7/nifty-banknifty-intraday-data \
            --source-commit 906fc2378b82e50de78f62844a3ecb3f9306a85d \
            --minimum-sessions 300
      - name: Publish campaign verdict to summary
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path("agentic_research/edge_results/aeron7_trend_pullback/campaign_result.json").read_text())
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("## TREND_PULLBACK historical campaign\n\n")
              handle.write(f"- Verdict: `{result['verdict']}`\n")
              handle.write(f"- Claim scope: `{result['claim_scope']}`\n")
              handle.write(f"- Options execution certified: `{result['options_execution_certified']}`\n")
              for blocker in result.get("blockers", []):
                  handle.write(f"- Blocker: `{blocker}`\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: trend-pullback-aeron7-campaign
          path: agentic_research/edge_results/aeron7_trend_pullback

  gemini-online-evaluation:
    needs: sidecar-regression
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Detect secure Gemini secret
        id: key
        shell: bash
        run: |
          if [ -n "${GEMINI_API_KEY:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install sidecar dependencies
        if: steps.key.outputs.available == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r agentic_research/requirements.txt
      - name: Run measured Gemini manager and critic suite
        if: steps.key.outputs.available == 'true'
        run: |
          python -m agentic_research.evals.online_cli \
            --model gemini-2.5-flash \
            --repeats 2 \
            --output agentic_research/eval_results/gemini_online_ci.json
      - name: Explain skipped Gemini gate
        if: steps.key.outputs.available != 'true'
        run: |
          echo "Gemini evaluation skipped: add a rotated key as the repository secret GEMINI_API_KEY." | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.available == 'true'
        with:
          name: gemini-agent-quality-report
          path: agentic_research/eval_results/gemini_online_ci.json
