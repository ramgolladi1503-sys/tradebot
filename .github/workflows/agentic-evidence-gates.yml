name: Agentic Evidence Gates

on:
  workflow_dispatch:
  push:
    branches: [feature/agentic-gemini-edge-evidence]
    paths:
      - "agentic_research/**"
      - ".github/workflows/agentic-evidence-gates.yml"

permissions:
  contents: read

jobs:
  sidecar-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r agentic_research/requirements.txt
      - run: PYTHONPATH=. pytest -q agentic_research/tests
      - run: python -m compileall -q agentic_research
      - run: |
          python -m agentic_research.evals \
            --planner deterministic \
            --output agentic_research/eval_results/deterministic_ci.json
      - uses: actions/upload-artifact@v4
        with:
          name: agentic-sidecar-regression
          path: agentic_research/eval_results/deterministic_ci.json

  historical-edge-campaign:
    needs: sidecar-regression
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      evidence_status: ${{ steps.status.outputs.status }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r agentic_research/requirements.txt

      - name: Fetch pinned Aeron7 NIFTY futures data
        id: fetch
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/aeron7"
          mkdir -p "$ROOT"
          cd "$ROOT"
          git init -q
          git remote add origin https://github.com/aeron7/nifty-banknifty-intraday-data.git
          git config core.sparseCheckout true
          cat > .git/info/sparse-checkout <<'EOF'
          /2012/**/NIFTY_F1.txt
          /2013/**/NIFTY_F1.txt
          /2014/**/NIFTY_F1.txt
          EOF
          git fetch -q --depth 1 --filter=blob:none origin 906fc2378b82e50de78f62844a3ecb3f9306a85d
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "906fc2378b82e50de78f62844a3ecb3f9306a85d"
          COUNT="$(find . -name NIFTY_F1.txt -type f | wc -l | tr -d ' ')"
          echo "file_count=$COUNT" >> "$GITHUB_OUTPUT"
          test "$COUNT" -ge 1

      - name: Convert source to canonical OHLCV
        id: convert
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        run: |
          python scripts/convert_aeron7_intraday.py \
            --source-root "$RUNNER_TEMP/aeron7" \
            --output-dir "$RUNNER_TEMP/aeron7-canonical" \
            --symbols NIFTY_F1
          test -s "$RUNNER_TEMP/aeron7-canonical/NIFTY_F1_intraday.csv"

      - name: Run causal TREND_PULLBACK campaign
        id: campaign
        if: steps.convert.outcome == 'success'
        continue-on-error: true
        run: |
          python -m agentic_research.historical \
            --input "$RUNNER_TEMP/aeron7-canonical/NIFTY_F1_intraday.csv" \
            --output-dir agentic_research/edge_results/aeron7_trend_pullback \
            --source-repository aeron7/nifty-banknifty-intraday-data \
            --source-commit 906fc2378b82e50de78f62844a3ecb3f9306a85d \
            --minimum-sessions 300

      - name: Preserve historical status
        id: status
        if: always()
        env:
          FETCH_OUTCOME: ${{ steps.fetch.outcome }}
          CONVERT_OUTCOME: ${{ steps.convert.outcome }}
          CAMPAIGN_OUTCOME: ${{ steps.campaign.outcome }}
          FILE_COUNT: ${{ steps.fetch.outputs.file_count }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          out = Path("agentic_research/edge_results/aeron7_trend_pullback")
          out.mkdir(parents=True, exist_ok=True)
          status = {
              "schema_version": 1,
              "fetch_outcome": os.environ.get("FETCH_OUTCOME") or "not_run",
              "convert_outcome": os.environ.get("CONVERT_OUTCOME") or "not_run",
              "campaign_outcome": os.environ.get("CAMPAIGN_OUTCOME") or "not_run",
              "source_file_count": int(os.environ.get("FILE_COUNT") or 0),
          }
          status["evidence_status"] = "success" if status["campaign_outcome"] == "success" else "failure"
          (out / "historical_job_status.json").write_text(json.dumps(status, indent=2, sort_keys=True) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write(f"status={status['evidence_status']}\n")
          PY

      - name: Publish historical summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          out = Path("agentic_research/edge_results/aeron7_trend_pullback")
          status = json.loads((out / "historical_job_status.json").read_text())
          result_path = out / "campaign_result.json"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as handle:
              handle.write("## TREND_PULLBACK historical campaign\n\n")
              for key, value in status.items():
                  handle.write(f"- {key}: `{value}`\n")
              if result_path.exists():
                  result = json.loads(result_path.read_text())
                  handle.write(f"- verdict: `{result['verdict']}`\n")
                  handle.write(f"- claim_scope: `{result['claim_scope']}`\n")
                  for blocker in result.get("blockers", []):
                      handle.write(f"- blocker: `{blocker}`\n")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trend-pullback-aeron7-campaign
          path: agentic_research/edge_results/aeron7_trend_pullback
          if-no-files-found: error

  gemini-online-evaluation:
    needs: sidecar-regression
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      measured: ${{ steps.key.outputs.available }}
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - id: key
        shell: bash
        run: |
          if [ -n "${GEMINI_API_KEY:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.key.outputs.available == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r agentic_research/requirements.txt
      - if: steps.key.outputs.available == 'true'
        run: |
          python -m agentic_research.evals.online_cli \
            --model gemini-2.5-flash \
            --repeats 2 \
            --request-delay-seconds 4 \
            --maximum-retries 2 \
            --output agentic_research/eval_results/gemini_online_ci.json
      - if: steps.key.outputs.available != 'true'
        run: echo "Gemini evaluation skipped until a rotated GEMINI_API_KEY repository secret is added." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always() && steps.key.outputs.available == 'true'
        with:
          name: gemini-agent-quality-report
          path: agentic_research/eval_results/gemini_online_ci.json
          if-no-files-found: warn

  publish-evidence:
    if: always()
    needs: [sidecar-regression, historical-edge-campaign, gemini-online-evaluation]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/agentic-gemini-edge-evidence
          fetch-depth: 0
      - if: needs.sidecar-regression.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: agentic-sidecar-regression
          path: /tmp/evidence/deterministic
      - if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: trend-pullback-aeron7-campaign
          path: /tmp/evidence/historical
      - if: needs.gemini-online-evaluation.outputs.measured == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: gemini-agent-quality-report
          path: /tmp/evidence/gemini
      - name: Build evidence snapshot
        env:
          SIDECAR_RESULT: ${{ needs.sidecar-regression.result }}
          HISTORICAL_JOB_RESULT: ${{ needs.historical-edge-campaign.result }}
          HISTORICAL_STATUS: ${{ needs.historical-edge-campaign.outputs.evidence_status }}
          GEMINI_JOB_RESULT: ${{ needs.gemini-online-evaluation.result }}
          GEMINI_MEASURED: ${{ needs.gemini-online-evaluation.outputs.measured }}
        run: |
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          target = Path("agentic_research/evidence_results")
          target.mkdir(parents=True, exist_ok=True)
          status = {
              "schema_version": 2,
              "source_commit": os.environ["GITHUB_SHA"],
              "sidecar_regression": os.environ["SIDECAR_RESULT"],
              "historical_job": os.environ["HISTORICAL_JOB_RESULT"],
              "historical_campaign": os.environ.get("HISTORICAL_STATUS") or "unknown",
              "gemini_job": os.environ["GEMINI_JOB_RESULT"],
              "gemini_measured": os.environ.get("GEMINI_MEASURED") == "true",
              "secret_persisted": False,
          }
          def copy_named(root, names):
              base = Path(root)
              if not base.exists():
                  return
              for path in base.rglob("*"):
                  if path.is_file() and path.name in names:
                      shutil.copy2(path, target / path.name)
          copy_named("/tmp/evidence/deterministic", {"deterministic_ci.json"})
          copy_named("/tmp/evidence/historical", {"campaign_result.json", "dataset_manifest.json", "campaign_report.md", "historical_job_status.json"})
          copy_named("/tmp/evidence/gemini", {"gemini_online_ci.json"})
          (target / "run_status.json").write_text(json.dumps(status, indent=2, sort_keys=True) + "\n")
          PY
      - name: Commit measured summaries
        run: |
          git config user.name "tradebot-evidence-bot"
          git config user.email "actions@users.noreply.github.com"
          find agentic_research/evidence_results -type f -print0 | xargs -0 git add -f --
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "evidence(agentic): publish measured gates [skip ci]"
          git push origin HEAD:feature/agentic-gemini-edge-evidence
