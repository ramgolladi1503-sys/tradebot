name: Causal Market State V1

on:
  push:
    branches:
      - research/causal-market-state-representation-v1
  pull_request:
    branches:
      - main
    paths:
      - 'core/market_state/**'
      - 'core/causal_market_state/**'
      - 'scripts/*causal_market_state*'
      - 'tests/market_state/**'
      - '.github/workflows/causal-market-state-v1.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout feature implementation
        uses: actions/checkout@v4
        with:
          ref: research/causal-market-state-representation-v1
          path: feature

      - name: Checkout consolidated evidence from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: evidence
          lfs: true
          sparse-checkout: |
            research/local_evidence_consolidation_v1/external_local_dirs/tradebot-data/independent_underlying_confirmation_v3/sessions
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install research dependencies
        run: python -m pip install --upgrade pip pandas numpy pyarrow pytest

      - name: Run causal behavioural and prefix-invariance tests
        working-directory: feature
        env:
          PYTHONPATH: .
        run: pytest -q tests/market_state/test_representation.py

      - name: Execute chronological NIFTY state validation
        working-directory: feature
        env:
          PYTHONPATH: .
        run: |
          python scripts/validate_causal_market_state_representation_v1.py \
            --evidence-root ../evidence/research/local_evidence_consolidation_v1/external_local_dirs/tradebot-data/independent_underlying_confirmation_v3 \
            --output-dir runtime/research/causal_market_state_v1

      - name: Upload empirical evidence
        uses: actions/upload-artifact@v4
        with:
          name: causal-market-state-v1-evidence
          path: feature/runtime/research/causal_market_state_v1
          if-no-files-found: error
