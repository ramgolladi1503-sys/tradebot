name: Causal Market State V1

on:
  push:
    branches:
      - research/causal-market-state-representation-v1
  pull_request:
    branches:
      - main
    paths:
      - 'core/market_state/**'
      - 'core/causal_market_state/**'
      - 'scripts/*causal_market_state*'
      - 'scripts/derive_downside_impulse_strategy_v1.py'
      - 'scripts/run_multievent_directional_discovery_v1.py'
      - 'scripts/run_explicit_event_sequence_discovery_v2.py'
      - 'tests/market_state/**'
      - '.github/workflows/causal-market-state-v1.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout feature implementation
        uses: actions/checkout@v4
        with:
          ref: research/causal-market-state-representation-v1
          path: feature

      - name: Checkout consolidated evidence from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: evidence
          lfs: true
          sparse-checkout: |
            research/local_evidence_consolidation_v1/external_local_dirs/tradebot-data/independent_underlying_confirmation_v3
            research/local_evidence_consolidation_v1/external_local_dirs/tradebot-ml-evidence/constituent-lead-lag-data-v1
            research/local_evidence_consolidation_v1/external_local_dirs/tradebot-ml-evidence/all-strategy-option-pf-v1
            research/local_evidence_consolidation_v1/external_local_dirs/tradebot-ml-evidence/kite-underlying-directional-edge-campaign-v1
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install research dependencies
        run: python -m pip install --upgrade pip pandas numpy pyarrow pytest

      - name: Run causal behavioural and prefix-invariance tests
        working-directory: feature
        env:
          PYTHONPATH: .
        run: pytest -q tests/market_state/test_representation.py

      - name: Execute chronological NIFTY state validation
        working-directory: feature
        env:
          PYTHONPATH: .
        run: |
          python scripts/validate_causal_market_state_representation_v1.py \
            --evidence-root ../evidence/research/local_evidence_consolidation_v1/external_local_dirs/tradebot-data/independent_underlying_confirmation_v3 \
            --output-dir runtime/research/causal_market_state_v1

      - name: Derive continuation and reversal strategy candidates
        working-directory: feature
        env:
          PYTHONPATH: .
        run: |
          python scripts/derive_downside_impulse_strategy_v1.py \
            --dataset runtime/research/causal_market_state_v1/market_state_dataset_with_labels.parquet \
            --output-dir runtime/research/downside_impulse_strategy_v1

      - name: Run non-candle multi-event discovery
        working-directory: feature
        env:
          PYTHONPATH: .
        run: |
          python scripts/run_multievent_directional_discovery_v1.py \
            --evidence-root ../evidence/research/local_evidence_consolidation_v1/external_local_dirs \
            --output-dir runtime/research/multievent_directional_discovery_v1

      - name: Run explicit event sequence discovery v2
        working-directory: feature
        env:
          PYTHONPATH: .
        run: |
          python scripts/run_explicit_event_sequence_discovery_v2.py \
            --evidence-root ../evidence/research/local_evidence_consolidation_v1/external_local_dirs \
            --output-dir runtime/research/explicit_event_sequence_discovery_v2

      - name: Upload empirical evidence
        uses: actions/upload-artifact@v4
        with:
          name: causal-market-state-v1-evidence
          path: |
            feature/runtime/research/causal_market_state_v1
            feature/runtime/research/downside_impulse_strategy_v1
            feature/runtime/research/multievent_directional_discovery_v1
            feature/runtime/research/explicit_event_sequence_discovery_v2
          if-no-files-found: error
