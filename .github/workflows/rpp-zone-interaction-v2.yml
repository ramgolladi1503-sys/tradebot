name: RPP Zone Interaction V2

on:
  workflow_dispatch:
  push:
    branches:
      - research/reversal-probability-profile-v1-20260906
    paths:
      - "research/reversal_probability_profile_v2/**"
      - "scripts/run_reversal_probability_profile_v2.py"
      - "tests/test_reversal_probability_profile_v2*.py"
      - ".github/workflows/rpp-zone-interaction-v2.yml"
  pull_request:
    branches:
      - main
    paths:
      - "research/reversal_probability_profile_v2/**"
      - "scripts/run_reversal_probability_profile_v2.py"
      - "tests/test_reversal_probability_profile_v2*.py"
      - ".github/workflows/rpp-zone-interaction-v2.yml"

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  execute-rpp-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout without broad LFS hydration
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Pull only governed NIFTY constituent/index corpus
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull \
            --include="research/local_evidence_consolidation_v1/external_local_dirs/tradebot-ml-evidence/constituent-lead-lag-data-v1/proxy_campaign_2024_2025_v2/normalized/constituent_index_5m.parquet" \
            --exclude=""
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path("research/local_evidence_consolidation_v1/external_local_dirs/tradebot-ml-evidence/constituent-lead-lag-data-v1/proxy_campaign_2024_2025_v2/normalized/constituent_index_5m.parquet")
          if not p.exists():
              raise SystemExit("RPP_DATA_MISSING")
          with p.open("rb") as fh:
              if fh.read(4) != b"PAR1":
                  raise SystemExit("RPP_DATA_NOT_MATERIALIZED_PARQUET")
          h = hashlib.sha256()
          with p.open("rb") as fh:
              for chunk in iter(lambda: fh.read(1024 * 1024), b""):
                  h.update(chunk)
          actual = h.hexdigest()
          expected = "ae9645a83cb555899145e04ebe5a961fd130df25cba88a8fc8fd43b986bbfad0"
          print("RPP_INPUT_SHA256=", actual)
          if actual != expected:
              raise SystemExit(f"RPP_DATA_SHA_MISMATCH:{actual}")
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
          cache: pip

      - name: Install pinned research dependencies
        run: |
          python -m pip install --upgrade "pip==26.2.1"
          python -m pip install \
            "numpy==2.5.1" \
            "pandas==3.0.5" \
            "pyarrow==25.0.0" \
            "pytest==9.1.1"

      - name: Run focused semantic and governance tests
        run: |
          python -m pytest -q \
            tests/test_reversal_probability_profile_v2.py \
            tests/test_reversal_probability_profile_v2_governance.py

      - name: Execute frozen physical RPP V2 experiment
        run: |
          python scripts/run_reversal_probability_profile_v2.py \
            --input research/local_evidence_consolidation_v1/external_local_dirs/tradebot-ml-evidence/constituent-lead-lag-data-v1/proxy_campaign_2024_2025_v2/normalized/constituent_index_5m.parquet \
            --output-dir runtime/research/reversal_probability_profile_v2 \
            --cost-bps 5

      - name: Assert truth-boundary fields exist
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("runtime/research/reversal_probability_profile_v2/report.json")
          d = json.loads(p.read_text())
          required = {
              "relative_density_is_calibrated_probability": False,
              "same_bar_zone_reselection_allowed": False,
              "first_break_is_trade_confirmation": False,
              "one_forecast_confirmation_per_break": True,
              "governed_special_session_policy_applied": True,
              "holdout_evaluated": False,
              "option_pnl_claimed": False,
              "live_or_broker_authority": False,
              "sealed_tail_feature_rows_processed": 0,
              "sealed_tail_outcomes_processed": 0,
          }
          for k, v in required.items():
              if d.get(k) != v:
                  raise SystemExit(f"TRUTH_BOUNDARY_FAIL:{k}:{d.get(k)!r}")
          expected_special = {"2024-01-20", "2024-03-02", "2024-05-18", "2024-11-01", "2025-02-01"}
          declared = set(d.get("governed_special_session_set", []))
          if declared != expected_special:
              raise SystemExit(f"SESSION_POLICY_SET_MISMATCH:{sorted(declared)}")
          print("RPP_V2_TRUTH_BOUNDARY=PASS")
          print("RPP_V2_VERDICT=", d.get("verdict"))
          print("RPP_V2_BLOCKERS=", d.get("blockers"))
          print("RPP_V2_SPECIAL_SESSIONS_EXCLUDED=", d.get("special_sessions_excluded"))
          PY

      - name: Upload physical research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpp-zone-interaction-v2-physical
          path: runtime/research/reversal_probability_profile_v2/
          if-no-files-found: warn
