name: Cross-Strike Structural Campaign

on:
  workflow_dispatch:
  push:
    branches:
      - research/cross-strike-diffusion-discovery-v1
    paths:
      - 'scripts/run_cross_strike_diffusion_discovery_v1.py'
      - 'scripts/run_cross_strike_diffusion_campaign_v2.py'
      - 'scripts/run_selective_option_leadership_campaign_v3.py'
      - 'scripts/run_post_imbalance_digestion_campaign_v4.py'
      - 'scripts/run_peer_reclaim_horizon_campaign_v5.py'
      - 'scripts/run_peer_reclaim_horizon_campaign_v5_1.py'
      - 'tests/research/test_cross_strike_diffusion_discovery_v1.py'
      - 'tests/research/test_cross_strike_diffusion_campaign_v2.py'
      - 'tests/research/test_selective_option_leadership_campaign_v3.py'
      - 'tests/research/test_post_imbalance_digestion_campaign_v4.py'
      - 'tests/research/test_peer_reclaim_horizon_campaign_v5.py'
      - '.github/workflows/cross-strike-diffusion-discovery-v1.yml'
  pull_request:
    paths:
      - 'scripts/run_cross_strike_diffusion_discovery_v1.py'
      - 'scripts/run_cross_strike_diffusion_campaign_v2.py'
      - 'scripts/run_selective_option_leadership_campaign_v3.py'
      - 'scripts/run_post_imbalance_digestion_campaign_v4.py'
      - 'scripts/run_peer_reclaim_horizon_campaign_v5.py'
      - 'scripts/run_peer_reclaim_horizon_campaign_v5_1.py'
      - 'tests/research/test_cross_strike_diffusion_discovery_v1.py'
      - 'tests/research/test_cross_strike_diffusion_campaign_v2.py'
      - 'tests/research/test_selective_option_leadership_campaign_v3.py'
      - 'tests/research/test_post_imbalance_digestion_campaign_v4.py'
      - 'tests/research/test_peer_reclaim_horizon_campaign_v5.py'
      - '.github/workflows/cross-strike-diffusion-discovery-v1.yml'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout repository pointers
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Materialize required preserved event universe
        run: |
          git lfs install
          git lfs pull \
            --include='research/local_evidence_consolidation_v1/worktrees/reverse-causal-option-expansion-v1/runtime_research/reverse_causal_option_expansion_v1/event_universe_5m.parquet' \
            --exclude=''
          target='research/local_evidence_consolidation_v1/worktrees/reverse-causal-option-expansion-v1/runtime_research/reverse_causal_option_expansion_v1/event_universe_5m.parquet'
          test -f "$target"
          if head -c 80 "$target" | grep -q 'version https://git-lfs.github.com/spec'; then
            echo 'Unresolved Git LFS pointer.' >&2
            exit 1
          fi
          test "$(stat -c%s "$target")" -gt 90000000
          sha256sum "$target"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy pyarrow pytest

      - name: Run focused tests
        run: |
          python -m pytest -q \
            tests/research/test_cross_strike_diffusion_discovery_v1.py \
            tests/research/test_cross_strike_diffusion_campaign_v2.py \
            tests/research/test_selective_option_leadership_campaign_v3.py \
            tests/research/test_post_imbalance_digestion_campaign_v4.py \
            tests/research/test_peer_reclaim_horizon_campaign_v5.py

      - name: Run laggard-catchup WFA and validation iteration
        run: |
          python -m scripts.run_cross_strike_diffusion_campaign_v2 --repo-root "$GITHUB_WORKSPACE"

      - name: Run reverse selective-leadership WFA and validation iteration
        run: |
          python -m scripts.run_selective_option_leadership_campaign_v3 --repo-root "$GITHUB_WORKSPACE"

      - name: Run post-imbalance digestion WFA and validation iteration
        run: |
          python -m scripts.run_post_imbalance_digestion_campaign_v4 --repo-root "$GITHUB_WORKSPACE"

      - name: Run longer peer-reclaim horizon WFA and validation iteration
        run: |
          python -m scripts.run_peer_reclaim_horizon_campaign_v5_1 --repo-root "$GITHUB_WORKSPACE"

      - name: Verify sealed master holdout and safety boundaries
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          paths = [
              Path('runtime/research/cross_strike_diffusion_campaign_v2/final_decision.json'),
              Path('runtime/research/selective_option_leadership_campaign_v3/final_decision.json'),
              Path('runtime/research/post_imbalance_digestion_campaign_v4/final_decision.json'),
              Path('runtime/research/peer_reclaim_horizon_campaign_v5/final_decision.json'),
          ]
          for path in paths:
              if not path.exists():
                  raise SystemExit(f'Final decision missing: {path}')
              payload = json.loads(path.read_text(encoding='utf-8'))
              if payload.get('master_holdout_outcomes_materialized') is not False:
                  raise SystemExit(f'Master holdout opened by discovery runner: {path}')
              if payload.get('master_holdout_status') != 'SEALED_FOR_CROSS_FAMILY_FINAL_CERTIFICATION':
                  raise SystemExit(f'Master holdout status is not sealed: {path}')
              if payload.get('research_only') is not True:
                  raise SystemExit(f'Research-only flag missing: {path}')
              if payload.get('paper_or_live_authorized') is not False:
                  raise SystemExit(f'Paper/live authorization detected: {path}')
              if payload.get('allowed_for_live_execution') is not False:
                  raise SystemExit(f'Live execution flag detected: {path}')
              print(payload['principal_verdict'])
          PY

      - name: Upload complete research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-strike-structural-campaign
          path: |
            runtime/research/cross_strike_diffusion_campaign_v2/**
            research/cross_strike_diffusion_campaign_v2/**
            runtime/research/selective_option_leadership_campaign_v3/**
            research/selective_option_leadership_campaign_v3/**
            runtime/research/post_imbalance_digestion_campaign_v4/**
            research/post_imbalance_digestion_campaign_v4/**
            runtime/research/peer_reclaim_horizon_campaign_v5/**
            research/peer_reclaim_horizon_campaign_v5/**
          if-no-files-found: error
          retention-days: 30
