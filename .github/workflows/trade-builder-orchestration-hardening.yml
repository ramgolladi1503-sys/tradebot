name: TradeBuilder Orchestration Hardening

on:
  pull_request:
    paths:
      - "core/execution_decision_contract.py"
      - "core/runtime_authority_audit.py"
      - "core/architecture_golden_master.py"
      - "core/helper_parity_proof.py"
      - "core/execution_shadow_cycle.py"
      - "core/execution_ranking_authority.py"
      - "core/trade_builder_stage_pipeline.py"
      - "core/orchestrator_stage_pipeline.py"
      - "scripts/run_architecture_hardening_campaign.py"
      - "scripts/audit_kite_candidate_replay_corpus.py"
      - "scripts/audit_upstox_option_tick_replay.py"
      - "scripts/evaluate_tradebuilder_orchestrator_offline_certification.py"
      - "tests/test_execution_decision_contract.py"
      - "tests/test_runtime_authority_audit.py"
      - "tests/test_architecture_hardening_proofs.py"
      - "tests/test_architecture_hardening_campaign.py"
      - "tests/test_kite_candidate_replay_corpus_audit.py"
      - "tests/test_upstox_option_tick_replay_audit.py"
      - "tests/test_tradebuilder_orchestrator_offline_certification.py"
      - "docs/architecture/trade_builder_orchestration_hardening_v1.md"
      - ".github/workflows/trade-builder-orchestration-hardening.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-hardening-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused test dependencies
        run: python -m pip install --upgrade pip pytest pandas pyarrow
      - name: Compile hardening modules
        run: |
          python -m py_compile \
            core/execution_decision_contract.py \
            core/runtime_authority_audit.py \
            core/architecture_golden_master.py \
            core/helper_parity_proof.py \
            core/execution_shadow_cycle.py \
            core/execution_ranking_authority.py \
            core/trade_builder_stage_pipeline.py \
            core/orchestrator_stage_pipeline.py \
            scripts/run_architecture_hardening_campaign.py \
            scripts/audit_kite_candidate_replay_corpus.py \
            scripts/audit_upstox_option_tick_replay.py \
            scripts/evaluate_tradebuilder_orchestrator_offline_certification.py \
            tests/test_execution_decision_contract.py \
            tests/test_runtime_authority_audit.py \
            tests/test_architecture_hardening_proofs.py \
            tests/test_architecture_hardening_campaign.py \
            tests/test_kite_candidate_replay_corpus_audit.py \
            tests/test_upstox_option_tick_replay_audit.py \
            tests/test_tradebuilder_orchestrator_offline_certification.py
      - name: Run focused tests
        env:
          DISABLE_ML: "true"
        run: |
          pytest -q \
            tests/test_execution_decision_contract.py \
            tests/test_runtime_authority_audit.py \
            tests/test_architecture_hardening_proofs.py \
            tests/test_architecture_hardening_campaign.py \
            tests/test_kite_candidate_replay_corpus_audit.py \
            tests/test_upstox_option_tick_replay_audit.py \
            tests/test_tradebuilder_orchestrator_offline_certification.py
      - name: Prove feed implementation untouched
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=1
          changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          printf '%s\n' "$changed"
          forbidden='^(core/(market_data\.py|kite_depth_ws\.py|feed_runtime\.py|.*feed.*recovery.*\.py|.*feed.*fresh.*\.py|.*subscription.*registry.*\.py)|config/.*feed.*)'
          if printf '%s\n' "$changed" | grep -E "$forbidden"; then
            echo "Feed-frozen path modified"
            exit 1
          fi
