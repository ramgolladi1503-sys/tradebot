name: Subscription Reconciliation Post-Close V1

on:
  pull_request:
    paths:
      - "scripts/validate_subscription_reconciliation_postclose_v1.py"
      - "tests/test_subscription_reconciliation_postclose_v1.py"
      - "docs/agent_reviews/subscription_reconciliation_postclose_v1.md"
      - ".github/workflows/subscription-reconciliation-postclose-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          lfs: false
      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - name: Compile
        run: python -m py_compile scripts/validate_subscription_reconciliation_postclose_v1.py tests/test_subscription_reconciliation_postclose_v1.py
      - name: Focused tests
        run: pytest -q -o addopts='' tests/test_subscription_reconciliation_postclose_v1.py
