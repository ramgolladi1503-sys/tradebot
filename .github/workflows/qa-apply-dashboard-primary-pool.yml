name: QA Apply Dashboard Primary Pool Repair

on:
  push:
    branches:
      - qa/whole-tradebot-certification-v1
    paths:
      - scripts/.apply_dashboard_primary_pool_once

permissions:
  contents: write

concurrency:
  group: qa-apply-dashboard-primary-pool
  cancel-in-progress: false

jobs:
  apply_dashboard_primary_pool:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: .
      DATA_ROOT: ${{ github.workspace }}/.runtime
      EXECUTION_MODE: PAPER
      TRADING_MODE: PAPER
      KITE_USE_API: "false"
      REPAIR_BASE_SHA: f32354a6e1b00dd77b9979919a089829c326e531
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: qa/whole-tradebot-certification-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Reject unrelated source drift
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$REPAIR_BASE_SHA" HEAD
          git diff --name-only "$REPAIR_BASE_SHA" HEAD | sort -u > /tmp/pre_apply.txt
          cat > /tmp/expected_pre_apply.txt <<'EOF'
          .github/workflows/qa-apply-dashboard-primary-pool.yml
          scripts/.apply_dashboard_primary_pool_once
          scripts/build_dashboard_primary_pool_repair.py
          tests/qa/test_dashboard_primary_pool_policy.py
          EOF
          diff -u /tmp/expected_pre_apply.txt /tmp/pre_apply.txt

      - name: Apply exact UI source repair
        run: python scripts/build_dashboard_primary_pool_repair.py

      - name: Verify changed production scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only -- dashboard/streamlit_app_runtime.py > /tmp/changed.txt
          test "$(cat /tmp/changed.txt)" = "dashboard/streamlit_app_runtime.py"
          grep -Fq '"Show advisory/debug candidates"' dashboard/streamlit_app_runtime.py
          grep -Fq 'show_exec_only = _show_executable_primary(show_advisory_candidates)' dashboard/streamlit_app_runtime.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies and scanner
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit

      - name: Run focused UI and ranking proofs
        run: >-
          PYTHONPATH=. pytest -q -o addopts=''
          tests/qa/test_dashboard_primary_pool_policy.py
          tests/qa/test_dashboard_operator_truth.py
          tests/test_dashboard_canonical_ranked_source.py
          tests/qa/test_ranking_tiebreak_determinism.py
          tests/qa/test_whole_tradebot_cross_module_truth.py
          --durations=20

      - name: Scan changed dashboard runtime
        run: bandit dashboard/streamlit_app_runtime.py -ll

      - name: Commit verified executable-primary UI behavior
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/.apply_dashboard_primary_pool_once
          rm -f scripts/build_dashboard_primary_pool_repair.py
          git add \
            dashboard/streamlit_app_runtime.py \
            scripts/.apply_dashboard_primary_pool_once \
            scripts/build_dashboard_primary_pool_repair.py
          git diff --cached --check
          git config user.name "tradebot-qa-bot"
          git config user.email "tradebot-qa-bot@users.noreply.github.com"
          git commit -m "fix: make executable opportunities the primary UI pool"
          git push origin HEAD:qa/whole-tradebot-certification-v1
