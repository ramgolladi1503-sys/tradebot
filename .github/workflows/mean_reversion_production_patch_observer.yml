name: Mean Reversion Production Patch Observer

# Revision 3: observe corpus classification and date-accounting patch runners.
on:
  push:
    branches:
      - research/postmerge-mean-reversion-rerun-v1
    paths:
      - ".github/workflows/mean_reversion_production_patch_observer.yml"

permissions:
  actions: read
  contents: write

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/postmerge-mean-reversion-rerun-v1
          fetch-depth: 1

      - name: Query production patch workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work=/tmp/production-patch-observer
          mkdir -p "${work}"
          for workflow in \
            apply_mean_reversion_corpus_classification_patch.yml \
            apply_mean_reversion_date_accounting_patch.yml; do
            gh api \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=fix%2Fmean-reversion-corpus-file-classification-v1&event=push&per_page=10" \
              > "${work}/${workflow}.json"
          done
          python - <<'PY'
          import json
          from pathlib import Path

          work = Path('/tmp/production-patch-observer')
          workflows = [
              'apply_mean_reversion_corpus_classification_patch.yml',
              'apply_mean_reversion_date_accounting_patch.yml',
          ]
          result = {}
          for workflow in workflows:
              payload = json.loads((work / f'{workflow}.json').read_text())
              runs = payload.get('workflow_runs', [])
              if not runs:
                  result[workflow] = {'status': 'NOT_FOUND'}
                  continue
              run = runs[0]
              result[workflow] = {
                  'workflow_run_id': run.get('id'),
                  'run_number': run.get('run_number'),
                  'status': run.get('status'),
                  'conclusion': run.get('conclusion'),
                  'head_sha': run.get('head_sha'),
                  'created_at': run.get('created_at'),
                  'updated_at': run.get('updated_at'),
                  'html_url': run.get('html_url'),
              }
          target = Path('docs/research/mean_reversion_postmerge_regeneration/production_patch_workflows_status.json')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Commit observer result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/mean_reversion_postmerge_regeneration/production_patch_workflows_status.json
          git commit -m "research: publish production patch workflow statuses"
          git push origin HEAD:research/postmerge-mean-reversion-rerun-v1
