name: PSILOR V1 Recertification

on:
  pull_request:
    paths:
      - "research/psilor_v1/**"
      - "scripts/run_psilor_v1_recertification.py"
      - "scripts/fetch_psilor_v1_data.py"
      - "scripts/smoke_test_psilor_v1.py"
      - "tests/test_psilor_v1_recertification.py"
      - ".github/workflows/psilor_v1_recertification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recertification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check pandas pytest

      - name: Compile PSILOR research lane
        run: >-
          python -m py_compile
          research/psilor_v1/*.py
          scripts/run_psilor_v1_recertification.py
          tests/test_psilor_v1_recertification.py

      - name: Run focused integrity tests
        run: pytest -q tests/test_psilor_v1_recertification.py

      - name: Generate deterministic readiness evidence
        run: >-
          python scripts/run_psilor_v1_recertification.py
          --output runtime/research/psilor_v1/readiness.json

      - name: Enforce claim boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("runtime/research/psilor_v1/readiness.json")
          evidence = json.loads(path.read_text())
          assert evidence["candidate_count"] == 0
          assert evidence["candidate"] is None
          assert evidence["allowed_for_live_execution"] is False
          assert evidence["is_order_action"] is False
          assert evidence["broker_api_called"] is False
          assert evidence["final_verdict"] == "NOT_EVALUATED_DATA_BLOCKED"
          assert evidence["claim_boundary"] == (
              "NO_STRUCTURAL_EDGE_OR_OPTION_PROFITABILITY_PROVEN"
          )
          assert evidence["calibration"][
              "precomputed_outcome_mismatch_detected"
          ] is True
          assert evidence["calibration"]["mixed_bar_horizon_audit"][
              "mixed_elapsed_horizon"
          ] is True
          PY

      - name: Upload research evidence
        uses: actions/upload-artifact@v4
        with:
          name: psilor-v1-recertification
          path: runtime/research/psilor_v1/readiness.json
          if-no-files-found: error

  authenticated-bounded-smoke:
    needs: recertification
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'data/psilor-v1-upstox-fetch-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
      PSILOR_SMOKE_ROOT: ${{ runner.temp }}/psilor-smoke
      PSILOR_SMOKE_RUN_ID: pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install smoke dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pytz python-dateutil pyarrow requests

      - name: Require repository Upstox secret
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${UPSTOX_ACCESS_TOKEN:-}" ]; then
            echo 'SMOKE_VERDICT=BLOCKED_AUTHENTICATION'
            echo 'UPSTOX_ACCESS_TOKEN repository secret is unavailable to this same-repository PR run.'
            exit 1
          fi
          echo 'AUTH_SECRET_AVAILABLE=YES'

      - name: Run five-file authenticated smoke
        run: PYTHONPATH=. python scripts/smoke_test_psilor_v1.py

      - name: Verify exact smoke verdict
        shell: bash
        run: |
          set -euo pipefail
          report="${PSILOR_SMOKE_ROOT}/${PSILOR_SMOKE_RUN_ID}/validation_report.json"
          python - "$report" <<'PY'
          import json
          import sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert report['smoke_verdict'] == 'PASS_BOUNDED_AUTHENTICATED_FETCH_SMOKE'
          assert report['real_future_contracts'] == 1
          assert report['real_ce_contracts'] == 2
          assert report['real_pe_contracts'] == 2
          assert report['real_candle_files'] == 5
          assert len(report['exact_common_sessions']) == 2
          assert report['smoke_hash_reconciliation'] == 'PASS'
          assert report['no_unexpected_files'] is True
          assert report['created_by_current_run'] is True
          assert report['formal_extraction_approved'] is True
          print('SMOKE_VERDICT=PASS_BOUNDED_AUTHENTICATED_FETCH_SMOKE')
          PY

      - name: Upload sanitized smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psilor-authenticated-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/psilor-smoke
          if-no-files-found: ignore
          retention-days: 14
