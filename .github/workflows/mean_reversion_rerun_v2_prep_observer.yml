name: Mean Reversion Rerun V2 Preparation Observer

on:
  push:
    branches:
      - research/postmerge-mean-reversion-rerun-v1
    paths:
      - ".github/workflows/mean_reversion_rerun_v2_prep_observer.yml"

permissions:
  actions: read
  contents: write

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/postmerge-mean-reversion-rerun-v1
          fetch-depth: 1

      - name: Query preparation workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/prepare_mean_reversion_rerun_v2.yml/runs?branch=research%2Fpostmerge-mean-reversion-rerun-v2&event=push&per_page=10" \
            > /tmp/runs.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/runs.json').read_text())
          runs = payload.get('workflow_runs', [])
          result = {'status': 'NOT_FOUND'}
          if runs:
              run = runs[0]
              result = {
                  'workflow_run_id': run.get('id'),
                  'run_number': run.get('run_number'),
                  'status': run.get('status'),
                  'conclusion': run.get('conclusion'),
                  'head_sha': run.get('head_sha'),
                  'created_at': run.get('created_at'),
                  'updated_at': run.get('updated_at'),
                  'html_url': run.get('html_url'),
              }
          target = Path('docs/research/mean_reversion_postmerge_regeneration/rerun_v2_prep_status.json')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Commit observer result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/mean_reversion_postmerge_regeneration/rerun_v2_prep_status.json
          git commit -m "research: publish rerun v2 preparation status"
          git push origin HEAD:research/postmerge-mean-reversion-rerun-v1
