name: tests

on:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  unit_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
      DATA_ROOT: ${{ github.workspace }}/.runtime
      EXECUTION_MODE: PAPER
      KITE_USE_API: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install verified TradeBot dependency graph
        run: |
          python -m pip install --upgrade pip
          python scripts/install_tradebot_dependencies.py

      - name: Run fast deterministic tests
        run: >-
          PYTHONPATH=. pytest -q -o addopts=''
          -m "not integration and not feed_smoke and not feed_soak and not certification"
          --durations=25
          --junitxml=.runtime/pytest-results.xml

      - name: Upload pytest report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-failure-report
          if-no-files-found: error
          path: .runtime/pytest-results.xml

  health_gate:
    runs-on: ubuntu-latest
    needs: unit_tests
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      DATA_ROOT: ${{ github.workspace }}/.runtime
      EXECUTION_MODE: PAPER
      KITE_USE_API: "false"
      PYTHONHASHSEED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install verified TradeBot dependency graph
        run: |
          python -m pip install --upgrade pip
          python scripts/install_tradebot_dependencies.py

      - name: Run deterministic health gate
        run: PYTHONPATH=. python -m core.health_gate --desk DEFAULT --strict
        timeout-minutes: 3

      - name: Upload health gate artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: health-gate-report
          if-no-files-found: warn
          path: |
            .runtime/logs/health_gate_report.json
            .runtime/logs/health_gate_report.md
