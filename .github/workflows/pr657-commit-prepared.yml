name: PR657 Commit Prepared Fix

on:
  push:
    branches:
      - fix/canonical-strategy-input-truth

permissions:
  contents: write
  actions: read

concurrency:
  group: pr657-commit-prepared-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/canonical-strategy-input-truth
          fetch-depth: 0

      - name: Download verified correction artifact
        run: |
          rm -rf /tmp/pr657-prepared
          mkdir -p /tmp/pr657-prepared
          gh run download 29516683745 \
            --repo ramgolladi1503-sys/tradebot \
            --name pr657-autofix-29516683745 \
            --dir /tmp/pr657-prepared

      - name: Install verified files and remove diagnostics
        run: |
          cp /tmp/pr657-prepared/tests/test_market_data_index_quote_cache.py tests/test_market_data_index_quote_cache.py
          cp /tmp/pr657-prepared/tests/test_time_sanity_staleness.py tests/test_time_sanity_staleness.py
          cp /tmp/pr657-prepared/docs/agent_reviews/canonical_strategy_input_truth_repair.md docs/agent_reviews/canonical_strategy_input_truth_repair.md
          cp /tmp/pr657-prepared/docs/agent_handoffs/canonical-strategy-input-truth-repair-codex.md docs/agent_handoffs/canonical-strategy-input-truth-repair-codex.md
          rm -f .github/workflows/pr657-diagnostics.yml
          rm -f .github/workflows/pr657-autofix.yml
          rm -f .github/workflows/pr657-commit-prepared.yml
          git diff --check

      - name: Commit exact verified correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tests/test_market_data_index_quote_cache.py \
            tests/test_time_sanity_staleness.py \
            docs/agent_reviews/canonical_strategy_input_truth_repair.md \
            docs/agent_handoffs/canonical-strategy-input-truth-repair-codex.md \
            .github/workflows/pr657-diagnostics.yml \
            .github/workflows/pr657-autofix.yml \
            .github/workflows/pr657-commit-prepared.yml
          git diff --cached --check
          git commit -m "test: align freshness fixtures with frozen cutoff"
          git push origin HEAD:fix/canonical-strategy-input-truth
