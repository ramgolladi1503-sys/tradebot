name: QA Certification Truth

on:
  push:
  pull_request:

concurrency:
  group: qa-truth-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test_integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install pytest

      - name: Prove integrity auditor behavior
        run: PYTHONPATH=. python -m pytest -q tests/test_test_integrity_audit.py

      - name: Audit repository test integrity
        shell: bash
        run: |
          set -euo pipefail
          args=(--roots tests testing/tests --report-dir .runtime/qa)
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            args+=(--changed-base "origin/${{ github.base_ref }}")
          fi
          PYTHONPATH=. python scripts/audit_test_integrity.py "${args[@]}"

      - name: Upload test integrity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-integrity-evidence
          if-no-files-found: error
          path: |
            .runtime/qa/test_integrity_report.json
            .runtime/qa/test_integrity_report.md

  auth_behavior_coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      DATA_ROOT: ${{ github.workspace }}/.runtime
      EXECUTION_MODE: PAPER
      KITE_USE_API: "false"
      KITE_ALLOW_ENV_TOKEN_FOR_CI: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install focused verified auth dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov python-dotenv
          python scripts/install_tradebot_dependencies.py --skip-base

      - name: Disable automatic compatibility layer for honest coverage
        run: |
          mkdir -p .runtime/qa
          mv sitecustomize.py .runtime/qa/sitecustomize.py.disabled
          test ! -f sitecustomize.py

      - name: Run authentication behavior and branch coverage gate
        run: >-
          PYTHONPATH=. pytest -q -o addopts=''
          tests/auth/test_auth_manager_behavior_contracts.py
          tests/auth/test_auth_boundary_exhaustive.py
          tests/auth/test_auth_internal_fallbacks.py
          tests/auth/test_check_kite_auth_cli_behavior.py
          tests/auth/test_auth_feed_event_boundary.py
          tests/auth/test_auth_safety.py
          tests/test_kite_client_auth_guard.py
          tests/test_runtime_auth_freshness.py
          --cov=core.auth_manager
          --cov=core.auth
          --cov-branch
          --cov-fail-under=100
          --cov-report=term-missing
          --cov-report=json:.runtime/qa/auth_coverage.json
          --junitxml=.runtime/qa/auth_pytest.xml

      - name: Upload authentication QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-qa-evidence
          if-no-files-found: error
          path: |
            .runtime/qa/auth_coverage.json
            .runtime/qa/auth_pytest.xml
            .runtime/qa/sitecustomize.py.disabled
            .runtime/wheels/kiteconnect_patch_manifest.json

  auth_static_security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit

      - name: Scan authentication boundary for medium/high findings
        run: |
          mkdir -p .runtime/qa
          bandit -r core/auth.py core/auth_manager.py -ll -f json -o .runtime/qa/bandit_auth.json

      - name: Upload Bandit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-static-security-evidence
          if-no-files-found: error
          path: .runtime/qa/bandit_auth.json

  dependency_vulnerability_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: .
      DATA_ROOT: ${{ github.workspace }}/.runtime
      EXECUTION_MODE: PAPER
      KITE_USE_API: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc "/usr/local/share/boost" || true
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install exact production dependency graph and audit tool
        run: |
          python -m pip install --upgrade pip
          python scripts/install_tradebot_dependencies.py
          python -m pip install pip-audit

      - name: Audit installed environment including patched broker SDK
        run: |
          mkdir -p .runtime/qa
          pip-audit --local --format json --output .runtime/qa/pip_audit.json
          python - <<'PY' > .runtime/qa/dependency_versions.json
          import importlib.metadata as metadata
          import json
          print(json.dumps({
              "kiteconnect": metadata.version("kiteconnect"),
              "autobahn": metadata.version("autobahn"),
          }, sort_keys=True))
          PY

      - name: Upload dependency audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-evidence
          if-no-files-found: error
          path: |
            .runtime/qa/pip_audit.json
            .runtime/qa/dependency_versions.json
            .runtime/wheels/kiteconnect_patch_manifest.json

  runtime_shim_certification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install pytest

      - name: Prove runtime shim auditor behavior
        run: PYTHONPATH=. python -m pytest -q tests/test_runtime_shim_audit.py

      - name: Require zero automatic TradeBot behavior patches
        run: >-
          PYTHONPATH=. python scripts/audit_runtime_shims.py
          --report-dir .runtime/qa
          --fail-on-active

      - name: Upload runtime shim evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-shim-evidence
          if-no-files-found: error
          path: |
            .runtime/qa/runtime_shim_report.json
            .runtime/qa/runtime_shim_report.md

  repo_forensics_certification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      EXECUTION_MODE: PAPER
      KITE_USE_API: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run zero-debt repo forensics certification
        run: >-
          PYTHONPATH=. python scripts/run_repo_forensics.py
          --repo .
          --config .gsd-forensics.yaml
          --out .runtime/qa/repo_forensics_full.md

      - name: Upload full repo forensics evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repo-forensics-certification-evidence
          if-no-files-found: error
          path: .runtime/qa/repo_forensics_full.md
