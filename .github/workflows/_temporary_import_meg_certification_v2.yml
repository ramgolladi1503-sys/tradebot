name: Temporary Import MEG Certification V2

on:
  push:
    branches:
      - post-pr763/meg-shadow-system-certification-v2

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: post-pr763/meg-shadow-system-certification-v2
          fetch-depth: 0
          lfs: false

      - name: Import exact curated PR776 paths
        run: |
          SOURCE_SHA="0121d02d2451ef94e6841284a700bbcf37a6bca0"
          git checkout "$SOURCE_SHA" -- \
            .github/workflows/meg-shadow-system-certification.yml \
            core/auth_manager.py \
            core/qa_certification/__init__.py \
            core/qa_certification/meg_shadow_system.py \
            docs/agent_reviews/meg_shadow_system_certification_v1.md \
            docs/qa/ENTERPRISE_QA_MASTER_PLAN.md \
            docs/qa/MEG_SHADOW_CERTIFICATION_SCOPE.md \
            docs/qa/MODULE_RISK_REGISTER.md \
            scripts/assemble_meg_shadow_system_certificate.py \
            scripts/audit_test_integrity.py \
            scripts/run_meg_shadow_offline_certification.py \
            tests/auth/test_auth_manager_behavior_contracts.py \
            tests/qa/test_meg_shadow_system_certification.py \
            tests/test_test_integrity_audit.py

      - name: Remove temporary machinery and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/_temporary_import_meg_certification_v2.yml \
            tools/_trigger_import_meg_certification_v2.txt
          git add \
            .github/workflows/meg-shadow-system-certification.yml \
            core/auth_manager.py \
            core/qa_certification/__init__.py \
            core/qa_certification/meg_shadow_system.py \
            docs/agent_reviews/meg_shadow_system_certification_v1.md \
            docs/qa/ENTERPRISE_QA_MASTER_PLAN.md \
            docs/qa/MEG_SHADOW_CERTIFICATION_SCOPE.md \
            docs/qa/MODULE_RISK_REGISTER.md \
            scripts/assemble_meg_shadow_system_certificate.py \
            scripts/audit_test_integrity.py \
            scripts/run_meg_shadow_offline_certification.py \
            tests/auth/test_auth_manager_behavior_contracts.py \
            tests/qa/test_meg_shadow_system_certification.py \
            tests/test_test_integrity_audit.py
          git diff --cached --check
          git commit -m "feat: import curated MEG shadow certification"
          git push origin HEAD:post-pr763/meg-shadow-system-certification-v2
