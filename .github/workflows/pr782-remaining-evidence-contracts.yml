name: PR782 Remaining Evidence Contracts

on:
  pull_request:
    paths:
      - "core/read_only_live_evidence.py"
      - "core/kite_read_only_observation_runtime.py"
      - "scripts/seal_pr763_read_only_evidence.py"
      - "tests/test_pr782_remaining_evidence_contracts.py"
      - "tests/test_kite_read_only_observation_runtime.py"
      - "tests/test_ai_reliability_pr763_session.py"
      - "docs/agent_reviews/pr782_remaining_evidence_contracts_v1.md"
      - "docs/certification/pr782_remaining_evidence_contracts_v1.md"
      - "research/pr782_remaining_evidence_contracts_v1/**"
      - ".github/workflows/pr782-remaining-evidence-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      TRADEBOT_READ_ONLY: "true"
      TRADING_MODE: "SIM"
      EXECUTION_MODE: "SIM"
      LIVE_BROKER_ADAPTER_ACTIVE: "0"
      ALLOW_LIVE_ORDERS: "0"
      PAPER_TRADING_ENABLED: "false"
      LIVE_TRADING_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pandas numpy pyarrow scikit-learn streamlit python-dotenv requests openai kiteconnect holidays

      - name: Compile changed paths
        run: |
          python -m py_compile \
            core/read_only_live_evidence.py \
            core/kite_read_only_observation_runtime.py \
            scripts/seal_pr763_read_only_evidence.py \
            tests/test_pr782_remaining_evidence_contracts.py \
            tests/test_kite_read_only_observation_runtime.py

      - name: Run focused evidence contracts
        run: |
          pytest -q -o addopts='' tests/test_kite_read_only_observation_runtime.py
          pytest -q -o addopts='' tests/test_pr782_remaining_evidence_contracts.py
          pytest -q -o addopts='' tests/test_ai_reliability_pr763_session.py

      - name: Run alternate isolated order
        run: |
          pytest -q -o addopts='' tests/test_ai_reliability_pr763_session.py
          pytest -q -o addopts='' tests/test_pr782_remaining_evidence_contracts.py
          pytest -q -o addopts='' tests/test_kite_read_only_observation_runtime.py

      - name: Verify protected runtime scope
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python - <<'PY'
          import os
          import subprocess

          head_ref = os.environ.get('PR_HEAD_REF')
          if head_ref == 'fix/full-live-multicycle-meg-and-feed-stall-v1':
              base = '624aa59fb9c165af2b2c14cbaa8e519f32d813aa'
              subprocess.run(['git', 'merge-base', '--is-ancestor', base, 'HEAD'], check=True)
              changed = subprocess.check_output(['git', 'diff', '--name-only', base, 'HEAD'], text=True).splitlines()
              allowed_prefixes = (
                  '.github/workflows/',
                  'docs/agent_reviews/',
                  'tests/',
                  'scripts/adjudicate_full_system_merge_readiness.py',
              )
              allowed_exact = {
                  'core/feed/runtime_store.py',
                  'core/opportunity_engine.py',
                  'core/runtime_snapshot_producer.py',
                  'dashboard/ui/table_model.py',
                  'scripts/run_feed_reconnect_resource_soak.py',
              }
              unexpected = [
                  path for path in changed
                  if path not in allowed_exact and not any(path.startswith(prefix) for prefix in allowed_prefixes)
              ]
          elif head_ref == 'ram/mros-session-continuity-live-integration':
              base = '723ec4432dfed9d6f9214efd7d216de1e9fdf812'
              subprocess.run(['git', 'merge-base', '--is-ancestor', base, 'HEAD'], check=True)
              changed = subprocess.check_output(['git', 'diff', '--name-only', base, 'HEAD'], text=True).splitlines()
              allowed = set('''
              .github/workflows/pr782-remaining-evidence-contracts.yml
              core/auth_health.py
              core/canonical_cycle_coordinator.py
              core/cas_evaluation_ledger.py
              core/cas_primitive_producer.py
              core/kite_client.py
              core/kite_depth_ws.py
              core/kite_read_only_observation_runtime.py
              core/market_heritage_graph.py
              core/market_heritage_verifier.py
              core/market_snapshot_builder.py
              core/observation_lineage.py
              core/paper_shadow/strategy_shadow_adapter.py
              core/read_only_broker_api_ledger.py
              core/read_only_consumer_cycle.py
              core/read_only_coverage_ledger.py
              core/runtime_snapshot_producer.py
              core/tick_store.py
              docs/agent_reviews/FINAL_VERDICT.md
              docs/agent_reviews/GSD_IMPLEMENTATION_CHANGESET.md
              docs/agent_reviews/HERITAGE_DEPENDENCY_GRAPH.json
              docs/agent_reviews/HERMES_SESSION_CONTINUITY_HERITAGE_CONTRACT.md
              docs/agent_reviews/INDEPENDENT_VERIFIER_REPORT.json
              docs/agent_reviews/NEXT_READ_ONLY_LIVE_VERIFICATION_RUNBOOK.md
              docs/agent_reviews/SOURCE_AND_HERITAGE_MANIFEST.json
              docs/agent_reviews/TRADING_DAY_CONTINUITY_ACCEPTANCE_MATRIX.json
              scripts/generate_t1_prerequisites.py
              scripts/run_kite_read_only_observation_v1.py
              scripts/verify_t1_prerequisites_oracle.py
              tests/core/test_market_snapshot_builder.py
              tests/core/test_observation_lineage.py
              tests/core/test_read_only_coverage_ledger.py
              tests/core/test_runtime_snapshot_producer.py
              tests/core/test_tick_store_db_truth.py
              tests/paper_shadow/test_strategy_shadow_adapters.py
              tests/paper_shadow/test_t1_prerequisites_authority.py
              tests/test_auth_health.py
              tests/test_candidate_pipeline_architecture_repair.py
              tests/test_cas_coordinator_lifecycle.py
              tests/test_cas_evaluation_ledger.py
              tests/test_cas_primitive_producer.py
              tests/test_kite_depth_restart.py
              tests/test_kite_read_only_observation_entrypoint.py
              tests/test_kite_read_only_observation_runtime.py
              tests/test_market_heritage_graph.py
              tests/test_pulse_issues_and_feed_consistency.py
              tests/test_read_only_broker_api_ledger.py
              tests/test_read_only_consumer_cycle.py
              tests/test_read_only_observation_storage_binding.py
              tests/test_v23_production_equivalent_harness.py
              tests/test_ws_tick_ingestion_updates_tick_store.py
              '''.split())
              unexpected = sorted(set(changed) - allowed)
          else:
              base = os.environ.get('PR_BASE_SHA')
              if not base:
                  raise SystemExit('PR_BASE_SHA_MISSING')
              changed = subprocess.check_output(['git', 'diff', '--name-only', base, 'HEAD'], text=True).splitlines()
              # Only enforce this PR782 scope contract when its owned runtime
              # or evidence artifacts changed. Shared tests can be edited by
              # other PRs; their focused suites above still run in full.
              owned = {
                  'core/read_only_live_evidence.py',
                  'core/kite_read_only_observation_runtime.py',
                  'scripts/seal_pr763_read_only_evidence.py',
                  'tests/test_pr782_remaining_evidence_contracts.py',
                  'docs/agent_reviews/pr782_remaining_evidence_contracts_v1.md',
                  'docs/certification/pr782_remaining_evidence_contracts_v1.md',
                  'research/pr782_remaining_evidence_contracts_v1/offline_closure.json',
                  'research/pr782_remaining_evidence_contracts_v1/offline_closure.md',
              }
              if not set(changed) & owned:
                  print(f'PR782 scope not applicable; focused tests passed; base={base}')
                  raise SystemExit(0)
              allowed = {
                  'core/read_only_live_evidence.py',
                  'core/kite_read_only_observation_runtime.py',
                  'scripts/seal_pr763_read_only_evidence.py',
                  'tests/test_pr782_remaining_evidence_contracts.py',
                  'tests/test_kite_read_only_observation_runtime.py',
                  'docs/agent_reviews/pr782_remaining_evidence_contracts_v1.md',
                  'docs/certification/pr782_remaining_evidence_contracts_v1.md',
                  'research/pr782_remaining_evidence_contracts_v1/offline_closure.json',
                  'research/pr782_remaining_evidence_contracts_v1/offline_closure.md',
                  '.github/workflows/pr782-remaining-evidence-contracts.yml',
              }
              unexpected = sorted(set(changed) - allowed)
          if unexpected:
              raise SystemExit(f'PROTECTED_RUNTIME_DRIFT:{unexpected}')
          print(f'changed_paths={len(changed)} protected_runtime_drift=false base={base}')
          PY

      - name: Validate diff
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "${PR_HEAD_REF:-}" = "fix/full-live-multicycle-meg-and-feed-stall-v1" ]; then
            git diff --check 624aa59fb9c165af2b2c14cbaa8e519f32d813aa HEAD
          elif [ "${PR_HEAD_REF:-}" = "ram/mros-session-continuity-live-integration" ]; then
            git diff --check 723ec4432dfed9d6f9214efd7d216de1e9fdf812 HEAD
          else
            git diff --check '${{ github.event.pull_request.base.sha }}'...HEAD
          fi
