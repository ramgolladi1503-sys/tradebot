name: Code Excellence Gates

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-excellence-gates:
    name: code-excellence-gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
      EXECUTION_MODE: PAPER
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect and validate changed paths
        run: |
          git fetch origin main --depth=1
          mkdir -p docs/code_excellence/reports
          if [ "${GITHUB_HEAD_REF:-}" = "fix/full-live-multicycle-meg-and-feed-stall-v1" ]; then
            LIVE_TESTED_SHA="624aa59fb9c165af2b2c14cbaa8e519f32d813aa"
            git merge-base --is-ancestor "$LIVE_TESTED_SHA" HEAD
            git diff --name-only "$LIVE_TESTED_SHA"...HEAD > docs/code_excellence/reports/post_live_paths.txt
            python - <<'PY'
          from pathlib import Path
          actual = {
              line.strip()
              for line in Path('docs/code_excellence/reports/post_live_paths.txt').read_text().splitlines()
              if line.strip()
          }
          allowed = {
              '.github/workflows/ai-reliability-pr763-certification.yml',
              '.github/workflows/ci.yml',
              '.github/workflows/code-excellence-gates.yml',
              '.github/workflows/meg-shadow-system-certification.yml',
              '.github/workflows/pr782-remaining-evidence-contracts.yml',
              '.github/workflows/runtime-authority-cutover.yml',
              '.github/workflows/tests.yml',
              'docs/agent_reviews/meg803_identity_manifest_repair.md',
              'scripts/adjudicate_full_system_merge_readiness.py',
              'tests/conftest.py',
              'tests/test_kite_read_only_observation_runtime.py',
          }
          unexpected = sorted(actual - allowed)
          if unexpected:
              raise SystemExit(f'POST_LIVE_DELTA_OUT_OF_SCOPE:{unexpected}')
          required = {
              'scripts/adjudicate_full_system_merge_readiness.py',
              'tests/test_kite_read_only_observation_runtime.py',
          }
          missing = sorted(required - actual)
          if missing:
              raise SystemExit(f'EXPECTED_POST_LIVE_DELTA_MISSING:{missing}')
          print(f'post-live delta exact-scope PASS paths={len(actual)}')
          PY
            # CE static gates operate on the product verifier and evidence artifact.
            # Workflow-only changes are exercised by Actions themselves; changed
            # test fixtures/harness are exercised by PR782 and generic unit CI.
            printf '%s\n' \
              'docs/agent_reviews/meg803_identity_manifest_repair.md' \
              'scripts/adjudicate_full_system_merge_readiness.py' \
              > docs/code_excellence/reports/changed_paths.txt
            echo "Final integration: exact post-live delta guarded from $LIVE_TESTED_SHA"
          else
            git diff --name-only origin/main...HEAD > docs/code_excellence/reports/changed_paths.txt
            cp docs/code_excellence/reports/changed_paths.txt docs/code_excellence/reports/post_live_paths.txt
          fi
          echo '--- all guarded paths ---'
          cat docs/code_excellence/reports/post_live_paths.txt
          echo '--- CE-scoped paths ---'
          cat docs/code_excellence/reports/changed_paths.txt

      - name: Run unified CE gates
        run: |
          PYTHONPATH=. python scripts/run_unified_ce_gates.py \
            --repo . \
            --config .gsd-forensics.yaml \
            --changed-paths-file docs/code_excellence/reports/changed_paths.txt \
            --out docs/code_excellence/reports/unified_ce_gate_latest.md

      - name: Build required Agent Elite report
        if: always()
        run: |
          PYTHONPATH=. python scripts/run_agent_elite_report.py \
            --out docs/code_excellence/reports/unified_agent_elite_latest.md \
            --unknown-explanation docs/code_excellence/reports/unified_ce_gate_latest.md \
            --require-ci-pass

      - name: Upload CE gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-excellence-gate-reports
          if-no-files-found: warn
          path: |
            docs/code_excellence/reports/post_live_paths.txt
            docs/code_excellence/reports/changed_paths.txt
            docs/code_excellence/reports/unified_ce_gate_latest.md
            docs/code_excellence/reports/unified_agent_elite_latest.md
