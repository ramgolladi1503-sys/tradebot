name: Conditional Precursor Discrimination V2

on:
  workflow_dispatch:
  push:
    branches:
      - research/conditional-precursor-discrimination-v2
    paths:
      - 'scripts/run_conditional_precursor_discrimination_v2.py'
      - 'scripts/run_option_surface_transition_discovery_v1.py'
      - 'scripts/run_option_surface_transition_discovery_v1_cli.py'
      - 'scripts/run_extreme_option_pressure_discovery_v2.py'
      - 'scripts/run_late_day_ce_inventory_rebound_v3.py'
      - 'scripts/audit_late_day_ce_inventory_rebound_v4.py'
      - 'tests/research/test_conditional_precursor_discrimination_v2.py'
      - 'tests/research/test_option_surface_transition_discovery_v1.py'
      - 'tests/research/test_extreme_option_pressure_discovery_v2.py'
      - 'tests/research/test_late_day_ce_inventory_rebound_v3.py'
      - 'tests/research/test_late_day_ce_inventory_rebound_v4.py'
      - 'research/conditional_precursor_discrimination_v2/**'
      - 'research/option_surface_transition_discovery_v1/**'
      - 'research/extreme_option_pressure_discovery_v2/**'
      - 'research/late_day_ce_inventory_rebound_v3/**'
      - 'research/late_day_ce_inventory_rebound_v4_horizon_audit/**'
      - '.github/workflows/conditional-precursor-discrimination-v2.yml'
  pull_request:
    paths:
      - 'scripts/run_conditional_precursor_discrimination_v2.py'
      - 'scripts/run_option_surface_transition_discovery_v1.py'
      - 'scripts/run_option_surface_transition_discovery_v1_cli.py'
      - 'scripts/run_extreme_option_pressure_discovery_v2.py'
      - 'scripts/run_late_day_ce_inventory_rebound_v3.py'
      - 'scripts/audit_late_day_ce_inventory_rebound_v4.py'
      - 'tests/research/test_conditional_precursor_discrimination_v2.py'
      - 'tests/research/test_option_surface_transition_discovery_v1.py'
      - 'tests/research/test_extreme_option_pressure_discovery_v2.py'
      - 'tests/research/test_late_day_ce_inventory_rebound_v3.py'
      - 'tests/research/test_late_day_ce_inventory_rebound_v4.py'
      - 'research/conditional_precursor_discrimination_v2/**'
      - 'research/option_surface_transition_discovery_v1/**'
      - 'research/extreme_option_pressure_discovery_v2/**'
      - 'research/late_day_ce_inventory_rebound_v3/**'
      - 'research/late_day_ce_inventory_rebound_v4_horizon_audit/**'
      - '.github/workflows/conditional-precursor-discrimination-v2.yml'

permissions:
  contents: write

jobs:
  verify-and-discover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository pointers
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Materialize only required LFS evidence
        run: |
          git lfs install
          git lfs pull \
            --include='research/local_evidence_consolidation_v1/worktrees/reverse-causal-option-expansion-v1/runtime_research/reverse_causal_option_expansion_v1/*' \
            --exclude=''
          required='research/local_evidence_consolidation_v1/worktrees/reverse-causal-option-expansion-v1/runtime_research/reverse_causal_option_expansion_v1'
          find "$required" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas pyarrow pytest

      - name: Run focused tests
        run: |
          python -m pytest -q \
            tests/research/test_conditional_precursor_discrimination_v2.py \
            tests/research/test_option_surface_transition_discovery_v1.py \
            tests/research/test_extreme_option_pressure_discovery_v2.py \
            tests/research/test_late_day_ce_inventory_rebound_v3.py \
            tests/research/test_late_day_ce_inventory_rebound_v4.py

      - name: Verify corpus and reproduce prior campaign
        run: |
          python scripts/run_conditional_precursor_discrimination_v2.py --repo-root "$GITHUB_WORKSPACE"

      - name: Run frozen option-surface economic discovery V1
        run: |
          python -m scripts.run_option_surface_transition_discovery_v1_cli --repo-root "$GITHUB_WORKSPACE"

      - name: Run extreme option-pressure OOF discovery V2
        run: |
          python -m scripts.run_extreme_option_pressure_discovery_v2 --repo-root "$GITHUB_WORKSPACE"

      - name: Regenerate late-day CE candidate evidence V3
        run: |
          python -m scripts.run_late_day_ce_inventory_rebound_v3 --repo-root "$GITHUB_WORKSPACE"

      - name: Run independent exact-horizon audit V4
        id: horizon_audit
        continue-on-error: true
        run: |
          python -m scripts.audit_late_day_ce_inventory_rebound_v4 --repo-root "$GITHUB_WORKSPACE"

      - name: Invalidate mismatched V3 publication
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          audit_path = Path("runtime/research/late_day_ce_inventory_rebound_v4_horizon_audit/independent_horizon_audit.json")
          if not audit_path.exists():
              print("V4 audit did not produce a decision; no V3 rewrite performed.")
              raise SystemExit(0)

          audit = json.loads(audit_path.read_text(encoding="utf-8"))
          if audit.get("v3_publication_status") != "INVALID_EXIT_HORIZON_CONTRACT_MISMATCH":
              print("No V3 exit-horizon mismatch was reported.")
              raise SystemExit(0)

          final_path = Path("runtime/research/late_day_ce_inventory_rebound_v3/final_decision.json")
          prior = json.loads(final_path.read_text(encoding="utf-8"))
          prior_verdict = prior.get("principal_verdict")
          prior.update(
              {
                  "prior_principal_verdict": prior_verdict,
                  "principal_verdict": "INVALID_EXIT_HORIZON_CONTRACT_MISMATCH",
                  "structural_edge_found": False,
                  "publication_invalidated": True,
                  "invalidation_reason": "declared_20_minute_exit_but_consumed_label_horizon_is_5_minutes",
                  "superseded_by": "late_day_ce_inventory_rebound_v4_horizon_audit",
                  "paper_or_live_authorized": False,
                  "allowed_for_live_execution": False,
              }
          )
          final_path.write_text(
              json.dumps(prior, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          Path("research/late_day_ce_inventory_rebound_v3/RESULT.md").write_text(
              "# Late-Day CE Inventory Rebound V3 — Invalidated\n\n"
              "Principal verdict: `INVALID_EXIT_HORIZON_CONTRACT_MISMATCH`\n\n"
              "The previous publication declared a fixed 20-minute exit, but every "
              "consumed outcome and committed trade-ledger row used a five-minute "
              "label. The previous structural-edge claim is invalid as stated.\n\n"
              "Authoritative continuation: "
              "`research/late_day_ce_inventory_rebound_v4_horizon_audit/RESULT.md`.\n\n"
              "No paper or live trading is authorized.\n",
              encoding="utf-8",
          )
          PY

      - name: Preserve deterministic research diagnostics on branch
        if: always() && github.event_name == 'push'
        run: |
          if [ ! -d runtime/research/conditional_precursor_discrimination_v2 ] && \
             [ ! -d runtime/research/option_surface_transition_discovery_v1 ] && \
             [ ! -d runtime/research/extreme_option_pressure_discovery_v2 ] && \
             [ ! -d runtime/research/late_day_ce_inventory_rebound_v3 ] && \
             [ ! -d runtime/research/late_day_ce_inventory_rebound_v4_horizon_audit ]; then
            echo "No runtime research evidence directory was produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f runtime/research/conditional_precursor_discrimination_v2/*.json || true
          git add -f runtime/research/option_surface_transition_discovery_v1/*.json || true
          git add -f runtime/research/option_surface_transition_discovery_v1/*.csv || true
          git add -f runtime/research/extreme_option_pressure_discovery_v2/*.json || true
          git add -f runtime/research/extreme_option_pressure_discovery_v2/*.csv || true
          git add -f runtime/research/late_day_ce_inventory_rebound_v3/*.json || true
          git add -f runtime/research/late_day_ce_inventory_rebound_v3/*.csv || true
          git add -f runtime/research/late_day_ce_inventory_rebound_v4_horizon_audit/*.json || true
          git add -f runtime/research/late_day_ce_inventory_rebound_v4_horizon_audit/*.csv || true
          git add -f research/option_surface_transition_discovery_v1/RESULT.md || true
          git add -f research/extreme_option_pressure_discovery_v2/RESULT.md || true
          git add -f research/late_day_ce_inventory_rebound_v3/RESULT.md || true
          git add -f research/late_day_ce_inventory_rebound_v4_horizon_audit/RESULT.md || true
          if git diff --cached --quiet; then
            echo "No deterministic diagnostic changes to preserve."
            exit 0
          fi
          git commit -m "research: preserve independently audited edge evidence [skip ci]"
          git push origin HEAD:research/conditional-precursor-discrimination-v2

      - name: Upload research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conditional-precursor-discrimination-v2-evidence
          path: |
            runtime/research/conditional_precursor_discrimination_v2/**
            runtime/research/option_surface_transition_discovery_v1/**
            runtime/research/extreme_option_pressure_discovery_v2/**
            runtime/research/late_day_ce_inventory_rebound_v3/**
            runtime/research/late_day_ce_inventory_rebound_v4_horizon_audit/**
            research/conditional_precursor_discrimination_v2/prior_campaign_reproduction.md
            research/option_surface_transition_discovery_v1/RESULT.md
            research/extreme_option_pressure_discovery_v2/RESULT.md
            research/late_day_ce_inventory_rebound_v3/RESULT.md
            research/late_day_ce_inventory_rebound_v4_horizon_audit/RESULT.md
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce independent horizon-audit verdict
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("runtime/research/late_day_ce_inventory_rebound_v4_horizon_audit/independent_horizon_audit.json")
          if not path.exists():
              raise SystemExit("Independent horizon audit evidence is missing.")
          payload = json.loads(path.read_text(encoding="utf-8"))
          if payload.get("structural_edge_found_5m_candle_proxy") is not True:
              raise SystemExit(
                  "Independent audit did not establish the five-minute candle-proxy edge."
              )
          if payload.get("v3_publication_status") != "INVALID_EXIT_HORIZON_CONTRACT_MISMATCH":
              raise SystemExit("V3 horizon mismatch was not detected.")
          print(payload["principal_verdict"])
          PY
