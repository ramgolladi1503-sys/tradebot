name: PR718 Temporary Parquet Reader Export

on:
  pull_request:
    branches:
      - research/ce-pe-option-certification-v1
    paths:
      - .github/workflows/pr718-publish-final.yml

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'research/all-strategy-option-pf-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip download --only-binary=:all: --no-deps pyarrow==25.0.0 -d /tmp/wheel
      - uses: actions/upload-artifact@v4
        with:
          name: pr718-pyarrow-cp313
          path: /tmp/wheel/*.whl
          retention-days: 1
