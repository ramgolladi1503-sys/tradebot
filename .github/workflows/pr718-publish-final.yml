name: PR718 Publish Final Canonical Evidence

on:
  push:
    branches:
      - research/all-strategy-option-pf-v1
    paths:
      - .github/workflows/pr718-publish-final.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/all-strategy-option-pf-v1
          fetch-depth: 0
      - name: Install final code and compact evidence
        shell: bash
        run: |
          set -euo pipefail
          bundle_b64="research/option_e2e_recertification_v4/all_strategy_option_pf_campaign_v1/pr718_publication_bundle.tar.gz.b64"
          base64 -d "$bundle_b64" > /tmp/pr718-publication-bundle.tar.gz
          echo "9615ab45a69bde3479b19d402e6f7741cc6f8543597fc30ce221da9e6cb627e6  /tmp/pr718-publication-bundle.tar.gz" | sha256sum -c -
          tar -xzf /tmp/pr718-publication-bundle.tar.gz -C .
          chmod +x scripts/run_expired_option_contract_replay_v1.py scripts/run_canonical_option_intent_campaign_v1.py scripts/run_canonical_all_strategy_expired_option_pf_campaign_v1.py
          rm -f .github/workflows/export-canonical-source-temporary.yml
          rm -f .github/workflows/pr718-publish-final.yml
          rm -f "$bundle_b64"
      - name: Run focused canonical replay tests
        run: PYTHONPATH=. pytest -q tests/research/option_e2e
      - name: Commit final repair and evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(research): publish exact-ATM canonical option replay evidence"
          git push origin HEAD:research/all-strategy-option-pf-v1
