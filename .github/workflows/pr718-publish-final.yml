name: PR718 Temporary Parquet Reader Export

on:
  push:
    branches:
      - research/all-strategy-option-pf-v1
    paths:
      - .github/workflows/pr718-publish-final.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/all-strategy-option-pf-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download wheel
        run: python -m pip download --only-binary=:all: --no-deps pyarrow==25.0.0 -d /tmp/wheel
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: pr718-pyarrow-cp313
          path: /tmp/wheel/*.whl
          retention-days: 1
      - name: Publish run identifier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/option_e2e_recertification_v4/all_strategy_option_pf_campaign_v1/tmp
          printf '%s\n' '${{ github.run_id }}' > research/option_e2e_recertification_v4/all_strategy_option_pf_campaign_v1/tmp/parquet_reader_run_id.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/option_e2e_recertification_v4/all_strategy_option_pf_campaign_v1/tmp/parquet_reader_run_id.txt
          git commit -m 'chore(research): publish temporary parquet reader run id'
          git push origin HEAD:research/all-strategy-option-pf-v1
