name: PR718 Publish Logic Integrity V2

on:
  pull_request:
    branches:
      - research/ce-pe-option-certification-v1
    paths:
      - .github/workflows/pr718-publish-final.yml

permissions:
  contents: write

jobs:
  publish:
    if: github.head_ref == 'research/all-strategy-option-pf-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/all-strategy-option-pf-v1
          fetch-depth: 0

      - name: Install hash-verified logic-integrity repair
        shell: bash
        run: |
          set -euo pipefail
          parts="research/option_e2e_recertification_v4/all_strategy_option_pf_campaign_v1/pr718_logic_integrity_parts"
          cat "$parts"/part_* > /tmp/pr718-logic-integrity.tar.gz.b64
          base64 -d /tmp/pr718-logic-integrity.tar.gz.b64 > /tmp/pr718-logic-integrity.tar.gz
          echo "32a4b4d6e3d2b23a1a5206f802c960b1087dc219b23c23d664ca692ab7642b85  /tmp/pr718-logic-integrity.tar.gz" | sha256sum -c -
          tar -xzf /tmp/pr718-logic-integrity.tar.gz -C .
          chmod +x scripts/run_expired_option_contract_replay_v1.py

          rm -f .github/workflows/export-canonical-source-temporary.yml
          rm -f .github/workflows/pr718-publish-final.yml
          rm -f research/option_e2e_recertification_v4/all_strategy_option_pf_campaign_v1/pr718_publication_bundle.tar.gz.b64
          rm -rf research/option_e2e_recertification_v4/all_strategy_option_pf_campaign_v1/pr718_publication_parts
          rm -rf research/option_e2e_recertification_v4/all_strategy_option_pf_campaign_v1/pr718_logic_integrity_parts
          rm -rf research/option_e2e_recertification_v4/kite_underlying_directional_edge_campaign_v1/temporary_source_export

      - name: Run focused logic-integrity tests
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. pytest -q \
            tests/research/option_e2e/test_expired_option_replay_v1.py \
            tests/research/option_e2e/test_expired_option_replay_authority_v1.py \
            tests/research/option_e2e/test_canonical_underlying_adapter.py \
            tests/research/option_e2e/test_underlying_corpus_semantics_v1.py \
            tests/research/option_e2e/test_canonical_option_intent_campaign_v1.py \
            2>&1 | tee /tmp/pr718-logic-integrity-tests.log
          test_status=${PIPESTATUS[0]}
          if [[ $test_status -eq 0 ]]; then
            git diff --check 2>&1 | tee -a /tmp/pr718-logic-integrity-tests.log
            test_status=${PIPESTATUS[0]}
          fi
          exit $test_status

      - name: Upload diagnostic test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr718-logic-integrity-test-log-${{ github.sha }}
          path: /tmp/pr718-logic-integrity-tests.log
          if-no-files-found: error
          retention-days: 1

      - name: Commit repaired replay code and evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(research): repair and rerun canonical option translation"
          git push origin HEAD:research/all-strategy-option-pf-v1
