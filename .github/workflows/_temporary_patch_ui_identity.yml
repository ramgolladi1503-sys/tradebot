name: Temporary Patch Runtime Authority UI Identity

on:
  push:
    branches:
      - post-pr763/runtime-authority-cutover-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: post-pr763/runtime-authority-cutover-v1
          fetch-depth: 0
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply exact UI identity patch
        run: python tools/_temporary_patch_ui_identity.py

      - name: Verify exact changed scope
        run: |
          python - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          expected = {'dashboard/ui/table_model.py'}
          if changed != expected:
              raise SystemExit(f'UI_IDENTITY_SCOPE_MISMATCH:{sorted(changed)}')
          print('UI identity scope verified')
          PY

      - name: Commit patch and remove temporary machinery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/_temporary_patch_ui_identity.yml \
            tools/_temporary_patch_ui_identity.py
          git add dashboard/ui/table_model.py
          git commit -m "fix: preserve candidate identity in authority UI rows"
          git push origin HEAD:post-pr763/runtime-authority-cutover-v1
