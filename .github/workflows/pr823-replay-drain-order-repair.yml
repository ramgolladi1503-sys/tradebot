name: PR823 Replay Drain Order Repair

on:
  push:
    branches:
      - repair/pr818-green-integration-v1
    paths:
      - .github/workflows/pr823-replay-drain-order-repair.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: .
      DATA_ROOT: ${{ github.workspace }}/.runtime
      KITE_USE_API: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/pr818-green-integration-v1
          fetch-depth: 1
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install 'pandas<3.0'

      - name: Apply narrow replay drain repair
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/run_feed_robustness_replay.py')
          text = path.read_text(encoding='utf-8')
          old = '''        if pressure_controller is not None and pressure_controller.enabled:\n            pressure_controller._record_queue_event("producer_completed", scenario=scenario, rows_produced=len(rows))\n            pressure_controller.record_worker_event("shutdown_started", scenario=scenario)\n        else:\n            tick_store.flush_pending_ticks()\n        shutdown_result = tick_store.shutdown_persistence_worker(deadline_seconds=shutdown_deadline_seconds)\n'''
          new = '''        if pressure_controller is not None and pressure_controller.enabled:\n            pressure_controller._record_queue_event("producer_completed", scenario=scenario, rows_produced=len(rows))\n            pressure_controller.record_worker_event("shutdown_started", scenario=scenario)\n        # Use shutdown as the sole async drain authority. Calling the public flush\n        # concurrently with the persistence worker creates two queue consumers;\n        # batches can then commit in a different order even though dequeue order is\n        # FIFO. The governed shutdown path stops acceptance, drains, and joins the\n        # worker without introducing that replay-only race.\n        shutdown_result = tick_store.shutdown_persistence_worker(deadline_seconds=shutdown_deadline_seconds)\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one repair target, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify focused replay robustness contract
        run: |
          pytest -q -o addopts='' \
            tests/test_feed_robustness_replay_runner.py::test_pressure_profile_preserves_checksums_with_and_without_delay
          pytest -q -o addopts='' tests/test_feed_robustness_replay_runner.py
          git diff --check

      - name: Commit only verified replay repair and remove temporary workflow
        run: |
          git config user.name "tradebot-ci-repair"
          git config user.email "tradebot-ci-repair@users.noreply.github.com"
          git rm .github/workflows/pr823-replay-drain-order-repair.yml
          git add scripts/run_feed_robustness_replay.py
          staged="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/pr823-replay-drain-order-repair.yml' 'scripts/run_feed_robustness_replay.py' | sort)"
          test "$staged" = "$expected"
          git diff --cached --check
          git commit -m "fix: serialize replay async drain ordering"
          git push origin HEAD:repair/pr818-green-integration-v1
