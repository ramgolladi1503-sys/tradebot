name: VWAP Auction State V1

on:
  pull_request:
    paths:
      - "research/vwap_auction_state_v1/**"
      - "tests/research/test_vwap_auction_state_v1.py"
      - "tests/research/test_vwap_auction_state_backtest_v1.py"
      - "docs/agent_reviews/vwap_auction_state_v1.md"
      - ".github/workflows/vwap-auction-state-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - name: Compile research formula
        run: >-
          python -m py_compile
          research/vwap_auction_state_v1/model.py
          research/vwap_auction_state_v1/backtest.py
      - name: Focused invariant tests
        run: >-
          python -m pytest -q -o addopts=''
          tests/research/test_vwap_auction_state_v1.py
          tests/research/test_vwap_auction_state_backtest_v1.py
