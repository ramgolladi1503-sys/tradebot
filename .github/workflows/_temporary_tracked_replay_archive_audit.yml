name: Temporary Tracked Replay Archive Audit

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  audit-tracked-replay-archive:
    if: github.head_ref == 'research/tracked-replay-archive-source-audit-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run focused archive audit tests
        run: pytest -q tests/research/option_e2e/test_tracked_replay_archive_audit_v1.py

      - name: Build independent evidence twice
        run: |
          set -euo pipefail
          rm -rf /tmp/tracked-replay-audit-a /tmp/tracked-replay-audit-b
          python -m research.option_e2e_recertification_v4.tracked_replay_archive_audit_v1.build_evidence \
            --archive runtime/upstox_candidate_replay.zip \
            --output-dir /tmp/tracked-replay-audit-a
          python -m research.option_e2e_recertification_v4.tracked_replay_archive_audit_v1.build_evidence \
            --archive runtime/upstox_candidate_replay.zip \
            --output-dir /tmp/tracked-replay-audit-b
          diff -ru /tmp/tracked-replay-audit-a /tmp/tracked-replay-audit-b

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: tracked-replay-archive-source-audit-v1
          path: /tmp/tracked-replay-audit-a
          if-no-files-found: error
          retention-days: 7
