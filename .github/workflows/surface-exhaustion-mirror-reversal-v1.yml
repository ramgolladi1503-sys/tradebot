name: Surface Exhaustion Mirror Reversal V1

on:
  workflow_dispatch:
  push:
    branches:
      - research/surface-exhaustion-mirror-reversal-v1
    paths:
      - 'scripts/run_surface_exhaustion_mirror_reversal_v1.py'
      - 'tests/research/test_surface_exhaustion_mirror_reversal_v1.py'
      - '.github/workflows/surface-exhaustion-mirror-reversal-v1.yml'
  pull_request:
    paths:
      - 'scripts/run_surface_exhaustion_mirror_reversal_v1.py'
      - 'tests/research/test_surface_exhaustion_mirror_reversal_v1.py'
      - '.github/workflows/surface-exhaustion-mirror-reversal-v1.yml'

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository pointers
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Materialize preserved event universe
        run: |
          git lfs install
          git lfs pull \
            --include='research/local_evidence_consolidation_v1/worktrees/reverse-causal-option-expansion-v1/runtime_research/reverse_causal_option_expansion_v1/event_universe_5m.parquet' \
            --exclude=''
          target='research/local_evidence_consolidation_v1/worktrees/reverse-causal-option-expansion-v1/runtime_research/reverse_causal_option_expansion_v1/event_universe_5m.parquet'
          test -f "$target"
          if head -c 80 "$target" | grep -q 'version https://git-lfs.github.com/spec'; then
            echo 'Unresolved Git LFS pointer.' >&2
            exit 1
          fi
          test "$(stat -c%s "$target")" -gt 90000000
          sha256sum "$target"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy pyarrow pytest

      - name: Run focused causal and governance tests
        run: |
          python -m pytest -q tests/research/test_surface_exhaustion_mirror_reversal_v1.py

      - name: Run frozen OOF and validation campaign
        run: |
          python -m scripts.run_surface_exhaustion_mirror_reversal_v1 --repo-root "$GITHUB_WORKSPACE"

      - name: Verify sealed master holdout and safety boundaries
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('runtime/research/surface_exhaustion_mirror_reversal_v1/final_decision.json')
          if not path.exists():
              raise SystemExit('Final decision missing.')
          payload = json.loads(path.read_text(encoding='utf-8'))
          if payload.get('master_holdout_outcomes_materialized') is not False:
              raise SystemExit('Master holdout was opened by discovery runner.')
          if payload.get('master_holdout_status') != 'SEALED_FOR_CROSS_FAMILY_FINAL_CERTIFICATION':
              raise SystemExit('Master holdout status is not sealed.')
          if payload.get('paper_or_live_authorized') is not False:
              raise SystemExit('Paper/live authorization detected.')
          if payload.get('allowed_for_live_execution') is not False:
              raise SystemExit('Live execution authorization detected.')
          print(payload['principal_verdict'])
          PY

      - name: Upload complete research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surface-exhaustion-mirror-reversal-v1
          path: |
            runtime/research/surface_exhaustion_mirror_reversal_v1/**
            research/surface_exhaustion_mirror_reversal_v1/**
          if-no-files-found: error
          retention-days: 30
