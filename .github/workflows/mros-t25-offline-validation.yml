name: MROS T25 Offline Validation

on:
  pull_request:
    branches:
      - research/t25-offline-validation-base-20260818
  workflow_dispatch:

permissions:
  contents: read

jobs:
  t25_offline_validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head with full history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact candidate binding
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "$EXPECTED_HEAD"
          echo "T25_CANDIDATE_SHA=$ACTUAL"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused test dependency
        run: python -m pip install pytest

      - name: Run T25 focused and freshness gates
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q -o addopts='' \
            tests/research/test_mros_evaluation.py \
            tests/test_evidence_freshness.py

      - name: Reassert separate trading authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from research.mros_certification.evaluation import trading_integration_decision
          candidate = "a" * 40
          result = trading_integration_decision(candidate_sha=candidate)
          assert result["broker_write_authority"] is False
          assert result["order_authority"] is False
          assert result["paper_authorized"] is False
          assert result["live_authorized"] is False
          print("T25_EXECUTION_AUTHORITY=false")
          PY
