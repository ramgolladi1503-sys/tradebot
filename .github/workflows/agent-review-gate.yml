name: Agent Review Evidence Gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  agent-review-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch current base and exact candidate
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags --prune origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr-${PR_NUMBER}-head
          test "$(git rev-parse refs/remotes/origin/pr-${PR_NUMBER}-head)" = "$HEAD_SHA"

      - name: Validate agent review evidence
        env:
          AGENT_REVIEW_BASE_REF: origin/main
          AGENT_REVIEW_CANDIDATE_REF: refs/remotes/origin/pr-${{ github.event.pull_request.number }}-head
        run: python scripts/validate_agent_review_evidence.py --base-ref "$AGENT_REVIEW_BASE_REF" --candidate-ref "$AGENT_REVIEW_CANDIDATE_REF"
