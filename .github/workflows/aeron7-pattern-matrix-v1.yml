name: Aeron7 Pattern Matrix v1

on:
  push:
    branches:
      - research/aeron7-pattern-matrix-v1
    paths:
      - research/aeron7_pattern_matrix_v1.py
      - .github/workflows/aeron7-pattern-matrix-v1.yml
  pull_request:
    branches:
      - main
    paths:
      - research/aeron7_pattern_matrix_v1.py
      - .github/workflows/aeron7-pattern-matrix-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check pandas==2.2.3 numpy==2.1.3

      - name: Pull Aeron7 data and compute matrix
        run: python research/aeron7_pattern_matrix_v1.py --output runtime/research/aeron7-pattern-matrix-v1

      - name: Upload data and matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aeron7-index-data-and-pattern-matrix
          path: runtime/research/aeron7-pattern-matrix-v1
          if-no-files-found: warn
          retention-days: 30
