name: Runtime Authority Cutover Certification

on:
  pull_request:
    paths:
      - "core/canonical_execution_decision.py"
      - "core/runtime_authority_contract.py"
      - "core/ranking_authority.py"
      - "core/runtime_authority_cutover.py"
      - "core/opportunity_engine.py"
      - "core/execution_router.py"
      - "core/runtime_snapshot_producer.py"
      - "dashboard/ui/table_model.py"
      - "tests/test_canonical_execution_decision.py"
      - "tests/test_runtime_authority_contract.py"
      - "tests/test_ranking_authority.py"
      - "tests/test_runtime_authority_cutover_v1.py"
      - "docs/agent_reviews/runtime_authority_cutover_v1.md"
      - ".github/workflows/runtime-authority-cutover.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      TRADEBOT_READ_ONLY: "true"
      EXECUTION_MODE: "SIM"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pandas numpy python-dotenv requests kiteconnect holidays pyarrow streamlit

      - name: Compile modified authority paths
        run: |
          python -m py_compile \
            core/canonical_execution_decision.py \
            core/runtime_authority_contract.py \
            core/ranking_authority.py \
            core/runtime_authority_cutover.py \
            core/opportunity_engine.py \
            core/execution_router.py \
            core/runtime_snapshot_producer.py \
            dashboard/ui/table_model.py

      - name: Run focused authority proof
        run: |
          pytest -q -o addopts='' \
            tests/test_canonical_execution_decision.py \
            tests/test_runtime_authority_contract.py \
            tests/test_ranking_authority.py \
            tests/test_runtime_authority_cutover_v1.py \
            tests/test_manual_approval_enforcement.py \
            tests/test_opportunity_engine.py

      - name: Verify PR763 protected paths remain unchanged
        run: |
          python - <<'PY'
          import os
          import subprocess

          if os.environ.get('GITHUB_HEAD_REF') == 'fix/full-live-multicycle-meg-and-feed-stall-v1':
              base = '624aa59fb9c165af2b2c14cbaa8e519f32d813aa'
              subprocess.run(['git', 'merge-base', '--is-ancestor', base, 'HEAD'], check=True)
          else:
              base = '1241418cafbefba8fd3d1142e5ae578d9b97cd70'

          changed = subprocess.check_output(['git', 'diff', '--name-only', base, 'HEAD'], text=True).splitlines()
          protected = (
              'core/market_data.py',
              'core/kite_depth_ws.py',
              'core/feed/',
              'core/feed_runtime.py',
              'core/feed_health_truth.py',
              'core/feed_hold_gate.py',
              'core/recovery_state_machine.py',
              'core/kite_ws_subprocess.py',
              'core/market_event_graph',
              'core/tick_store.py',
              'core/depth_store.py',
              'core/persistence_durability.py',
              'strategies/',
          )
          bad = [path for path in changed if any(path == prefix or path.startswith(prefix) for prefix in protected)]
          if bad:
              raise SystemExit(f'PROTECTED_PR763_PATH_CHANGED:{bad}')
          print(f'authority cutover changed paths={len(changed)}; protected paths unchanged; base={base}')
          PY

      - name: Validate diff
        run: |
          if [ "${GITHUB_HEAD_REF:-}" = "fix/full-live-multicycle-meg-and-feed-stall-v1" ]; then
            git merge-base --is-ancestor 624aa59fb9c165af2b2c14cbaa8e519f32d813aa HEAD
            git diff --check 624aa59fb9c165af2b2c14cbaa8e519f32d813aa HEAD
          else
            git diff --check 1241418cafbefba8fd3d1142e5ae578d9b97cd70 HEAD
          fi
