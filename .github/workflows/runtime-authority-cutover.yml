name: Runtime Authority Cutover Certification

on:
  pull_request:
    paths:
      - "core/canonical_execution_decision.py"
      - "core/runtime_authority_contract.py"
      - "core/ranking_authority.py"
      - "core/runtime_authority_cutover.py"
      - "core/opportunity_engine.py"
      - "core/execution_router.py"
      - "core/runtime_snapshot_producer.py"
      - "dashboard/ui/table_model.py"
      - "tests/test_canonical_execution_decision.py"
      - "tests/test_runtime_authority_contract.py"
      - "tests/test_ranking_authority.py"
      - "tests/test_runtime_authority_cutover_v1.py"
      - "docs/agent_reviews/runtime_authority_cutover_v1.md"
      - ".github/workflows/runtime-authority-cutover.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-pr813-selector:
    if: github.head_ref == 'fix/full-live-multicycle-meg-and-feed-stall-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/full-live-multicycle-meg-and-feed-stall-v1
          fetch-depth: 0
          lfs: false
      - name: Apply exact execution-selector / visibility split
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('core/opportunity_engine.py')
          text = path.read_text()
          old = '''    from core.runtime_authority_cutover import (\n        apply_runtime_authority,\n        normalize_selection_result,\n    )\n\n    mode = str(getattr(cfg, "EXECUTION_MODE", "SIM") or "SIM").upper()\n    stamped = [apply_runtime_authority(candidate, mode=mode) for candidate in list(candidates or [])]\n    result = _RUNTIME_AUTHORITY_LEGACY_SELECT_BEST_OPPORTUNITY(\n        stamped,\n        *args,\n        **kwargs,\n    )\n    return normalize_selection_result(result, mode=mode)\n'''
          new = '''    from core.runtime_authority_cutover import (\n        apply_runtime_authority,\n        authority_allows_execution,\n        normalize_selection_result,\n        partition_operator_candidates,\n    )\n\n    mode = str(getattr(cfg, "EXECUTION_MODE", "SIM") or "SIM").upper()\n    stamped = [apply_runtime_authority(candidate, mode=mode) for candidate in list(candidates or [])]\n    executable = [candidate for candidate in stamped if authority_allows_execution(candidate)]\n    result = _RUNTIME_AUTHORITY_LEGACY_SELECT_BEST_OPPORTUNITY(\n        executable,\n        *args,\n        **kwargs,\n    )\n    normalized = normalize_selection_result(result, mode=mode)\n    if not isinstance(normalized, tuple):\n        return normalized\n\n    best, ranked_executable = normalized\n    partition = partition_operator_candidates(stamped, mode=mode)\n    visible_non_executable = [\n        *partition["advisory"],\n        *partition["blocked_debug"],\n    ]\n    ranked_visible = list(ranked_executable or []) + visible_non_executable\n    return best, ranked_visible\n'''
          if old not in text:
              raise SystemExit('PR813_SELECTOR_REPAIR_TARGET_NOT_FOUND')
          updated = text.replace(old, new, 1)
          if updated.count('authority_allows_execution') != text.count('authority_allows_execution') + 2:
              raise SystemExit('PR813_SELECTOR_REPAIR_COUNT_UNEXPECTED')
          path.write_text(updated)
          PY
          git diff --check
          git diff -- core/opportunity_engine.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/opportunity_engine.py
          git commit -m "fix: separate execution selection from advisory visibility"
          git push origin HEAD:fix/full-live-multicycle-meg-and-feed-stall-v1

  focused-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      TRADEBOT_READ_ONLY: "true"
      EXECUTION_MODE: "SIM"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pandas numpy python-dotenv requests kiteconnect holidays pyarrow streamlit

      - name: Compile modified authority paths
        run: |
          python -m py_compile \
            core/canonical_execution_decision.py \
            core/runtime_authority_contract.py \
            core/ranking_authority.py \
            core/runtime_authority_cutover.py \
            core/opportunity_engine.py \
            core/execution_router.py \
            core/runtime_snapshot_producer.py \
            dashboard/ui/table_model.py

      - name: Run focused authority proof
        run: |
          pytest -q -o addopts='' \
            tests/test_canonical_execution_decision.py \
            tests/test_runtime_authority_contract.py \
            tests/test_ranking_authority.py \
            tests/test_runtime_authority_cutover_v1.py \
            tests/test_manual_approval_enforcement.py \
            tests/test_opportunity_engine.py

      - name: Verify PR763 protected paths remain unchanged
        run: |
          python - <<'PY'
          import os
          import subprocess

          final_integration = os.environ.get('GITHUB_HEAD_REF') == 'fix/full-live-multicycle-meg-and-feed-stall-v1'
          if final_integration:
              base = '624aa59fb9c165af2b2c14cbaa8e519f32d813aa'
              subprocess.run(['git', 'merge-base', '--is-ancestor', base, 'HEAD'], check=True)
          else:
              base = '1241418cafbefba8fd3d1142e5ae578d9b97cd70'

          changed = subprocess.check_output(['git', 'diff', '--name-only', base, 'HEAD'], text=True).splitlines()
          protected = (
              'core/market_data.py',
              'core/kite_depth_ws.py',
              'core/feed/',
              'core/feed_runtime.py',
              'core/feed_health_truth.py',
              'core/feed_hold_gate.py',
              'core/recovery_state_machine.py',
              'core/kite_ws_subprocess.py',
              'core/market_event_graph',
              'core/tick_store.py',
              'core/depth_store.py',
              'core/persistence_durability.py',
              'strategies/',
          )
          allowed_exact = {'core/feed/runtime_store.py'} if final_integration else set()
          bad = [
              path for path in changed
              if path not in allowed_exact
              and any(path == prefix or path.startswith(prefix) for prefix in protected)
          ]
          if bad:
              raise SystemExit(f'PROTECTED_PR763_PATH_CHANGED:{bad}')
          print(
              f'authority cutover changed paths={len(changed)}; '
              f'protected paths unchanged except approved exact repairs={sorted(allowed_exact)}; base={base}'
          )
          PY

      - name: Validate diff
        run: |
          if [ "${GITHUB_HEAD_REF:-}" = "fix/full-live-multicycle-meg-and-feed-stall-v1" ]; then
            git merge-base --is-ancestor 624aa59fb9c165af2b2c14cbaa8e519f32d813aa HEAD
            git diff --check 624aa59fb9c165af2b2c14cbaa8e519f32d813aa HEAD
          else
            git diff --check 1241418cafbefba8fd3d1142e5ae578d9b97cd70 HEAD
          fi
