name: Runtime Authority Cutover Certification

on:
  pull_request:
    paths:
      - "core/canonical_execution_decision.py"
      - "core/runtime_authority_contract.py"
      - "core/ranking_authority.py"
      - "core/runtime_authority_cutover.py"
      - "core/opportunity_engine.py"
      - "core/execution_router.py"
      - "core/runtime_snapshot_producer.py"
      - "dashboard/ui/table_model.py"
      - "tests/test_canonical_execution_decision.py"
      - "tests/test_runtime_authority_contract.py"
      - "tests/test_ranking_authority.py"
      - "tests/test_runtime_authority_cutover_v1.py"
      - "docs/agent_reviews/runtime_authority_cutover_v1.md"
      - ".github/workflows/runtime-authority-cutover.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  focused-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      TRADEBOT_READ_ONLY: "true"
      EXECUTION_MODE: "SIM"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Fetch current base and exact candidate
        run: |
          git fetch --no-tags --prune origin \
            +refs/heads/main:refs/remotes/origin/main \
            "$HEAD_SHA"
          git update-ref refs/remotes/origin/pr-head "$HEAD_SHA"
          test "$(git rev-parse refs/remotes/origin/pr-head)" = "$HEAD_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pandas numpy python-dotenv requests kiteconnect holidays pyarrow streamlit

      - name: Compile modified authority paths
        run: |
          python -m py_compile \
            core/canonical_execution_decision.py \
            core/runtime_authority_contract.py \
            core/ranking_authority.py \
            core/runtime_authority_cutover.py \
            core/opportunity_engine.py \
            core/execution_router.py \
            core/runtime_snapshot_producer.py \
            dashboard/ui/table_model.py

      - name: Run focused authority proof
        run: |
          pytest -q -o addopts='' \
            tests/test_canonical_execution_decision.py \
            tests/test_runtime_authority_contract.py \
            tests/test_ranking_authority.py \
            tests/test_runtime_authority_cutover_v1.py \
            tests/test_manual_approval_enforcement.py \
            tests/test_opportunity_engine.py

      - name: Verify governed high-risk path scope
        run: |
          python scripts/validate_runtime_authority_scope.py \
            --base-ref origin/main \
            --candidate-ref refs/remotes/origin/pr-head

      - name: Validate diff
        run: |
          candidate_ref=refs/remotes/origin/pr-head
          merge_base="$(git merge-base "$candidate_ref" origin/main)"
          python scripts/validate_frozen_head_diff.py "$merge_base" "$candidate_ref"
