name: observation-first-pattern-atlas-execution-v1

on:
  workflow_dispatch:
  push:
    branches:
      - research/observation-first-pattern-atlas-v1
    paths:
      - "scripts/run_observation_first_pattern_atlas_*.py"
      - "tests/test_observation_first_pattern_atlas_*.py"
      - "research/observation_first_pattern_atlas_v1/**"
      - ".github/workflows/observation-first-pattern-atlas-execution-v1.yml"
  pull_request:
    branches:
      - main
    paths:
      - "scripts/run_observation_first_pattern_atlas_*.py"
      - "tests/test_observation_first_pattern_atlas_*.py"
      - "research/observation_first_pattern_atlas_v1/**"
      - ".github/workflows/observation-first-pattern-atlas-execution-v1.yml"

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  execute-atlas:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout without broad LFS hydration
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Pull only observation evidence
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull \
            --include="research/local_evidence_consolidation_v1/**/constituent_index_5m.parquet" \
            --exclude=""

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
          cache: pip

      - name: Install pinned certification dependencies
        run: |
          python -m pip install --upgrade "pip==26.2.1"
          python -m pip install \
            "numpy==2.5.1" \
            "pandas==3.0.5" \
            "scipy==1.18.0" \
            "pyarrow==25.0.0" \
            "scikit-learn==1.9.0" \
            "pytest==9.1.1"

      - name: Record canonical execution environment
        run: |
          mkdir -p runtime/research/observation_first_pattern_atlas_v1
          python - <<'PY'
          import json, platform, sys
          import numpy, pandas, scipy, pyarrow, sklearn, pytest
          payload = {
              "python": sys.version,
              "platform": platform.platform(),
              "numpy": numpy.__version__,
              "pandas": pandas.__version__,
              "scipy": scipy.__version__,
              "pyarrow": pyarrow.__version__,
              "scikit_learn": sklearn.__version__,
              "pytest": pytest.__version__,
              "PYTHONHASHSEED": "0",
              "OMP_NUM_THREADS": "1",
              "OPENBLAS_NUM_THREADS": "1",
              "MKL_NUM_THREADS": "1",
              "NUMEXPR_NUM_THREADS": "1",
              "authority": "CANONICAL_PATTERN_ATLAS_CERTIFICATION_ENVIRONMENT_V1",
          }
          with open("runtime/research/observation_first_pattern_atlas_v1/certification_environment.json", "w") as f:
              json.dump(payload, f, indent=2, sort_keys=True)
              f.write("\n")
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Run focused governance tests
        run: |
          python -m pytest -q \
            tests/test_observation_first_pattern_atlas_inventory_v1.py \
            tests/test_observation_first_pattern_atlas_deduplicate_inventory_v1.py \
            tests/test_observation_first_pattern_atlas_trajectory_v1.py \
            tests/test_observation_first_pattern_atlas_index_trajectory_v2.py \
            tests/test_observation_first_pattern_atlas_external_index_trajectory_v3.py \
            tests/test_observation_first_pattern_atlas_archetypes_v1.py \
            tests/test_observation_first_pattern_atlas_motifs_v1.py \
            tests/test_observation_first_pattern_atlas_analogues_v1.py \
            tests/test_observation_first_pattern_atlas_motif_recertification_v2.py \
            tests/test_observation_first_pattern_atlas_full_certification_v1.py

      - name: Inventory physical corpus
        run: |
          python scripts/run_observation_first_pattern_atlas_inventory_v1.py \
            --repo-root . \
            --search-root research/local_evidence_consolidation_v1 \
            --output-root runtime/research/observation_first_pattern_atlas_v1/inventory

      - name: Deduplicate identical physical evidence
        run: |
          python scripts/run_observation_first_pattern_atlas_deduplicate_inventory_v1.py \
            --inventory-json runtime/research/observation_first_pattern_atlas_v1/inventory/corpus_inventory.json \
            --output-json runtime/research/observation_first_pattern_atlas_v1/inventory/corpus_inventory_deduplicated.json \
            --duplicate-report runtime/research/observation_first_pattern_atlas_v1/inventory/duplicate_sources.json

      - name: Build authoritative NIFTY trajectory
        run: |
          python scripts/run_observation_first_pattern_atlas_index_trajectory_v2.py \
            --repo-root . \
            --inventory-json runtime/research/observation_first_pattern_atlas_v1/inventory/corpus_inventory_deduplicated.json \
            --index-symbol NIFTY \
            --output-root runtime/research/observation_first_pattern_atlas_v1/index_trajectory_v2

      - name: Freeze authoritative NIFTY day archetypes
        run: |
          python scripts/run_observation_first_pattern_atlas_archetypes_v1.py \
            --trajectory-vectors runtime/research/observation_first_pattern_atlas_v1/index_trajectory_v2/completed_session_vectors.json \
            --output-root runtime/research/observation_first_pattern_atlas_v1/index_archetypes_v2

      - name: Freeze legacy native-cadence motifs for superseded comparison
        run: |
          python scripts/run_observation_first_pattern_atlas_motifs_v1.py \
            --causal-trajectory runtime/research/observation_first_pattern_atlas_v1/index_trajectory_v2/causal_minute_trajectory.parquet \
            --instrument NIFTY \
            --output-root runtime/research/observation_first_pattern_atlas_v1/native_motifs_v1

      - name: Recertify motifs on trajectory-accepted sessions only
        run: |
          python scripts/run_observation_first_pattern_atlas_motif_recertification_v2.py \
            --source-file research/local_evidence_consolidation_v1/external_local_dirs/tradebot-ml-evidence/constituent-lead-lag-data-v1/proxy_campaign_2024_2025_v2/normalized/constituent_index_5m.parquet \
            --previous-motif-catalog runtime/research/observation_first_pattern_atlas_v1/native_motifs_v1/native_motif_catalog.json \
            --output-root runtime/research/observation_first_pattern_atlas_v1/native_motifs_v2

      - name: Freeze PRE-CAS matched geometric analogues from recertified motifs
        run: |
          python scripts/run_observation_first_pattern_atlas_analogues_v2.py \
            --source-file research/local_evidence_consolidation_v1/external_local_dirs/tradebot-ml-evidence/constituent-lead-lag-data-v1/proxy_campaign_2024_2025_v2/normalized/constituent_index_5m.parquet \
            --motif-catalog runtime/research/observation_first_pattern_atlas_v1/native_motifs_v2/native_motif_catalog_v2.json \
            --output-root runtime/research/observation_first_pattern_atlas_v1/matched_analogues_v2

      - name: Execute Pattern Atlas stages 5 through 14
        run: |
          python scripts/run_observation_first_pattern_atlas_full_certification_v1.py \
            --source-file research/local_evidence_consolidation_v1/external_local_dirs/tradebot-ml-evidence/constituent-lead-lag-data-v1/proxy_campaign_2024_2025_v2/normalized/constituent_index_5m.parquet \
            --motif-catalog runtime/research/observation_first_pattern_atlas_v1/native_motifs_v2/native_motif_catalog_v2.json \
            --analogue-catalog runtime/research/observation_first_pattern_atlas_v1/matched_analogues_v2/matched_geometric_analogue_catalog.json \
            --option-data-root runtime/strategy_validation \
            --output-root runtime/research/observation_first_pattern_atlas_v1/full_certification_v1

      - name: Remove large causal intermediate after downstream certification
        if: always()
        run: |
          rm -f runtime/research/observation_first_pattern_atlas_v1/index_trajectory_v2/causal_minute_trajectory.parquet

      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observation-first-pattern-atlas-full-certification-v5-canonical
          path: runtime/research/observation_first_pattern_atlas_v1/
          if-no-files-found: warn
