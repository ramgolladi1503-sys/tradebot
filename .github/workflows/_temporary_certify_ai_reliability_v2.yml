name: Temporary Certify AI Reliability V2

on:
  push:
    branches:
      - post-pr763/ai-reliability-live-evidence-v2

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONPATH: .
      TRADEBOT_READ_ONLY: "true"
      EXECUTION_MODE: "SIM"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: post-pr763/ai-reliability-live-evidence-v2
          fetch-depth: 0
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Record tested head and remove temporary machinery
        run: |
          git rev-parse HEAD > /tmp/ai-reliability-tested-head.txt
          git rm \
            .github/workflows/_temporary_certify_ai_reliability_v2.yml \
            tools/_trigger_certify_ai_reliability_v2.txt

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            pytest pandas numpy pyarrow scikit-learn streamlit \
            python-dotenv openai requests kiteconnect holidays

      - name: Compile reliability sidecar
        id: compile
        continue-on-error: true
        run: |
          set -o pipefail
          python -m compileall -q core/ai_reliability_agent 2>&1 | tee /tmp/ai-reliability-compile.log
          python -m py_compile \
            scripts/run_ai_reliability_agent.py \
            scripts/run_ai_reliability_historical_replay.py \
            scripts/run_ai_reliability_historical_candle_replay.py \
            scripts/run_ai_reliability_pr763_session.py \
            2>&1 | tee -a /tmp/ai-reliability-compile.log

      - name: Run focused component and evidence proof
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          pytest -q -o addopts='' tests/test_ai_reliability*.py \
            2>&1 | tee /tmp/ai-reliability-tests.log

      - name: Verify certified PR771 authority evidence
        id: authority
        continue-on-error: true
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee /tmp/ai-reliability-authority.log
          import hashlib, json
          from pathlib import Path

          path = Path('docs/test-reports/runtime_authority_cutover_focused_certification.json')
          payload = json.loads(path.read_text())
          required = {
              'schema_version', 'verdict', 'passed', 'tested_head_sha',
              'pr763_base_sha', 'outcomes', 'read_only',
              'order_authority', 'broker_write_authority',
          }
          missing = sorted(required - set(payload))
          if missing:
              raise SystemExit(f'AUTHORITY_CERT_FIELDS_MISSING:{missing}')
          semantic = {key: payload[key] for key in (
              'schema_version', 'verdict', 'passed', 'tested_head_sha',
              'pr763_base_sha', 'outcomes', 'read_only',
              'order_authority', 'broker_write_authority',
          )}
          actual = hashlib.sha256(
              json.dumps(semantic, sort_keys=True, separators=(',', ':')).encode()
          ).hexdigest()
          if actual != payload.get('semantic_sha256'):
              raise SystemExit('AUTHORITY_CERT_SEMANTIC_HASH_MISMATCH')
          if payload.get('verdict') != 'PASS_RUNTIME_AUTHORITY_CUTOVER_FOCUSED_CERTIFICATION':
              raise SystemExit(f"AUTHORITY_CERT_NOT_PASS:{payload.get('verdict')}")
          if payload.get('passed') is not True:
              raise SystemExit('AUTHORITY_CERT_PASSED_FALSE')
          if payload.get('read_only') is not True:
              raise SystemExit('AUTHORITY_CERT_NOT_READ_ONLY')
          if payload.get('order_authority') is not False or payload.get('broker_write_authority') is not False:
              raise SystemExit('AUTHORITY_CERT_WRITE_AUTHORITY_PRESENT')
          print(f"authority_certificate_semantic_sha256={actual}")
          PY

      - name: Verify clean sidecar scope
        id: scope
        continue-on-error: true
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee /tmp/ai-reliability-scope.log
          import subprocess
          base = '5934968bed198e4c80fcb9900b99d2142912b5c4'
          changed = subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only', base], text=True
          ).splitlines()
          allowed = (
              'core/ai_reliability_agent/',
              'scripts/run_ai_reliability',
              'tests/test_ai_reliability',
              'tests/fixtures/ai_reliability_real_artifact/',
              'docs/agent_reviews/ai_reliability',
              'docs/architecture/ai_reliability',
              'docs/test-reports/ai_reliability',
              '.github/workflows/ai-reliability-pr763-certification.yml',
          )
          bad = [path for path in changed if not any(path.startswith(prefix) for prefix in allowed)]
          if bad:
              raise SystemExit(f'RELIABILITY_SCOPE_VIOLATION:{bad}')
          print(f'changed_paths={len(changed)} sidecar_scope_clean=true')
          PY

      - name: Verify tests did not mutate repository state
        id: cleanliness
        continue-on-error: true
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee /tmp/ai-reliability-cleanliness.log
          import subprocess
          status = subprocess.check_output(['git', 'status', '--porcelain'], text=True).splitlines()
          expected_deletions = {
              'D  .github/workflows/_temporary_certify_ai_reliability_v2.yml',
              'D  tools/_trigger_certify_ai_reliability_v2.txt',
          }
          unexpected = [line for line in status if line not in expected_deletions]
          if unexpected:
              raise SystemExit(f'UNEXPECTED_TEST_MUTATION:{unexpected}')
          print('repository_clean_except_expected_self_removals=true')
          PY

      - name: Validate prospective diff
        id: diff
        continue-on-error: true
        run: git diff --cached --check 5934968bed198e4c80fcb9900b99d2142912b5c4 2>&1 | tee /tmp/ai-reliability-diff.log

      - name: Write offline certificate and commit explicit allowlist
        if: always()
        run: |
          mkdir -p docs/test-reports
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          outcomes = {
              'compile': '${{ steps.compile.outcome }}',
              'tests': '${{ steps.tests.outcome }}',
              'authority_certificate': '${{ steps.authority.outcome }}',
              'scope': '${{ steps.scope.outcome }}',
              'cleanliness': '${{ steps.cleanliness.outcome }}',
              'diff': '${{ steps.diff.outcome }}',
          }
          passed = all(value == 'success' for value in outcomes.values())
          payload = {
              'schema_version': 1,
              'verdict': 'IMPLEMENTATION_COMPLETE_LIVE_EVIDENCE_PENDING' if passed else 'FAILED_AI_RELIABILITY_OFFLINE_CERTIFICATION',
              'offline_passed': passed,
              'live_evidence_complete': False,
              'tested_head_sha': Path('/tmp/ai-reliability-tested-head.txt').read_text().strip(),
              'runtime_authority_head_sha': '5934968bed198e4c80fcb9900b99d2142912b5c4',
              'outcomes': outcomes,
              'read_only': True,
              'order_authority': False,
              'broker_write_authority': False,
              'allowed_for_live_execution': False,
              'allowed_for_paper_execution': False,
              'logs': {},
          }
          for name in ('compile', 'tests', 'authority', 'scope', 'cleanliness', 'diff'):
              path = Path(f'/tmp/ai-reliability-{name}.log')
              payload['logs'][name] = path.read_text(errors='replace')[-30000:] if path.exists() else ''
          semantic = {key: payload[key] for key in (
              'schema_version', 'verdict', 'offline_passed',
              'live_evidence_complete', 'tested_head_sha',
              'runtime_authority_head_sha', 'outcomes', 'read_only',
              'order_authority', 'broker_write_authority',
              'allowed_for_live_execution', 'allowed_for_paper_execution',
          )}
          payload['semantic_sha256'] = hashlib.sha256(
              json.dumps(semantic, sort_keys=True, separators=(',', ':')).encode()
          ).hexdigest()
          Path('docs/test-reports/ai_reliability_pr763_offline_certification.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True) + '\n'
          )
          Path('docs/test-reports/ai_reliability_pr763_offline_certification.md').write_text(
              '# AI Reliability PR763 Offline Certification\n\n'
              f"- Verdict: `{payload['verdict']}`\n"
              f"- Offline passed: `{payload['offline_passed']}`\n"
              f"- Live evidence complete: `{payload['live_evidence_complete']}`\n"
              f"- Tested head SHA: `{payload['tested_head_sha']}`\n"
              f"- Semantic SHA-256: `{payload['semantic_sha256']}`\n"
              f"- Read only: `{payload['read_only']}`\n"
              f"- Order authority: `{payload['order_authority']}`\n\n"
              '## Outcomes\n\n' + '\n'.join(
                  f'- `{key}`: `{value}`' for key, value in outcomes.items()
              ) + '\n\n'
              'A fresh governed PR #763 market session is still required before '
              '`PASS_READ_ONLY_POST_MARKET_RELIABILITY` can be emitted.\n'
          )
          PY
          git add \
            docs/test-reports/ai_reliability_pr763_offline_certification.json \
            docs/test-reports/ai_reliability_pr763_offline_certification.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --check
          git commit -m "evidence: certify AI reliability offline stack"
          git push origin HEAD:post-pr763/ai-reliability-live-evidence-v2
