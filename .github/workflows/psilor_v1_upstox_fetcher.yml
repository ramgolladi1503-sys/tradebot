name: PSILOR V1 Upstox Fetcher CI

on:
  push:
    paths:
      - 'scripts/fetch_psilor_v1_data.py'
      - 'tests/test_fetch_psilor_v1_data.py'
      - '.github/workflows/psilor_v1_upstox_fetcher.yml'
  pull_request:
    paths:
      - 'scripts/fetch_psilor_v1_data.py'
      - 'tests/test_fetch_psilor_v1_data.py'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pandas pytz python-dateutil urllib3

      - name: Run Tests
        run: |
          PYTHONPATH=. pytest -v tests/test_fetch_psilor_v1_data.py

      - name: Check compilation
        run: |
          python -m py_compile scripts/fetch_psilor_v1_data.py
