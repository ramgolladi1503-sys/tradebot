name: PSILOR V1 Upstox Fetcher CI

on:
  push:
    paths:
      - 'scripts/fetch_psilor_v1_data.py'
      - 'scripts/smoke_test_psilor_v1.py'
      - 'tests/test_fetch_psilor_v1_data.py'
      - 'docs/agent_reviews/psilor_v1_upstox_fetcher.md'
      - 'research/psilor_v1/upstox_fetch_reuse_matrix.json'
      - '.github/workflows/psilor_v1_upstox_fetcher.yml'
  pull_request:
    paths:
      - 'scripts/fetch_psilor_v1_data.py'
      - 'scripts/smoke_test_psilor_v1.py'
      - 'tests/test_fetch_psilor_v1_data.py'
      - 'docs/agent_reviews/psilor_v1_upstox_fetcher.md'
      - 'research/psilor_v1/upstox_fetch_reuse_matrix.json'
      - '.github/workflows/psilor_v1_upstox_fetcher.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pandas pytz python-dateutil pyarrow
      - name: Run focused behavioral tests
        run: PYTHONPATH=. pytest -q tests/test_fetch_psilor_v1_data.py
      - name: Check compilation
        run: |
          python -m py_compile scripts/fetch_psilor_v1_data.py
          python -m py_compile scripts/smoke_test_psilor_v1.py
      - name: Reject committed secrets
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E 'Bearer [A-Za-z0-9._-]{20,}|UPSTOX_ACCESS_TOKEN=.+' -- \
            scripts/fetch_psilor_v1_data.py scripts/smoke_test_psilor_v1.py \
            tests/test_fetch_psilor_v1_data.py docs/agent_reviews/psilor_v1_upstox_fetcher.md; then
            echo 'Potential secret found in focused files'
            exit 1
          fi

  authenticated-bounded-smoke:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/data/psilor-v1-upstox-fetch-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
      PSILOR_SMOKE_ROOT: ${{ runner.temp }}/psilor-smoke
      PSILOR_SMOKE_RUN_ID: github-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install smoke dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pytz python-dateutil pyarrow requests

      - name: Require repository Upstox secret
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${UPSTOX_ACCESS_TOKEN:-}" ]; then
            echo 'SMOKE_VERDICT=BLOCKED_AUTHENTICATION'
            echo 'UPSTOX_ACCESS_TOKEN repository secret is unavailable to this trusted branch run.'
            exit 1
          fi
          echo 'AUTH_SECRET_AVAILABLE=YES'

      - name: Run five-file authenticated smoke
        run: PYTHONPATH=. python scripts/smoke_test_psilor_v1.py

      - name: Verify exact smoke verdict
        shell: bash
        run: |
          set -euo pipefail
          report="${PSILOR_SMOKE_ROOT}/${PSILOR_SMOKE_RUN_ID}/validation_report.json"
          python - "$report" <<'PY'
          import json
          import sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert report['smoke_verdict'] == 'PASS_BOUNDED_AUTHENTICATED_FETCH_SMOKE'
          assert report['real_future_contracts'] == 1
          assert report['real_ce_contracts'] == 2
          assert report['real_pe_contracts'] == 2
          assert report['real_candle_files'] == 5
          assert len(report['exact_common_sessions']) == 2
          assert report['smoke_hash_reconciliation'] == 'PASS'
          assert report['no_unexpected_files'] is True
          assert report['created_by_current_run'] is True
          assert report['formal_extraction_approved'] is True
          print('SMOKE_VERDICT=PASS_BOUNDED_AUTHENTICATED_FETCH_SMOKE')
          PY

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psilor-authenticated-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/psilor-smoke
          if-no-files-found: ignore
          retention-days: 14
