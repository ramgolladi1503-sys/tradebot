name: observation-first-pattern-atlas-v1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/run_observation_first_pattern_atlas_*.py"
      - "tests/test_observation_first_pattern_atlas_*.py"
      - "research/observation_first_pattern_atlas_v1/**"
      - ".github/workflows/observation-first-pattern-atlas-v1.yml"

permissions:
  contents: read

jobs:
  governance-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy pandas scikit-learn pyarrow
      - name: Run observation-first governance tests
        run: |
          python -m pytest -q \
            tests/test_observation_first_pattern_atlas_inventory_v1.py \
            tests/test_observation_first_pattern_atlas_deduplicate_inventory_v1.py \
            tests/test_observation_first_pattern_atlas_trajectory_v1.py \
            tests/test_observation_first_pattern_atlas_index_trajectory_v2.py \
            tests/test_observation_first_pattern_atlas_archetypes_v1.py
