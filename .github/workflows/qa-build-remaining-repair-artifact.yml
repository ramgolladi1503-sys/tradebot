name: QA Build Remaining Repair Artifact

on:
  pull_request:
    branches:
      - agent/enterprise-qa-foundation-v1

permissions:
  contents: read

concurrency:
  group: qa-build-remaining-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build_and_validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      DATA_ROOT: ${{ github.workspace }}/.runtime
      EXECUTION_MODE: PAPER
      TRADING_MODE: PAPER
      KITE_USE_API: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build deterministic repair bundle
        run: |
          python scripts/build_remaining_whole_tradebot_repairs.py
          python scripts/build_dashboard_runtime_guard_repair.py
          python scripts/build_ranking_tiebreak_repair.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies and scanner
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit

      - name: Run focused ranking archive fallback and dashboard proofs
        run: >-
          PYTHONPATH=. pytest -q -o addopts=''
          tests/qa/test_whole_tradebot_cross_module_truth.py
          tests/qa/test_ranking_tiebreak_determinism.py
          tests/qa/test_remaining_whole_tradebot_security.py
          tests/qa/test_dashboard_operator_truth.py
          tests/test_dashboard_canonical_ranked_source.py
          tests/test_evidence_replay_report.py
          --durations=30

      - name: Scan repaired modules
        run: >-
          bandit -r
          core/opportunity_engine.py
          core/evidence_replay_report.py
          core/reject_shadow.py
          core/analytics/schema.py
          core/candidate_journal.py
          core/expectancy/edge_ranking.py
          core/expectancy/setup_fingerprint.py
          core/intelligence/extractors/hardened_base.py
          core/trade_identity.py
          dashboard/streamlit_app_runtime.py
          dashboard/ui/components.py
          dashboard/ui/table_model.py
          -ll

      - name: Stage exact validated files
        shell: bash
        run: |
          set -euo pipefail
          root=.runtime/qa/remaining_repair_bundle
          rm -rf "$root"
          mkdir -p "$root"

          allowed_files=(
            core/opportunity_engine.py
            core/evidence_replay_report.py
            core/reject_shadow.py
            core/analytics/schema.py
            core/candidate_journal.py
            core/expectancy/edge_ranking.py
            core/expectancy/setup_fingerprint.py
            core/intelligence/extractors/hardened_base.py
            core/trade_identity.py
            dashboard/streamlit_app_runtime.py
            dashboard/ui/components.py
            dashboard/ui/table_model.py
            tests/qa/test_whole_tradebot_cross_module_truth.py
            tests/qa/test_remaining_whole_tradebot_security.py
          )
          required_changed=(
            core/opportunity_engine.py
            core/evidence_replay_report.py
            core/reject_shadow.py
            dashboard/streamlit_app_runtime.py
            tests/qa/test_whole_tradebot_cross_module_truth.py
            tests/qa/test_remaining_whole_tradebot_security.py
          )

          git diff --check
          git diff --name-only -- "${allowed_files[@]}" | sort -u > "$root/files.txt"
          test -s "$root/files.txt"

          for required in "${required_changed[@]}"; do
            grep -Fxq "$required" "$root/files.txt" || {
              echo "required validated repair missing from diff: $required" >&2
              exit 1
            }
          done

          while IFS= read -r file; do
            allowed=false
            for candidate in "${allowed_files[@]}"; do
              if [[ "$file" == "$candidate" ]]; then
                allowed=true
                break
              fi
            done
            [[ "$allowed" == true ]] || {
              echo "unexpected repaired file: $file" >&2
              exit 1
            }
            mkdir -p "$root/$(dirname "$file")"
            cp "$file" "$root/$file"
          done < "$root/files.txt"

          git diff -- "${allowed_files[@]}" > "$root/validated.patch"
          test -s "$root/validated.patch"
          sha256sum "$root/validated.patch" > "$root/validated.patch.sha256"
          while IFS= read -r file; do
            sha256sum "$file"
          done < "$root/files.txt" > "$root/file_sha256s.txt"

      - name: Upload validated repair bundle
        uses: actions/upload-artifact@v4
        with:
          name: remaining-whole-tradebot-repair-bundle
          if-no-files-found: error
          include-hidden-files: true
          path: .runtime/qa/remaining_repair_bundle/
