name: Multi-Event Directional Discovery V1

on:
  push:
    branches:
      - research/causal-market-state-representation-v1
    paths:
      - 'scripts/run_multievent_directional_discovery_v1.py'
      - '.github/workflows/multievent-directional-discovery-v1.yml'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: research/causal-market-state-representation-v1
          path: feature

      - name: Checkout consolidated evidence
        uses: actions/checkout@v4
        with:
          ref: main
          path: evidence
          lfs: true
          sparse-checkout: |
            research/local_evidence_consolidation_v1/external_local_dirs/tradebot-data/independent_underlying_confirmation_v3
            research/local_evidence_consolidation_v1/external_local_dirs/tradebot-ml-evidence/constituent-lead-lag-data-v1
            research/local_evidence_consolidation_v1/external_local_dirs/tradebot-ml-evidence/all-strategy-option-pf-v1
            research/local_evidence_consolidation_v1/external_local_dirs/tradebot-ml-evidence/kite-underlying-directional-edge-campaign-v1
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy pyarrow

      - name: Run multi-event discovery
        working-directory: feature
        run: |
          python scripts/run_multievent_directional_discovery_v1.py \
            --evidence-root ../evidence/research/local_evidence_consolidation_v1/external_local_dirs \
            --output-dir runtime/research/multievent_directional_discovery_v1

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: multievent-directional-discovery-v1-evidence
          path: feature/runtime/research/multievent_directional_discovery_v1
          if-no-files-found: error
