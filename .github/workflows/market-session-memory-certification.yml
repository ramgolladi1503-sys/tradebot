name: Market Session Memory V1 Certification

on:
  pull_request:
    paths:
      - "core/market_session_store.py"
      - "core/market_session_memory_contract.py"
      - "core/ohlc_buffer.py"
      - "sitecustomize.py"
      - "scripts/certify_market_session_memory.py"
      - "tests/core/test_market_session_store.py"
      - "tests/core/test_ohlc_session_memory_integration.py"
      - ".github/workflows/market-session-memory-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONHASHSEED: "0"
      MARKET_SESSION_MEMORY_DISABLE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: python -m pip install pytest
      - name: Compile touched modules
        run: >-
          python -m py_compile
          core/market_session_store.py
          core/market_session_memory_contract.py
          core/ohlc_buffer.py
          sitecustomize.py
          scripts/certify_market_session_memory.py
          tests/core/test_market_session_store.py
          tests/core/test_ohlc_session_memory_integration.py
      - name: Focused deterministic tests
        run: >-
          PYTHONPATH=. pytest -q
          tests/core/test_market_session_store.py
          tests/core/test_ohlc_session_memory_integration.py
      - name: Independent deterministic certification harness
        run: >-
          PYTHONPATH=. python scripts/certify_market_session_memory.py
          --output evidence/market_session_memory_v1/certification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: market-session-memory-v1-certification
          path: evidence/market_session_memory_v1/certification.json
          if-no-files-found: error
