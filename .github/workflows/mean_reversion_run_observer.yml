name: Mean Reversion Research Run Observer

# Revision 6: refresh both workflow states after correcting the schema-probe root.
on:
  push:
    branches:
      - research/postmerge-mean-reversion-rerun-v1
    paths:
      - ".github/workflows/mean_reversion_run_observer.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish-run-identities:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout evidence branch
        uses: actions/checkout@v4
        with:
          ref: research/postmerge-mean-reversion-rerun-v1
          fetch-depth: 1

      - name: Query latest research runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work=/tmp/mean-reversion-observer
          mkdir -p "${work}"
          for workflow in \
            mean_reversion_postmerge_regeneration.yml \
            mean_reversion_corpus_schema_probe.yml; do
            gh api \
              "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=research%2Fpostmerge-mean-reversion-rerun-v1&event=push&per_page=10" \
              > "${work}/${workflow}.json"
          done

          python - <<'PY'
          import json
          from pathlib import Path

          work = Path('/tmp/mean-reversion-observer')
          workflows = [
              'mean_reversion_postmerge_regeneration.yml',
              'mean_reversion_corpus_schema_probe.yml',
          ]
          result = {}
          for workflow in workflows:
              payload = json.loads((work / f'{workflow}.json').read_text())
              runs = payload.get('workflow_runs', [])
              if not runs:
                  result[workflow] = {'status': 'NOT_FOUND'}
                  continue
              run = runs[0]
              result[workflow] = {
                  'workflow_name': run.get('name'),
                  'workflow_run_id': run.get('id'),
                  'run_number': run.get('run_number'),
                  'event': run.get('event'),
                  'status': run.get('status'),
                  'conclusion': run.get('conclusion'),
                  'head_branch': run.get('head_branch'),
                  'head_sha': run.get('head_sha'),
                  'created_at': run.get('created_at'),
                  'updated_at': run.get('updated_at'),
                  'html_url': run.get('html_url'),
              }

          target = Path('docs/research/mean_reversion_postmerge_regeneration/workflow_runs_status.json')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Commit workflow identities
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/mean_reversion_postmerge_regeneration/workflow_runs_status.json
          if ! git diff --cached --quiet; then
            git commit -m "research: publish research workflow identities"
            git push origin HEAD:research/postmerge-mean-reversion-rerun-v1
          fi
