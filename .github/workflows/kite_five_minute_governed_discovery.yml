name: kite-five-minute-governed-discovery

on:
  workflow_dispatch:
    inputs:
      archive_sha256:
        description: "Expected SHA-256 of the private Kite archive"
        required: true
      archive_artifact_name:
        description: "Previously uploaded private archive artifact name"
        required: true

permissions:
  contents: read

jobs:
  governed-campaign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/kite-five-minute-governed-discovery-v1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned research dependencies
        run: |
          python -m pip install --upgrade pip==24.2
          python -m pip install pandas==2.2.2 pyarrow==21.0.0 numpy==1.26.4 pytest==8.2.2

      - name: Download private Kite archive artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.archive_artifact_name }}
          path: .private_kite_archive

      - name: Verify archive SHA
        run: |
          ARCHIVE="$(find .private_kite_archive -type f -name '*.zip' | head -1)"
          test -n "$ARCHIVE"
          echo "${{ inputs.archive_sha256 }}  $ARCHIVE" | sha256sum -c -
          echo "KITE_ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Run focused tests
        run: pytest -q tests/test_kite_five_minute_campaign.py

      - name: Run governed campaign twice
        run: python scripts/run_kite_five_minute_campaign.py --archive "$KITE_ARCHIVE" --output-root "$GITHUB_WORKSPACE"

      - name: Run independent audit
        run: python scripts/audit_kite_five_minute_campaign.py

      - name: Upload read-only evidence
        uses: actions/upload-artifact@v4
        with:
          name: kite-five-minute-governed-discovery-evidence
          path: |
            research/kite_five_minute_campaign/input/*.json
            research/kite_five_minute_campaign/input/*.sha256
            research/kite_five_minute_campaign/evidence/**/*.json
            research/kite_five_minute_campaign/evidence/**/*.sha256
            research/data_governance/exposure_ledger.jsonl
            research/data_governance/exposure_ledger_manifest.json
            research/data_governance/exposure_report.md
