name: kite-five-minute-governed-discovery

on:
  push:
    branches:
      - research/kite-five-minute-governed-discovery-v1
  pull_request:
    branches:
      - research/structural-edge-prove-or-kill-v1
  workflow_dispatch:
    inputs:
      archive_sha256:
        description: "Expected SHA-256 of the private Kite archive"
        required: true
      archive_release_tag:
        description: "Immutable private GitHub release tag containing the archive"
        required: true
      archive_asset_name:
        description: "Exact release asset filename"
        required: true
      expected_head_sha:
        description: "Expected branch head SHA; leave empty to skip"
        required: false

permissions:
  contents: read

env:
  KITE_ARCHIVE_RELEASE_TAG: kite-five-minute-corpus-v1
  KITE_ARCHIVE_ASSET_NAME: kite_candidate_replay.zip
  KITE_ARCHIVE_SHA256: f5912a89547dbca1c2b1243f239445bca79d474f21d020d87eb7ab5b33a9310d
  KITE_ARCHIVE_SIZE_BYTES: "7966978"

jobs:
  governed-campaign:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Refuse unexpected branch or commit
        run: |
          if [ -n "${{ inputs.expected_head_sha }}" ]; then
            test "$(git rev-parse HEAD)" = "${{ inputs.expected_head_sha }}" || {
              echo "unexpected head: $(git rev-parse HEAD)" >&2
              exit 2
            }
          fi
          git rev-parse HEAD > research_head_sha.txt

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned research dependencies
        run: |
          python -m pip install --upgrade pip==24.2
          python -m pip install pandas==2.2.2 pyarrow==21.0.0 numpy==1.26.4 pytest==8.2.2

      - name: Download exact private Kite archive release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .private_kite_archive
          gh release download "${KITE_ARCHIVE_RELEASE_TAG}" \
            --pattern "${KITE_ARCHIVE_ASSET_NAME}" \
            --dir .private_kite_archive \
            --clobber
          FOUND="$(find .private_kite_archive -type f -name "${KITE_ARCHIVE_ASSET_NAME}" | wc -l | tr -d ' ')"
          test "$FOUND" = "1" || {
            echo "expected exactly one archive asset, found $FOUND" >&2
            exit 2
          }

      - name: Verify archive SHA
        run: |
          ARCHIVE=".private_kite_archive/${KITE_ARCHIVE_ASSET_NAME}"
          test -n "$ARCHIVE"
          test "$(wc -c < "$ARCHIVE" | tr -d ' ')" = "${KITE_ARCHIVE_SIZE_BYTES}"
          echo "${KITE_ARCHIVE_SHA256}  $ARCHIVE" | sha256sum -c -
          echo "KITE_ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Run focused tests
        run: pytest -q tests/test_kite_five_minute_campaign.py tests/test_kite_five_minute_campaign_v2.py

      - name: Run governed campaign twice
        run: |
          PRE="$(python - <<'PY'
import json
print(json.load(open('research/kite_five_minute_campaign/evidence/v2/pre_outcome_freeze_manifest.json'))['pre_outcome_freeze_commit'])
PY
)"
          python scripts/run_kite_five_minute_campaign.py --archive "$KITE_ARCHIVE" --output-root "$GITHUB_WORKSPACE" --allow-real-outcome --pre-outcome-freeze-commit "$PRE"

      - name: Run independent audit
        run: python scripts/audit_kite_five_minute_campaign.py

      - name: Verify JSON sidecars
        run: |
          while IFS= read -r sidecar; do
            json="${sidecar%.sha256}"
            expected="$(awk '{print $1}' "$sidecar")"
            actual="$(sha256sum "$json" | awk '{print $1}')"
            test "$expected" = "$actual" || {
              echo "sidecar mismatch: $sidecar" >&2
              exit 2
            }
          done < <(find research/kite_five_minute_campaign research/data_governance -name '*.sha256' | sort)

      - name: Upload read-only evidence
        uses: actions/upload-artifact@v4
        with:
          name: kite-five-minute-governed-discovery-evidence
          path: |
            research/kite_five_minute_campaign/input/*.json
            research/kite_five_minute_campaign/input/*.sha256
            research/kite_five_minute_campaign/evidence/**/*.json
            research/kite_five_minute_campaign/evidence/**/*.sha256
            research/data_governance/exposure_ledger.jsonl
            research/data_governance/exposure_ledger_manifest.json
            research/data_governance/exposure_report.md
            research_head_sha.txt
