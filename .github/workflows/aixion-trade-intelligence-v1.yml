name: Aixion Trade Intelligence V1

on:
  pull_request:
    paths:
      - "aixion_trade_intelligence/**"
      - "scripts/run_aixion_trade_intelligence_offline.py"
      - "scripts/generate_aixion_trade_intelligence_fixture.py"
      - "scripts/check_aixion_trade_intelligence_canary.py"
      - "tests/test_aixion_trade_intelligence_v1.py"
      - "tests/test_aixion_trade_intelligence_extensions_v1.py"
      - "tests/test_aixion_trade_intelligence_canary_v1.py"
      - "tests/test_aixion_trade_intelligence_readiness_v1.py"
      - "docs/aixion_trade_intelligence/**"
      - "docs/agent_reviews/aixion_trade_intelligence_v1.md"
      - ".github/workflows/aixion-trade-intelligence-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-evidence-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - name: Compile evidence kernel
        run: |
          python -m py_compile \
            aixion_trade_intelligence/contracts.py \
            aixion_trade_intelligence/publisher.py \
            aixion_trade_intelligence/safe_publish.py \
            aixion_trade_intelligence/storage.py \
            aixion_trade_intelligence/session.py \
            aixion_trade_intelligence/report.py \
            aixion_trade_intelligence/tradebot_adapter.py \
            aixion_trade_intelligence/outcomes.py \
            aixion_trade_intelligence/evidence_search.py \
            aixion_trade_intelligence/readiness.py \
            scripts/generate_aixion_trade_intelligence_fixture.py \
            scripts/run_aixion_trade_intelligence_offline.py \
            scripts/check_aixion_trade_intelligence_canary.py
      - name: Run focused certification tests
        run: |
          pytest -q \
            tests/test_aixion_trade_intelligence_v1.py \
            tests/test_aixion_trade_intelligence_extensions_v1.py \
            tests/test_aixion_trade_intelligence_canary_v1.py \
            tests/test_aixion_trade_intelligence_readiness_v1.py
      - name: Run full offline fixture and report
        run: |
          rm -rf .runtime/aixion-cert
          python scripts/generate_aixion_trade_intelligence_fixture.py \
            --output-root .runtime/aixion-cert/evidence
          python scripts/run_aixion_trade_intelligence_offline.py \
            --event-log .runtime/aixion-cert/evidence/OFFLINE-CERT-SESSION-001/events.jsonl \
            --output-dir .runtime/aixion-cert/report
          test -s .runtime/aixion-cert/report/session_analysis.json
          test -s .runtime/aixion-cert/report/session_report.md
          grep -q "VALID_OFFLINE_SESSION_EVIDENCE" .runtime/aixion-cert/report/session_report.md
          grep -q '"ready_for_profitability_claim": false' .runtime/aixion-cert/report/session_analysis.json
      - name: Reject broker or execution authority
        run: |
          if grep -RInE "place_order|modify_order|cancel_order|exit_order|kite\.place|broker.*order" aixion_trade_intelligence scripts/run_aixion_trade_intelligence_offline.py scripts/generate_aixion_trade_intelligence_fixture.py scripts/check_aixion_trade_intelligence_canary.py; then
            echo "Forbidden broker/order authority found"
            exit 1
          fi
      - name: Reject hardcoded profitability claims
        run: |
          if grep -RInE "guaranteed_profit|profitability_certified|live_edge_certified" aixion_trade_intelligence; then
            echo "Forbidden profitability claim found"
            exit 1
          fi
