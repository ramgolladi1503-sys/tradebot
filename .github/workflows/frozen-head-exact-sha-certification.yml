name: Frozen Candidate Exact-SHA Certification

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
        type: string
      candidate_sha:
        required: true
        type: string
      base_sha:
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  exact-sha-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch independent base and candidate refs
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate_sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
        run: |
          git fetch --no-tags origin \
            +refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr-${PR_NUMBER}-head
          git fetch --no-tags origin "$BASE_SHA"
          test -n "$BASE_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          test "$(git rev-parse refs/remotes/origin/pr-${PR_NUMBER}-head)" = "$HEAD_SHA"
          git merge-base "$BASE_SHA" "$HEAD_SHA"
          echo "PR_HEAD_SHA=$HEAD_SHA"
          echo "PR_BASE_SHA=$BASE_SHA"
          echo "SYNTHETIC_MERGE_REF_USED_AS_AUTHORITY=false"

  agent-review-base-authority:
    if: ${{ !startsWith(github.head_ref, 'ci/') }}
    needs: exact-sha-identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate base-authoritative exact-SHA manifest
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate_sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
        run: |
          test -n "$BASE_SHA"
          git fetch --no-tags origin "$BASE_SHA" +refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr-${PR_NUMBER}-head
          python scripts/validate_frozen_head_bridge.py --pr-number "$PR_NUMBER" --candidate-sha "$HEAD_SHA" --base-sha "$BASE_SHA"

  runtime-authority-base-authority:
    if: ${{ !startsWith(github.head_ref, 'ci/') }}
    needs: exact-sha-identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate current-base scope policy
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate_sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
        run: |
          test -n "$BASE_SHA"
          git fetch --no-tags origin "$BASE_SHA" +refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr-${PR_NUMBER}-head
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          git diff --check "$BASE_SHA" "$HEAD_SHA"
          changed_file=$(mktemp)
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$changed_file"
          python - "$changed_file" <<'PY'
          import sys
          from scripts.validate_frozen_head_bridge import high_risk
          paths = [p.strip() for p in open(sys.argv[1]) if p.strip()]
          risky = [p for p in paths if high_risk(p)]
          tests = [p for p in paths if p.startswith("tests/")]
          if risky and not tests:
              raise SystemExit(f"UNAUTHORIZED_HIGH_RISK_CHANGE:{risky}")
          print(f"BASE_AUTHORITATIVE_SCOPE_PASS high_risk={len(risky)} tests={len(tests)}")
          PY

  code-excellence-base-authority:
    if: ${{ !startsWith(github.head_ref, 'ci/') }}
    needs: exact-sha-identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run trusted CE code against exact candidate tree
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate_sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
        run: |
          test -n "$BASE_SHA"
          git fetch --no-tags origin "$BASE_SHA" +refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr-${PR_NUMBER}-head
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          test "$(git rev-parse refs/remotes/origin/pr-${PR_NUMBER}-head)" = "$HEAD_SHA"

          BASE_WORKSPACE="$GITHUB_WORKSPACE"
          CANDIDATE_TREE="$RUNNER_TEMP/ce-candidate-${HEAD_SHA}"
          CHANGED_PATHS_FILE="$RUNNER_TEMP/ce-changed-paths.txt"
          REPORT_FILE="$RUNNER_TEMP/unified-ce-gate-${HEAD_SHA}.md"

          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$CHANGED_PATHS_FILE"
          GIT_LFS_SKIP_SMUDGE=1 git worktree add --detach "$CANDIDATE_TREE" "$HEAD_SHA"
          test "$(git -C "$CANDIDATE_TREE" rev-parse HEAD)" = "$HEAD_SHA"

          PYTHONPATH="$BASE_WORKSPACE" python "$BASE_WORKSPACE/scripts/run_unified_ce_gates.py" \
            --repo "$CANDIDATE_TREE" \
            --config "$BASE_WORKSPACE/.gsd-forensics.yaml" \
            --changed-paths-file "$CHANGED_PATHS_FILE" \
            --out "$REPORT_FILE"

  trusted-evidence-coverage:
    if: github.event_name == 'pull_request_target'
    name: Trusted base evidence coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the exact protected base commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python from the protected base workflow
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate event SHAs and prepare candidate as inert data
        id: candidate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ || ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "base/head SHA must be full lowercase commit IDs" >&2
            exit 1
          fi
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "pull request number is unavailable or malformed" >&2
            exit 1
          fi
          actual_base=$(git rev-parse HEAD)
          if [[ "$actual_base" != "$BASE_SHA" ]]; then
            echo "checkout HEAD $actual_base differs from event base $BASE_SHA" >&2
            exit 1
          fi
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "protected-base checkout is not clean; refusing to run verifier" >&2
            exit 1
          fi

          candidate_root="$RUNNER_TEMP/trusted-evidence-candidate-$RUN_ID-$RUN_ATTEMPT"
          if [[ -e "$candidate_root" ]]; then
            echo "candidate data path already exists" >&2
            exit 1
          fi
          pr_head_ref="refs/remotes/origin/trusted-evidence-pr-$PR_NUMBER"
          git fetch --no-tags origin "+refs/pull/$PR_NUMBER/head:$pr_head_ref"
          fetched_head=$(git rev-parse "$pr_head_ref")
          if [[ "$fetched_head" != "$HEAD_SHA" ]]; then
            echo "fetched PR head $fetched_head differs from event head $HEAD_SHA" >&2
            exit 1
          fi
          mkdir "$candidate_root"
          git archive --format=tar "$HEAD_SHA" | tar --no-same-owner -xf - -C "$candidate_root"
          printf 'candidate_root=%s\n' "$candidate_root" >> "$GITHUB_OUTPUT"

      - name: Enforce candidate coverage with the base verifier
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CANDIDATE_ROOT: ${{ steps.candidate.outputs.candidate_root }}
        run: |
          set -euo pipefail
          started=$SECONDS
          python "$GITHUB_WORKSPACE/tools/verify_evidence.py" \
            --base-ref "$BASE_SHA" \
            --candidate-ref "$HEAD_SHA" \
            --candidate-sha "$HEAD_SHA" \
            --candidate-root "$CANDIDATE_ROOT" \
            --candidate-root-sha "$HEAD_SHA" \
            --verifier-source-sha "$BASE_SHA" \
            --output trusted-base-evidence-report.json \
            --summary-output "$GITHUB_STEP_SUMMARY" \
            --mode enforce-new-material
          duration=$((SECONDS - started))
          printf '\nTrusted verifier duration: %s seconds.\n' "$duration" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload trusted-base report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trusted-base-evidence-${{ github.event.pull_request.head.sha }}
          path: trusted-base-evidence-report.json
          if-no-files-found: warn
          retention-days: 30
