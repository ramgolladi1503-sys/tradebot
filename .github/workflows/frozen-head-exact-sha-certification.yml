name: Frozen Candidate Exact-SHA Certification

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
        type: string
      candidate_sha:
        required: true
        type: string
      base_sha:
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  exact-sha-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch independent base and candidate refs
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate_sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
        run: |
          git fetch --no-tags origin \
            +refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr-${PR_NUMBER}-head
          git fetch --no-tags origin "$BASE_SHA"
          test -n "$BASE_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          test "$(git rev-parse refs/remotes/origin/pr-${PR_NUMBER}-head)" = "$HEAD_SHA"
          git merge-base "$BASE_SHA" "$HEAD_SHA"
          echo "PR_HEAD_SHA=$HEAD_SHA"
          echo "PR_BASE_SHA=$BASE_SHA"
          echo "SYNTHETIC_MERGE_REF_USED_AS_AUTHORITY=false"

  agent-review-base-authority:
    if: ${{ !startsWith(github.head_ref, 'ci/') }}
    needs: exact-sha-identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate base-authoritative exact-SHA manifest
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate_sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
        run: |
          test -n "$BASE_SHA"
          git fetch --no-tags origin "$BASE_SHA" +refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr-${PR_NUMBER}-head
          python scripts/validate_frozen_head_bridge.py --pr-number "$PR_NUMBER" --candidate-sha "$HEAD_SHA" --base-sha "$BASE_SHA"

  runtime-authority-base-authority:
    if: ${{ !startsWith(github.head_ref, 'ci/') }}
    needs: exact-sha-identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate current-base scope policy
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate_sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
        run: |
          test -n "$BASE_SHA"
          git fetch --no-tags origin "$BASE_SHA" +refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr-${PR_NUMBER}-head
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          git diff --check "$BASE_SHA" "$HEAD_SHA"
          changed_file=$(mktemp)
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$changed_file"
          python - "$changed_file" <<'PY'
          import sys
          from scripts.validate_frozen_head_bridge import high_risk
          paths = [p.strip() for p in open(sys.argv[1]) if p.strip()]
          risky = [p for p in paths if high_risk(p)]
          tests = [p for p in paths if p.startswith("tests/")]
          if risky and not tests:
              raise SystemExit(f"UNAUTHORIZED_HIGH_RISK_CHANGE:{risky}")
          print(f"BASE_AUTHORITATIVE_SCOPE_PASS high_risk={len(risky)} tests={len(tests)}")
          PY

  code-excellence-base-authority:
    if: ${{ !startsWith(github.head_ref, 'ci/') }}
    needs: exact-sha-identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run trusted CE code against exact candidate tree
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate_sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha }}
        run: |
          test -n "$BASE_SHA"
          git fetch --no-tags origin "$BASE_SHA" +refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr-${PR_NUMBER}-head
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          test "$(git rev-parse refs/remotes/origin/pr-${PR_NUMBER}-head)" = "$HEAD_SHA"

          BASE_WORKSPACE="$GITHUB_WORKSPACE"
          CANDIDATE_TREE="$RUNNER_TEMP/ce-candidate-${HEAD_SHA}"
          CHANGED_PATHS_FILE="$RUNNER_TEMP/ce-changed-paths.txt"
          REPORT_FILE="$RUNNER_TEMP/unified-ce-gate-${HEAD_SHA}.md"

          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$CHANGED_PATHS_FILE"
          git worktree add --detach "$CANDIDATE_TREE" "$HEAD_SHA"
          test "$(git -C "$CANDIDATE_TREE" rev-parse HEAD)" = "$HEAD_SHA"

          PYTHONPATH="$BASE_WORKSPACE" python "$BASE_WORKSPACE/scripts/run_unified_ce_gates.py" \
            --repo "$CANDIDATE_TREE" \
            --config "$BASE_WORKSPACE/.gsd-forensics.yaml" \
            --changed-paths-file "$CHANGED_PATHS_FILE" \
            --out "$REPORT_FILE"
