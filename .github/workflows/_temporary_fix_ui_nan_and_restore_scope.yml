name: Temporary Fix UI Missing Scalars And Restore Scope

on:
  push:
    branches:
      - post-pr763/runtime-authority-cutover-v1

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: post-pr763/runtime-authority-cutover-v1
          fetch-depth: 0
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply exact dataframe scalar sanitization
        run: python tools/_temporary_fix_ui_nan_authority.py

      - name: Restore exact frozen runtime artifacts
        run: |
          git checkout 1241418cafbefba8fd3d1142e5ae578d9b97cd70 -- \
            runtime/strategy_validation/regime_timeline.jsonl \
            runtime/strategy_validation/resolved_option_ticks_20260702.parquet

      - name: Verify bounded scope and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/_temporary_fix_ui_nan_and_restore_scope.yml \
            tools/_temporary_fix_ui_nan_authority.py \
            tools/_trigger_fix_ui_nan_authority.txt
          git add \
            dashboard/ui/table_model.py \
            runtime/strategy_validation/regime_timeline.jsonl \
            runtime/strategy_validation/resolved_option_ticks_20260702.parquet
          git diff --cached --check
          git commit -m "fix: sanitize missing UI scalars before authority evaluation"
          git push origin HEAD:post-pr763/runtime-authority-cutover-v1
