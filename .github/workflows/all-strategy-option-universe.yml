name: All Strategy Option Universe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/all-strategy-option-universe.yml"
      - "strategies/**"
      - "research/**"
      - "scripts/run_all_strategy_option_universe.py"

permissions:
  contents: read

jobs:
  exhaustive-universe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build exhaustive strategy and hypothesis universe
        shell: bash
        run: |
          output=/tmp/all-strategy-option-universe
          rm -rf "$output"
          mkdir -p "$output"
          set +e
          PYTHONPATH=. python scripts/run_all_strategy_option_universe.py \
            --repo-root . \
            --output-dir "$output" \
            >"$output/run.log" 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" >"$output/exit_status.txt"
          cat "$output/run.log"
          exit "$status"

      - name: Upload universe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-strategy-option-universe
          path: /tmp/all-strategy-option-universe
          if-no-files-found: error
          retention-days: 30
