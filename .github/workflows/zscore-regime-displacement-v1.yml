name: zscore-regime-displacement-v1

on:
  workflow_dispatch:
  push:
    branches:
      - research/zscore-regime-displacement-v1
    paths:
      - 'research/zscore_regime_displacement_v1/**'
      - 'scripts/run_zscore_regime_displacement_v1.py'
      - 'tests/test_zscore_regime_displacement_v1.py'
      - '.github/workflows/zscore-regime-displacement-v1.yml'
  pull_request:
    paths:
      - 'research/zscore_regime_displacement_v1/**'
      - 'scripts/run_zscore_regime_displacement_v1.py'
      - 'tests/test_zscore_regime_displacement_v1.py'
      - '.github/workflows/zscore-regime-displacement-v1.yml'

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  development-certification:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Hydrate pinned constituent-index evidence only
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull \
            --include="research/local_evidence_consolidation_v1/**/constituent_index_5m.parquet" \
            --exclude=""

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          cache: pip

      - name: Install pinned research dependencies
        run: |
          python -m pip install --upgrade "pip==26.2.1"
          python -m pip install \
            "numpy==2.5.1" \
            "pandas==3.0.5" \
            "scipy==1.18.0" \
            "pyarrow==25.0.0" \
            "scikit-learn==1.9.0" \
            "pytest==9.1.1"

      - name: Run causality and freeze tests
        run: |
          PYTHONPATH=. python -m pytest -q \
            tests/test_zscore_regime_displacement_v1.py \
            tests/test_autonomous_structural_edge_exhaustion_v1.py

      - name: Execute development-only certification
        run: |
          rm -rf runtime/research/zscore_regime_displacement_v1
          PYTHONPATH=. python scripts/run_zscore_regime_displacement_v1.py \
            --source-file research/local_evidence_consolidation_v1/external_local_dirs/tradebot-ml-evidence/constituent-lead-lag-data-v1/proxy_campaign_2024_2025_v2/normalized/constituent_index_5m.parquet \
            --output-root runtime/research/zscore_regime_displacement_v1

      - name: Enforce sealed-tail and safety boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("runtime/research/zscore_regime_displacement_v1")
          final = json.loads((root / "final_authority.json").read_text())
          assert final["unopened_sessions_scored"] is False
          assert final["unopened_tail_access_authorized"] is False
          assert final["options_edge_certified"] is False
          assert final["shadow_authorized"] is False
          assert final["paper_authorized"] is False
          assert final["live_authorized"] is False
          assert final["order_authorized"] is False
          print(json.dumps(final, indent=2, sort_keys=True))
          PY

      - name: Upload development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zscore-regime-displacement-v1
          path: runtime/research/zscore_regime_displacement_v1/
          if-no-files-found: error
          retention-days: 30
