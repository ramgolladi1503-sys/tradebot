name: PSILOR PR795 Trusted Smoke

on:
  workflow_run:
    workflows: ["tests"]
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  authenticated-bounded-smoke:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_branch == 'data/psilor-v1-upstox-fetch-v2' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
      PSILOR_SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      PSILOR_TRUSTED_SMOKE_ROOT: ${{ runner.temp }}/psilor-trusted-smoke
      PSILOR_TRUSTED_SMOKE_RESULT: ${{ runner.temp }}/psilor-trusted-smoke-result.json
    steps:
      - name: Checkout trusted default branch only
        uses: actions/checkout@v4
        with:
          ref: main
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install trusted runner dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow requests

      - name: Run trusted bounded smoke
        id: smoke
        continue-on-error: true
        run: python scripts/ci/psilor_pr795_trusted_smoke.py

      - name: Post sanitized result to PR 795
        if: always()
        uses: actions/github-script@v7
        env:
          RESULT_PATH: ${{ env.PSILOR_TRUSTED_SMOKE_RESULT }}
          SOURCE_HEAD_SHA: ${{ env.PSILOR_SOURCE_HEAD_SHA }}
        with:
          script: |
            const fs = require('fs');
            const resultPath = process.env.RESULT_PATH;
            let result;
            if (fs.existsSync(resultPath)) {
              result = JSON.parse(fs.readFileSync(resultPath, 'utf8'));
            } else {
              result = {
                schema_version: 1,
                source_head_sha: process.env.SOURCE_HEAD_SHA,
                smoke_verdict: 'FAILED_NO_SANITIZED_RESULT',
                formal_extraction_approved: false,
                credentials_persisted: false
              };
            }
            const body = [
              '<!-- PSILOR_AUTHENTICATED_SMOKE_RESULT -->',
              '## PSILOR authenticated smoke result',
              '```json',
              JSON.stringify(result, null, 2),
              '```'
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 795,
              per_page: 100
            });
            const existing = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' &&
              comment.body?.includes('PSILOR_AUTHENTICATED_SMOKE_RESULT')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 795,
                body
              });
            }

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psilor-pr795-trusted-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.PSILOR_TRUSTED_SMOKE_RESULT }}
            ${{ env.PSILOR_TRUSTED_SMOKE_ROOT }}/validation_report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Enforce exact smoke verdict
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(
              Path(os.environ['PSILOR_TRUSTED_SMOKE_RESULT']).read_text(encoding='utf-8')
          )
          assert result['source_head_sha'] == os.environ['PSILOR_SOURCE_HEAD_SHA']
          assert result['smoke_verdict'] == 'PASS_BOUNDED_AUTHENTICATED_FETCH_SMOKE'
          assert result['real_future_contracts'] == 1
          assert result['real_ce_contracts'] == 2
          assert result['real_pe_contracts'] == 2
          assert result['real_candle_files'] == 5
          assert len(result['exact_common_sessions']) == 2
          assert result['smoke_hash_reconciliation'] == 'PASS'
          assert result['no_unexpected_files'] is True
          assert result['created_by_current_run'] is True
          assert result['formal_extraction_approved'] is True
          assert result['credentials_persisted'] is False
          print('SMOKE_VERDICT=PASS_BOUNDED_AUTHENTICATED_FETCH_SMOKE')
          PY
