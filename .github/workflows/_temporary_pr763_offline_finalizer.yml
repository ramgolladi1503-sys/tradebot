name: Temporary PR763 Offline Finalizer

on:
  push:
    branches:
      - campaign/unified-live-validation-pr748-756-v1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TRADEBOT_READ_ONLY: "true"
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest python-dotenv requests kiteconnect holidays pandas numpy pyarrow websockets protobuf
      - name: Compile certification paths
        run: |
          python -m py_compile \
            core/kite_depth_ws.py \
            core/tick_store.py \
            core/depth_store.py \
            core/feed/runtime_store.py \
            tools/pr763_gate1_structured_evidence.py \
            tests/test_pr763_callback_persistence_cutover_certification.py \
            tests/test_pr763_gate1_structured_evidence.py \
            scripts/run_pr763_gate1_offline_certification.py
      - name: Run current Gate 1 suite
        id: gate1
        shell: bash
        run: |
          set +e
          python -m pytest -vv --tb=long \
            --junitxml=pr763-gate1-junit.xml \
            tests/test_pr763_callback_persistence_cutover_certification.py \
            2>&1 | tee pr763-gate1-pytest.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit ${status}
      - name: Upload Gate 1 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr763-gate1-diagnostics
          path: |
            pr763-gate1-junit.xml
            pr763-gate1-pytest.log
          if-no-files-found: error
          retention-days: 3
