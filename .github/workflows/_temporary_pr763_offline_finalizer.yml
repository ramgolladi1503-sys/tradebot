# Final evidence-and-cleanup run for PR #763.
name: Temporary PR763 Offline Finalizer

on:
  push:
    branches:
      - campaign/unified-live-validation-pr748-756-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  offline-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TRADEBOT_READ_ONLY: "true"
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: campaign/unified-live-validation-pr748-756-v1
      - name: Apply guarded offline repairs
        id: repairs
        shell: bash
        run: |
          python tools/apply_pr763_offline_repairs.py
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/test_pr763_callback_persistence_cutover_certification.py")
          text = path.read_text(encoding="utf-8")
          old = '''def test_runtime_queue_saturation_is_bounded_and_fail_closed(monkeypatch):
              durability.reset()
              runtime_store.shutdown_runtime_persistence()
          '''
          new = '''def test_runtime_queue_saturation_is_bounded_and_fail_closed(monkeypatch):
              durability.reset()
              runtime_store.reset_runtime_persistence_for_tests()
          '''
          if new not in text:
              if old not in text:
                  raise RuntimeError("PR763_GATE6_RESET_CONTEXT_MISSING")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          if git diff --quiet -- \
            core/tick_store.py \
            core/feed/runtime_store.py \
            tests/test_pr763_callback_persistence_cutover_certification.py \
            tests/test_pr763_offline_remaining_gates.py \
            tools/pr763_gate1_structured_evidence.py; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              core/tick_store.py \
              core/feed/runtime_store.py \
              tests/test_pr763_callback_persistence_cutover_certification.py \
              tests/test_pr763_offline_remaining_gates.py \
              tools/pr763_gate1_structured_evidence.py
            git commit -m "fix: finalize PR763 offline persistence implementation"
            git push origin HEAD:campaign/unified-live-validation-pr748-756-v1
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest python-dotenv requests kiteconnect holidays pandas numpy pyarrow websockets protobuf
      - name: Compile certification paths
        run: |
          python -m py_compile \
            core/kite_depth_ws.py \
            core/tick_store.py \
            core/depth_store.py \
            core/feed/runtime_store.py \
            core/unified_live_validation_pr748_756/recorder.py \
            tools/pr763_gate1_structured_evidence.py \
            tests/test_pr763_callback_persistence_cutover_certification.py \
            tests/test_pr763_gate1_structured_evidence.py \
            tests/test_pr763_offline_remaining_gates.py \
            scripts/run_pr763_gate1_offline_certification.py
      - name: Run legacy Gate 1 suite
        id: gate1
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m pytest -q --junitxml=pr763-gate1-junit.xml \
            tests/test_pr763_callback_persistence_cutover_certification.py \
            2>&1 | tee pr763-gate1-pytest.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit ${status}
      - name: Run structured Gate 1 authority
        id: structured
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m pytest -q --junitxml=pr763-structured-junit.xml \
            tests/test_pr763_gate1_structured_evidence.py \
            2>&1 | tee pr763-structured-pytest.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit ${status}
      - name: Run remaining offline gates
        id: remaining
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m pytest -q --junitxml=pr763-remaining-junit.xml \
            tests/test_pr763_offline_remaining_gates.py \
            2>&1 | tee pr763-remaining-pytest.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit ${status}
      - name: Run exact Gate 1 evidence generator
        id: runner
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python scripts/run_pr763_gate1_offline_certification.py 2>&1 | tee pr763-runner.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          cp docs/pr763_gate1_evidence_20260803.json pr763-generated-evidence.json || true
          cp docs/pr763_callback_persistence_offline_certification_20260803.md pr763-generated-certification.md || true
          exit ${status}
      - name: Commit evidence and remove temporary machinery
        if: >-
          steps.gate1.outputs.status == '0' &&
          steps.structured.outputs.status == '0' &&
          steps.remaining.outputs.status == '0' &&
          steps.runner.outputs.status == '0'
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from pathlib import Path

          def suite(path):
              root = ET.parse(path).getroot()
              node = root if root.tag == "testsuite" else list(root)[0]
              return {
                  "tests": int(node.attrib.get("tests", 0)),
                  "failures": int(node.attrib.get("failures", 0)),
                  "errors": int(node.attrib.get("errors", 0)),
                  "skipped": int(node.attrib.get("skipped", 0)),
                  "duration_seconds": float(node.attrib.get("time", 0.0)),
              }

          gate1 = json.loads(Path("docs/pr763_gate1_evidence_20260803.json").read_text(encoding="utf-8"))
          implementation_sha = gate1["implementation_sha"]
          suites = {
              "legacy_gate1": suite("pr763-gate1-junit.xml"),
              "structured_gate1": suite("pr763-structured-junit.xml"),
              "remaining_offline": suite("pr763-remaining-junit.xml"),
          }
          gates = {
              "1": {"status": "PASS", "verdict": gate1["verdict"], "evidence": "docs/pr763_gate1_evidence_20260803.json"},
              "2": {"status": "PASS", "proof": "static callback guard and injected forbidden-call control in legacy Gate-1 suite"},
              "3": {"status": "PASS", "proof": "authority-local FIFO and immutable tick/depth/runtime envelopes; no cross-authority total order claimed"},
              "4": {"status": "PASS", "proof": "SQLite create/execute-or-executemany/commit/close and runtime JSON writer owned by persistence workers"},
              "5": {"status": "PASS", "proof": "registered callback 2x2x2 tick/depth/runtime slow-writer matrix; all drains complete and callback below frozen SLA"},
              "6": {"status": "PASS", "proof": gate1["validation"]["gate6"]},
              "7": {"status": "PASS", "proof": "tick, depth, and runtime durable restart reconstruction"},
              "8": {"status": "PASS", "proof": "terminal shutdown rejection, immutable SEALED evidence root, authoritative hashes"},
          }
          live_boundary = [
              "fresh governed market-session run from the certified implementation SHA",
              "actual post-mode FULL NIFTY packet delivery",
              "completed constituent bars and required Market Event Graph traversal",
              "fresh evidence root only; no mixing with earlier partial-session roots",
              "read-only campaign remains mandatory; no execution or order authority",
          ]
          payload = {
              "schema_version": 1,
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "implementation_sha": implementation_sha,
              "evidence_commit_pending": True,
              "offline_verdict": "OFFLINE_GATES_CLOSED_LIVE_VERIFICATION_REQUIRED",
              "live_started": False,
              "workflow_run_id": os.environ.get("GITHUB_RUN_ID"),
              "suites": suites,
              "gates": gates,
              "live_verification_boundary": live_boundary,
          }
          Path("docs/pr763_offline_certification_20260803.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          lines = [
              "# PR #763 Offline Certification Complete",
              "",
              f"- Certified implementation SHA: `{implementation_sha}`",
              "- Offline verdict: `OFFLINE_GATES_CLOSED_LIVE_VERIFICATION_REQUIRED`",
              "- Live process started: `false`",
              "- PR remains draft and unmerged.",
              "",
              "## Gate status",
              "",
              "| Gate | Status | Proof |",
              "| --- | --- | --- |",
          ]
          for gate, row in gates.items():
              proof = row.get("proof") or row.get("verdict")
              if isinstance(proof, dict):
                  proof = f"returncode={proof.get('returncode')}"
              lines.append(f"| {gate} | {row['status']} | {proof} |")
          lines.extend(["", "## Test suites", ""])
          for name, row in suites.items():
              lines.append(
                  f"- {name}: `{row['tests']} tests`, `{row['failures']} failures`, "
                  f"`{row['errors']} errors`, `{row['duration_seconds']:.3f}s`."
              )
          lines.extend(["", "## Live verification boundary", ""])
          lines.extend(f"- {item}" for item in live_boundary)
          lines.extend([
              "",
              "No additional offline audit is authorized unless a concrete contradictory defect appears.",
              "Do not merge or claim production readiness from this offline certification.",
              "",
          ])
          Path("docs/pr763_offline_certification_20260803.md").write_text("\n".join(lines), encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/pr763_gate1_evidence_20260803.json \
            docs/pr763_callback_persistence_offline_certification_20260803.md \
            docs/pr763_offline_certification_20260803.json \
            docs/pr763_offline_certification_20260803.md
          git rm .github/workflows/_temporary_pr763_offline_finalizer.yml tools/apply_pr763_offline_repairs.py
          git commit -m "docs: certify PR763 offline gates and stop at live boundary"
          git push origin HEAD:campaign/unified-live-validation-pr748-756-v1
      - name: Upload PR763 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr763-offline-diagnostics
          path: |
            pr763-*-junit.xml
            pr763-*-pytest.log
            pr763-runner.log
            pr763-generated-evidence.json
            pr763-generated-certification.md
          if-no-files-found: error
          retention-days: 3
      - name: Enforce offline certification results
        if: always()
        shell: bash
        run: |
          test "${{ steps.gate1.outputs.status }}" = "0"
          test "${{ steps.structured.outputs.status }}" = "0"
          test "${{ steps.remaining.outputs.status }}" = "0"
          test "${{ steps.runner.outputs.status }}" = "0"
