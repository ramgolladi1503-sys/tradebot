name: Feed Resource Soak

on:
  workflow_dispatch:
    inputs:
      tier:
        description: Feed evidence tier to execute
        required: true
        default: soak
        type: choice
        options:
          - smoke
          - soak
          - certification
  schedule:
    - cron: "30 18 * * 1-6"
    - cron: "30 18 * * 0"

permissions:
  contents: read

concurrency:
  group: feed-resource-soak-${{ github.event_name }}-${{ github.event.schedule || inputs.tier || github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.tier == 'smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      DATA_ROOT: ${{ github.workspace }}/.runtime
      EXECUTION_MODE: PAPER
      KITE_USE_API: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run short feed smoke tier
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .runtime/ci
          PYTHONPATH=. pytest -q -o addopts='' \
            tests/test_feed_reconnect_resource_soak.py \
            -m "feed_smoke and not feed_soak and not certification" \
            --durations=20 | tee .runtime/ci/feed-smoke.log

      - name: Upload smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feed-smoke-${{ github.run_id }}
          if-no-files-found: warn
          path: .runtime/ci/feed-smoke.log

  soak:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '30 18 * * 1-6') ||
      (github.event_name == 'workflow_dispatch' && inputs.tier == 'soak')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      DATA_ROOT: ${{ github.workspace }}/.runtime
      EXECUTION_MODE: PAPER
      KITE_USE_API: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run extended feed soak tier
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .runtime/ci
          PYTHONPATH=. pytest -q -o addopts='' \
            tests/test_feed_reconnect_resource_soak.py \
            -m "feed_soak and not certification" \
            --durations=20 | tee .runtime/ci/feed-soak.log

      - name: Upload soak log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feed-soak-${{ github.run_id }}
          if-no-files-found: warn
          path: .runtime/ci/feed-soak.log

  certification:
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '30 18 * * 0') ||
      (github.event_name == 'workflow_dispatch' && inputs.tier == 'certification')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: .
      DATA_ROOT: ${{ github.workspace }}/.runtime
      EXECUTION_MODE: PAPER
      KITE_USE_API: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run 1000-cycle certification tier
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .runtime/ci
          PYTHONPATH=. pytest -q -o addopts='' \
            tests/test_feed_reconnect_resource_soak.py \
            -m "certification" \
            --durations=20 | tee .runtime/ci/feed-certification.log

      - name: Upload certification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feed-certification-${{ github.run_id }}
          if-no-files-found: warn
          path: .runtime/ci/feed-certification.log
