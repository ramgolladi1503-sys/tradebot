name: AI Certification Focused Diagnostics

on:
  push:
    branches:
      - feature/ai-qa-certification-agent-mvp

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      DATA_ROOT: ${{ github.workspace }}/.runtime
      EXECUTION_MODE: PAPER
      KITE_USE_API: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run focused certification tests
        id: focused
        shell: bash
        run: |
          set +e
          PYTHONPATH=. pytest -vv -o addopts='' tests/ai_certification \
            --junitxml=ai-cert-focused-junit.xml \
            > ai-cert-focused.log 2>&1
          status=$?
          echo "$status" > ai-cert-focused-status.txt
          cat ai-cert-focused.log
          exit 0

      - name: Upload focused diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: ai-cert-focused-diagnostics
          if-no-files-found: error
          path: |
            ai-cert-focused.log
            ai-cert-focused-junit.xml
            ai-cert-focused-status.txt

      - name: Enforce focused result
        shell: bash
        run: exit "$(cat ai-cert-focused-status.txt)"
