name: QA Apply Whole TradeBot Repairs V1

on:
  push:
    branches:
      - qa/whole-tradebot-certification-v1
    paths:
      - scripts/apply_whole_tradebot_qa_repairs_v1.py
      - .github/workflows/qa-apply-whole-tradebot-repairs-v1.yml

permissions:
  contents: write

jobs:
  apply_repairs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: .
      DATA_ROOT: ${{ github.workspace }}/.runtime
      EXECUTION_MODE: PAPER
      TRADING_MODE: PAPER
      KITE_USE_API: "false"
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: qa/whole-tradebot-certification-v1
          fetch-depth: 0

      - name: Apply exact repairs
        run: python scripts/apply_whole_tradebot_qa_repairs_v1.py

      - name: Harden reject-shadow primary fallback test path
        run: |
          python - <<'PY'
          from pathlib import Path

          module = Path('core/reject_shadow.py')
          text = module.read_text(encoding='utf-8')
          old = '        except sqlite3.OperationalError:\n            continue\n'
          new = '        except (OSError, sqlite3.Error):\n            continue\n'
          if text.count(old) != 1:
              raise SystemExit(f'unexpected reject-shadow exception matches={text.count(old)}')
          module.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/qa/test_whole_tradebot_security_boundaries.py')
          text = test.read_text(encoding='utf-8')
          old = '''    monkeypatch.setattr(reject_shadow.tempfile, "gettempdir", lambda: str(tmp_path))
    path = _fallback_db_path("desk/../../unsafe")
'''
          new = '''    monkeypatch.setattr(reject_shadow.tempfile, "gettempdir", lambda: str(tmp_path))
    blocked_parent = tmp_path / "primary-is-a-file"
    blocked_parent.write_text("blocked", encoding="utf-8")
    monkeypatch.setattr(
        reject_shadow,
        "_primary_db_path",
        lambda desk: blocked_parent / "tradebot.sqlite",
    )
    path = _fallback_db_path("desk/../../unsafe")
'''
          if text.count(old) != 1:
              raise SystemExit(f'unexpected security test matches={text.count(old)}')
          test.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies and scanners
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit

      - name: Run focused behavioral proof
        run: >-
          PYTHONPATH=. pytest -q -o addopts=''
          tests/qa/test_whole_tradebot_cross_module_truth.py
          tests/qa/test_whole_tradebot_security_boundaries.py
          tests/test_news_ingestor.py
          tests/test_db_guard.py
          tests/test_evidence_replay_report.py
          --durations=30

      - name: Require high-severity findings to be removed from repaired surfaces
        run: >-
          bandit -r
          core/opportunity_engine.py
          core/evidence_replay_report.py
          core/news_ingestor.py
          core/db_guard.py
          core/ai_certification/gemini_client.py
          core/intelligence/fetchers/http_fetcher.py
          core/reject_shadow.py
          core/analytics/schema.py
          core/candidate_journal.py
          core/expectancy/edge_ranking.py
          core/expectancy/setup_fingerprint.py
          core/intelligence/extractors/hardened_base.py
          core/trade_identity.py
          dashboard/ui/components.py
          dashboard/ui/table_model.py
          -ll

      - name: Verify patch scope
        run: |
          git diff --check
          git status --short
          test -n "$(git status --short)"

      - name: Commit validated repairs
        run: |
          git config user.name "tradebot-qa-bot"
          git config user.email "tradebot-qa-bot@users.noreply.github.com"
          git add \
            core/opportunity_engine.py \
            core/evidence_replay_report.py \
            core/news_ingestor.py \
            core/db_guard.py \
            core/ai_certification/gemini_client.py \
            core/intelligence/fetchers/http_fetcher.py \
            core/reject_shadow.py \
            core/analytics/schema.py \
            core/candidate_journal.py \
            core/expectancy/edge_ranking.py \
            core/expectancy/setup_fingerprint.py \
            core/intelligence/extractors/hardened_base.py \
            core/trade_identity.py \
            dashboard/ui/components.py \
            dashboard/ui/table_model.py \
            scripts/build_secure_kiteconnect_wheel.py \
            requirements.txt \
            tests/qa/test_whole_tradebot_cross_module_truth.py \
            tests/qa/test_whole_tradebot_security_boundaries.py
          git commit -m "fix: harden whole-tradebot truth and security boundaries"
          git push origin HEAD:qa/whole-tradebot-certification-v1
