name: dispersion-ignition-straddle-v1

on:
  pull_request:
    branches: [main]
    paths:
      - "research/dispersion_ignition_straddle_v1/**"
      - "scripts/run_dispersion_ignition_straddle_v1.py"
      - "scripts/audit_dispersion_ignition_straddle_v1.py"
      - "tests/research/test_dispersion_ignition_straddle_v1.py"
      - ".github/workflows/dispersion-ignition-straddle-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Pull bounded LFS evidence
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include="research/local_evidence_consolidation_v1/external_local_dirs/tradebot-ml-evidence/constituent-lead-lag-data-v1/proxy_campaign_2024_2025_v2/normalized/constituent_index_5m.parquet,research/local_evidence_consolidation_v1/external_local_dirs/tradebot-ml-evidence/upstox-expired-options-v1/**"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install research dependencies
        run: python -m pip install --upgrade pip pandas numpy pyarrow pytest

      - name: Run focused tests
        run: pytest -q tests/research/test_dispersion_ignition_straddle_v1.py

      - name: Run frozen campaign
        id: campaign
        shell: bash
        run: |
          set +e
          python scripts/run_dispersion_ignition_straddle_v1.py \
            --repo-root . \
            --output-dir runtime/research/dispersion_ignition_straddle_v1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run independent audit
        if: always()
        shell: bash
        run: |
          if [ -f runtime/research/dispersion_ignition_straddle_v1/final_decision.json ]; then
            python scripts/audit_dispersion_ignition_straddle_v1.py \
              --evidence-dir runtime/research/dispersion_ignition_straddle_v1 || true
          fi

      - name: Build evidence hashes
        if: always()
        shell: bash
        run: |
          root=runtime/research/dispersion_ignition_straddle_v1
          if [ -d "$root" ]; then
            find "$root" -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum > "$root/SHA256SUMS" || true
          fi

      - name: Upload research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dispersion-ignition-straddle-v1-evidence
          path: runtime/research/dispersion_ignition_straddle_v1
          if-no-files-found: error
          retention-days: 30

      - name: Enforce pipeline validity
        if: always()
        shell: bash
        run: |
          code="${{ steps.campaign.outputs.exit_code }}"
          if [ -z "$code" ]; then code=99; fi
          if [ "$code" -ne 0 ]; then
            echo "Campaign exited with $code"
            exit "$code"
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("runtime/research/dispersion_ignition_straddle_v1")
          decision = json.loads((root / "final_decision.json").read_text())
          audit = json.loads((root / "independent_audit_report.json").read_text())
          if decision["principal_verdict"] in {"DATA_CONTRACT_BLOCKED", "INVALID_EVIDENCE_PIPELINE"}:
              raise SystemExit(decision["principal_verdict"])
          if audit["verdict"] != "PASS_INDEPENDENT_AUDIT":
              raise SystemExit("independent audit failed")
          print(decision["principal_verdict"])
          PY
