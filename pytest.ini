[pytest]
pythonpath = .
testpaths = tests
norecursedirs = data logs
addopts = -m "not integration and not feed_smoke and not feed_soak and not certification"
filterwarnings =
    ignore:jsonschema.RefResolver is deprecated.*:DeprecationWarning:altair.utils.schemapi
markers =
    unit: deterministic unit test (default gate)
    component: single-module behavior with deterministic fake inputs
    integration: requires network/secrets/external dependencies; excluded by default
    behavior: intended product behavior, not implementation-shape testing
    safety: fail-closed safety boundary test
    edge: protects, proves, measures, or improves trading edge
    regression: prevents a known bug from returning
    ui_read_model: dashboard/read-model truth test
    replay: deterministic replay or backtest truth test
    chaos: malformed, corrupt, stale, or destructive input test
    broker_firewall: proves broker/network/order paths cannot be reached during tests
    feed_smoke: short deterministic feed lifecycle checks, excluded from the default suite and run only for feed-related changes
    feed_soak: extended feed resource checks (roughly 50-100 cycles), excluded from ordinary PR CI
    certification: expensive certification-grade evidence such as 1000-cycle resource proofs, scheduled or manually dispatched
